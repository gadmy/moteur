<!-- Courier Prime — NON BLOQUANTE. Une feuille de style classique empeche le
     navigateur de peindre quoi que ce soit tant qu'elle n'est pas arrivee.
     L'astuce media="print" la fait charger sans bloquer, puis onload la rend
     active. Le repli noscript sert aux navigateurs sans JavaScript. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" media="print" onload="this.media='all'; this.onload=null;">

<!-- Supabase SDK — DEFER : sans lui, le navigateur ARRETE de lire la page tant que
     ce fichier n'est pas arrive du CDN, donc la page d'accueil ne s'affiche pas.
     Avec defer il se telecharge en parallele et s'execute a la fin de la lecture.
     C'est sans risque ici : initSupabase() ne suppose PAS que la librairie est
     deja la, il la guette toutes les 100 ms (voir tryInit). -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
