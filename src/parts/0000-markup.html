MÉTHODE DE TRAVAIL
==================

Ce projet est développé en collaboration avec Claude (Anthropic).
À chaque nouvelle conversation :

0. DEPUIS v599, LE FICHIER EST DECOUPE. index.html est GENERE : on édite
   les morceaux de src/parts/ (un fichier par module, ~12 Ko en moyenne),
   puis « node tools/build.mjs » recolle le tout. La concaténation redonne
   le fichier à l'octet près — aucune transformation n'a lieu au passage.
   « node tools/build.mjs --check » vérifie sans rien écrire, et l'action
   GitHub le lance à chaque push. Ne JAMAIS éditer index.html directement.
1. Le dépôt est cloné dans la session ; Claude travaille UNIQUEMENT sur les
   fichiers du dépôt, jamais de mémoire. (Avant v599 : le fichier HTML
   unique était uploadé en début de conversation.)
2. L'utilisateur explique la fonctionnalité ou la correction souhaitée.
3. Claude applique lui-même les modifications sur le fichier avec ses
   outils (petits remplacements ciblés à ancre unique, jamais de réécriture
   complète, jamais de gros bloc d'un coup) ; grosses modifs découpées en
   plusieurs patchs successifs.
4. Après chaque lot : node --check sur les scripts, équilibre des balises,
   puis le fichier mis à jour est re-présenté pour téléchargement. Pas de
   code dans les réponses : un résumé bref de ce qui a changé, c'est tout.
5. Utilisateur non codeur : vocabulaire technique simplifié, réponses
   réduites au minimum vital pour comprendre.
6. Contraintes techniques : pas de bandeaux ═ (U+2550), pas d'emoji dans les
   doc.text() de jsPDF, pas d'IIFE async.
7. L'utilisateur teste dans le navigateur (recharger cache vide :
   Ctrl+Shift+R).
8. VERSION : un seul numéro, celui affiché dans l'appli sous la forme
   "vvXXX" (double v, grep-able) — PAS de numérotation séparée dans ce
   journal. Le développeur décide SEUL quand ce numéro change ; Claude ne le
   touche jamais de sa propre initiative, ni le numéro affiché ni le journal
   ci-dessous. Uniquement quand l'utilisateur dit explicitement "changement
   de conversation" : Claude résume proprement le journal de la version en
   cours (même style que les entrées précédentes), ouvre la nouvelle entrée
   "vvXXX+1" avec un journal vide, et met à jour le numéro affiché dans
   l'appli en conséquence. Ce journal vide se remplit au fil des échanges de
   la conversation qui suit, jusqu'au prochain "changement de conversation".

  POSTE — le chef de chaque departement doit y retrouver sa personne ; seuls les
  tableaux de LOGISTIQUE sont regroupes. PIEGE TRAITE : une cle de covoiturage
  enregistree peut viser un AUTRE poste que celui retenu par le regroupement ;

  l'affichage.

  permis et agenda (dispos / indispos) vivaient dans CHAQUE casquette :
  dupliquer une fiche technicien dupliquait l'agenda, et corriger ses indispos
  sur une fiche laissait les autres perimees. Ces champs quittent

  dessein : hidePhone (choix d'affichage public, carte par carte) et agentPhone
  (l'agent ne concerne que le comedien). La fiche unifiee lit et reecrit ces
  champs sur le profil, sur un CLONE : les editeurs mutent les tableaux en place,
  sans clone une modification du calendrier touchait le profil meme en refermant
  sans enregistrer. MIGRATION DOUCE (_liftCommonToProfile, jouee au chargement de
  ses propres profils) : la premiere valeur trouvee dans les casquettes remonte
  au profil quand celui-ci n'a rien, puis la cle est EFFACEE de toutes les
  casquettes. Cet effacement est le coeur de la migration : partout la lecture
  est « casquette, sinon profil », et une copie oubliee continuerait de gagner —
  y compris un TABLEAU VIDE, vrai en JavaScript, qui aurait masque l'agenda
  remonte. Les profils des autres ne sont pas touches : tant que leur
  proprietaire n'a pas sauvegarde, leurs casquettes font foi et le repli sur le
  profil joue tout seul.

  AJOUT D'UNE FICHE TECHNICIEN — LA TUILE « + ». Le bouton « Dupliquer » quitte
  l'interieur de la fiche : on ajoute une fiche la ou on les voit toutes, pas
  depuis l'une d'elles. La grille de Mon Profil porte desormais une tuile
  « + Ajouter un profil technicien ». La nouvelle fiche reprend ce qui tient a la

  defaut la casquette comedien. L'age et la date de naissance ne sont pas listes :
  ils vivent deja sur le profil, communs a toutes les casquettes. Le METIER
  (departement, fonction, parcours, bande demo, tarif) et l'email de CONTACT ne
  sont jamais repris. Les valeurs copiees sont CLONEES : deux fiches ne partagent
  jamais le meme tableau de permis. Les emplacements vides n'ont plus de tuile
  grisee a eux (activateCrewCard supprimee, plus aucun appelant) : la tuile « + »
  reprend d'elle-meme le premier emplacement libre — donc le premier quand aucune
  fiche n'existe encore. GARDE : un emplacement REFERME mais non vide est rouvert
  tel quel, jamais ecrase (_crewCardHasContent) — « Refermer » promet de garder
  les donnees. Le numero affiche sur les tuiles suit les fiches REMPLIES et non
  l'index du tableau, sans quoi un emplacement laisse vide donnait un « n°2 »
  sans « n°1 ».

vv599 (19 septembre 2026) — PUBLIE.

  DECOUPAGE DU FICHIER UNIQUE. index.html (4,62 Mo, 83 800 lignes) devient un
  fichier GENERE, reconstruit par tools/build.mjs a partir de 106 morceaux
  ranges dans src/parts/ : 98 fichiers JavaScript (12 Ko en mediane, 65 sous
  les 20 Ko), 2 feuilles de style, 6 blocs de page. Le decoupage suit les
  declarations de module de premier niveau ; le code qui suit un module sans
  en ouvrir un autre reste attache au morceau precedent.
  CHOIX CENTRAL : les morceaux sont des TRANCHES BRUTES du fichier, remises
  bout a bout dans l'ordre de leur prefixe numerique. Aucune transformation,
  donc la reconstruction redonne le fichier a l'OCTET PRES — verifie par
  empreinte SHA-256 identique avant et apres le premier decoupage. C'est ce
  qui rend ce chantier verifiable au lieu d'etre un pari.
  ECARTE : le passage a de vrais modules JavaScript (import / export). Les 95
  modules partagent aujourd'hui une seule portee ; les separer demanderait de
  reecrire toutes leurs references entre eux, casserait l'ouverture du fichier
  en double-clic (les navigateurs bloquent les modules en protocole file:) et
  imposerait 95 requetes au demarrage sans etape de construction.
  REGLE : ne JAMAIS editer index.html a la main. L'action GitHub
  « verifier-build » relance la reconstruction a chaque push et echoue si le
  fichier publie ne correspond plus a src/parts/.

  VIGNETTES DU STORYBOARD — CINQ PASSES, ET LA CAUSE ETAIT EN BASE. Symptome :
  dans la liste des plans, les images n'apparaissaient qu'apres avoir ouvert
  PUIS referme la fiche d'un plan, et alors toutes d'un coup. Quatre hypotheses
  successives sur le RENDU, toutes vraies mais toutes partielles, avant qu'une
  requete SQL ne donne la reponse. Dans l'ordre ou elles ont ete fermees :
    1) LES BLOBS REVOQUES. Les dessins ne passent pas par le cache d'images du
       navigateur : ils sont telecharges en blob par le SDK
       (StoryboardExport._resolveBlobUrl), et _loadPrintImg REVOQUAIT l'URL
       juste apres l'avoir dessinee — chaque rendu retelechargeait donc tout.
       Cache borne (150 entrees), demandes simultanees mutualisees, vide au
       changement de projet, plus de revocation apres dessin.
    2) LE CANVAS ORPHELIN. renderDrawingData capturait le CONTEXTE du canvas a
       l'appel, alors que les calques se dessinent APRES telechargement : un
       second rendu entre-temps et la peinture atterrissait dans un canvas
       retire du document. La fonction recoit desormais un IDENTIFIANT et
       retrouve le canvas au moment de peindre. Les calques sont aussi dessines
       l'un apres l'autre, dans l'ordre du dessin, et non plus dans leur ordre
       d'arrivee (un calque lourd du dessous recouvrait ceux du dessus).
    3) UNE GARDE QUI NE PASSAIT JAMAIS. La repeinte de fin de chargement etait
       gardee par « state.currentShotId === null ». Or state.currentShotId
       N'EXISTE PAS dans le code : la condition valait undefined === null, soit
       FAUX EN PERMANENCE. Defaut present DEUX FOIS (objets image et icones
       SVG). Remplacee par la bonne condition — ne pas redessiner la liste
       pendant qu'on EDITE un plan — avec repeinte coalescee
       (Storyboard.planifierRepeinteVignettes).
    4) L'UNIQUE TENTATIVE BRULEE. getOrCreateUploadedImage posait
       « img.src = Utils.signedUrlFor(...) » sans verifier le resultat ; cette
       fonction rend le CHEMIN BRUT tant que l'URL n'est pas signee, l'echec
       etait memorise DEFINITIVEMENT et l'image ne reessayait jamais. On
       s'abstient desormais sans rien mettre en cache. Puis, le diagnostic
       montrant « repeintes : 0 » et un cache vide, deuxieme chemin ajoute :
       URL directement utilisable (http, data:, blob:), sinon telechargement
       par le SDK comme les calques.
    5) LA VRAIE CAUSE, EN BASE. Le bucket 'projects' est PRIVE, et les 32
       objets image du projet teste stockaient une URL de forme
       /object/public/projects/... : une adresse publique sur un bucket prive
       est TOUJOURS refusee, ces images ne pouvaient jamais se charger.
       Utils.migrateProjPathsInData convertit justement ces URLs en chemins
       bruts, mais son appel dans Store etait garde par un drapeau BOOLEEN
       (_mediaPathsMigrated) : une fois pose, la migration ne repassait plus
       jamais, et les medias ajoutes APRES restaient en forme publique pour
       toujours (drapeau deja a true sur le projet, 7 projets sur 38 marques).
       Le drapeau devient VERSIONNE (valeur 2) : la migration, idempotente,
       rejoue une fois pour tout le monde.
  DEFENSE AJOUTEE, car la donnee peut redevenir sale : une URL de media projet
  n'est PLUS JAMAIS posee telle quelle — URL signee si le cache a repondu,
  sinon telechargement par le SDK ; data:, blob: et externes restent directes.
  Et les vignettes empruntent desormais le chemin de l'apercu plein ecran, seul
  a avoir toujours marche (Storyboard.dessinerObjetsImage, calquee sur
  StoryboardExport._loadPrintImg).
  TROIS REGLES A GARDER : pour une image qui ne s'affiche pas, REGARDER D'ABORD
  CE QUI EST STOCKE ; quand un ecran affiche un media et qu'un autre ne
  l'affiche pas sur la MEME donnee, faire emprunter au second le chemin du
  premier plutot que de le reparer ; et chercher, dans tout audit, les gardes
  qui comparent une propriete jamais ecrite — elles ne levent aucune erreur et
  desactivent silencieusement le code qu'elles protegent.
  OUTILS DE DIAGNOSTIC laisses en place : app.Storyboard.diagVignettes() liste

  meme raison l'adresse et la cle publique de la base sont declarees AVANT
  l'application (MOTEUR_SUPABASE), qui les reprend : une seule source.
  LA TABLE EST EN ECRITURE SEULE pour le public : on peut y deposer, jamais y
  lire ni y modifier. L'insertion est ouverte meme aux visiteurs non connectes,
  sans quoi on ne verrait jamais les pannes d'ouverture de session — justement
  les plus graves. Garde-fous contre l'inondation : longueurs bornees cote
  base, et cote navigateur une meme erreur n'est envoyee qu'UNE fois par
  session, dix erreurs au plus par session.
  ECARTE DU FLUX : les extensions du navigateur (ce n'est pas notre code),
  « Script error. » (un script d'un autre domaine, sans message ni ligne :
  il n'apprend rien) et la boucle ResizeObserver. Rien n'est envoye non plus
  en ouverture locale du fichier (file://) : c'est qu'on est en train de
  tester. MENAGE : purge_client_errors() efface au-dela de 60 jours.

  LES RETOURS UTILISATEURS AUSSI, ET UNE SEANCE DE TRI. Les remarques ecrites
  depuis « Vos remarques » partaient en MAIL une fois par jour, et la file
  locale etait videe ensuite : la seule trace vivait dans une boite mail — qui
  ne se trie pas, ne se compte pas et ne se relit pas a deux. Elles sont
  desormais deposees dans une table (client_feedback,
  sql/remontee_retours.sql), lue par l'onglet « Retours » du tableau de bord.
  LE MAIL QUOTIDIEN EST SUPPRIME (decide dans la foulee) : il faisait doublon
  avec cette table. Deux consequences assumees, a ne pas defaire l'une sans
  l'autre : les retours sont ANONYMES — l'adresse de la personne n'est pas
  enregistree, et elle n'est plus nulle part ailleurs, donc PLUS MOYEN de
  recontacter quelqu'un depuis un retour ; qui a vraiment besoin d'une reponse
  ecrit directement a l'editeur. Et il n'y a plus de filet hors base : si le
  depot echoue, la file locale n'est PAS videe et repart le lendemain, comme
  le faisait deja le mail en cas d'echec.
  LE RYTHME NE CHANGE PAS : on depose a minuit ce qui date d'un jour
  ANTERIEUR, jamais ce qui vient d'etre ecrit — c'est ce qui laisse a la
  personne le temps de relire, corriger ou retirer sa remarque.
  NOUVEL ONGLET « 💬 Retours » cote admin : filtre par type, urgence en trois
  crans (urgent / normal / plus tard), marquage traite, tri automatique des
  urgents en tete. Et surtout le bouton « Copier pour analyse », qui reunit en
  UN seul texte les retours ET les erreurs encore en attente — c'est la
  matiere d'une seance de tri : classer par urgence, puis reparer.
  PAS DE PURGE pour les retours, contrairement aux erreurs : une erreur de
  l'an dernier n'apprend plus rien, une idee d'utilisateur si.

  LA PASTILLE COMPTE TOUT, ET SANS QU'ON AIT A CHERCHER. Premiere version
  ratee, corrigee aussitot : les pastilles des deux nouveaux onglets ne se
  posaient qu'une fois l'onglet OUVERT — autrement dit elles ne prevenaient de
  rien, alors que c'est leur seule raison d'etre. Le compte est desormais fait
  au chargement du tableau de bord, puis toutes les deux minutes, par la
  fonction qui servait deja aux signalements. Celle-ci ne comptait que les
  signalements ; elle additionne maintenant signalements + erreurs + retours
  sur le bouton « 🛡️ Admin », et pose au passage le compte propre a chaque
  onglet. Les ERREURS sont comptees DISTINCTES, comme l'onglet les affiche :
  une pastille a « 200 » pour un seul bug qui boucle ne dirait rien d'utile.

  LE MODE SOMBRE NE RETOURNAIT PAS LES PANNEAUX-DOCUMENTS. Signale sur le
  synopsis, verifie partout : quatre panneaux etaient peints en dur (blanc de
  fond, texte quasi noir) au lieu d'utiliser les variables de theme, et
  restaient donc eclatants de blanc en mode sombre — la page A4 du SYNOPSIS,
  l'editeur de FEUILLE DE SERVICE, le document des CONTRATS et le PLAN DE
  TRAVAIL. Tous passent aux variables. Au passage, trois panneaux d'interface
  qui avaient le meme defaut : la palette du mood board, la roue chromatique et
  le menu d'etoiles des rapports de script, plus l'apercu d'une version de
  scene et l'encadre de detail de l'assistant.
  L'EDITEUR DE SCENARIO, lui, etait deja correct (var(--panel-bg)) : le defaut
  ne touchait pas tout, d'ou l'interet de verifier plutot que de supposer.
  DEUX PIEGES TRAITES, qui font la difference entre corriger et casser :
    - IMPRESSION. Ces panneaux sont des documents qu'on imprime. Une fois
      passes au theme, imprimer en mode sombre aurait donne des pages noires.
      Plutot que de rattraper chaque regle, une seule bascule redefinit les
      VARIABLES en clair sous @media print — tout ce qui les utilise
      redevient blanc d'un coup. « body.dark-mode » doit y figurer nommement,
      sinon la declaration du theme sombre, plus specifique, continue de
      gagner.
    - TEXTE DEVENU INVISIBLE. Eclaircir un fond sans regarder ce qui est
      ECRIT dessus fabrique du noir sur noir : le titre de la palette du mood
      board, les boutons de la feuille de service et ses accents (liens en
      bleu fonce, mentions en rouge sombre) ne tenaient que sur du blanc. Ils
      passent aux variables ou a --primary / --danger.
  NE SONT PAS TOUCHES, a dessein : les surfaces de DESSIN (calque storyboard,
  toile du mood board) et les APERCUS D'IMPRESSION du storyboard — ces
  dernieres sont photographiees par html2canvas pour le PDF, les assombrir
  ruinerait l'export. Les pages du lecteur externe non plus : elles n'ont pas
  de mode sombre du tout.
  TROUVE EN CHEMIN : une regle « [data-theme=dark] » sur la roue chromatique,
  morte depuis toujours — l'application marque le theme par la classe
  « dark-mode » sur le corps de page, jamais par cet attribut. Supprimee.
  Encore une garde qui ne passait jamais (voir la lecon de v599).

  A RETENIR : quand deux ecrans decrivent la meme chose, chercher s'ils lisent
  la MEME table. Ici trois listes de postes coexistaient — le referentiel, une
  copie figee dans le formulaire supprime, et celle de l'Univers — et la
  recherche tombait dans l'ecart entre elles.

  UN CORPS, PLUSIEURS POSTES : les trois « restes » notes en fin de v598
  (agenda du Planning, tableaux transport ecran et PDF, « Dupliquer » du profil
  public) etaient en realite DEJA traites par les etapes 2 et 3 de cette meme
  version — PersonIdentity.dedupe pour l'agenda et les transports,
  FACET_COMMON_KEYS et CREW_NEW_INHERIT pour la duplication. Ce paragraphe,
  ecrit avant ces etapes, est retire de l'historique.
