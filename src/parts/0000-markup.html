  reseau. La sauvegarde repondait « verifiez votre connexion » a tout echec, ce
  qui aurait envoye chercher du cote du wifi pendant des heures. Elle rend
  desormais la phrase du serveur quand c'est un refus.

  L'INACTIVITE MET EN VEILLE, ELLE N'EJECTE PLUS. Trois minutes sans rien
  toucher renvoyaient au tableau de bord. Le but etait bon — ne pas laisser
  quelqu'un bloquer une section pendant qu'il est parti boire un cafe — mais le
  remede etait brutal : on perdait sa page, son onglet, l'endroit ou l'on en
  etait. Demande du developpeur, mot pour mot : « je veux juste pas qu'on se
  deconnecte ; juste on perd le focus sur l'element ou on etait, et il faudra
  recliquer pour etre sur de pas bloquer quelque chose quelque part. »
  ON RESTE DONC DANS LE PROJET et l'on rend seulement ce qu'on tenait : la
  section fine (scene ou section de synopsis) ET le verrou d'onglet.
  IL FALLAIT SORTIR LE CURSEUR, PAS SEULEMENT LACHER LES VERROUS — sinon le
  verrou fin, qui SUIT le curseur, se serait repris dans la seconde et l'on
  n'aurait rien lache du tout. Le curseur quitte la zone, la selection est
  effacee, et c'est le clic suivant qui reprend la main.
  LE PIEGE, VU A TEMPS : depuis la veille, les verrous sont RELUS toutes les
  vingt secondes (filet pose apres le canal temps reel muet). Or cette relecture
  reprend automatiquement l'onglet courant quand il est libre — elle aurait donc
  repris la section vingt secondes apres la mise en veille, et la mise en veille
  n'aurait servi a rien. Trois endroits reprennent ainsi tout seuls ; les trois
  s'abstiennent desormais pendant la veille. Une correction en cache une autre :
  celle de la veille pouvait annuler celle du jour sans que rien ne le signale.
  CE QU'ON A GARDE DE L'EJECTION : elle SAUVEGARDAIT avant de partir. C'est la
  seule partie qu'il ne fallait surtout pas perdre — elle est faite avant de
  lacher quoi que ce soit. Et elle ne se declenche toujours qu'a PLUSIEURS
  reellement connectes et dans l'editeur : seul sur son projet, personne n'est
  mis en veille, il n'y a personne a qui rendre la place.

  « ENREGISTRE » ALORS QUE RIEN N'ETAIT PARTI — LE MODE FICHE RESTAIT COINCE.
  La vraie cause du signalement du 21 septembre, trouvee grace a une precision
  du developpeur : le message de REUSSITE s'affichait, et la console etait
  VIDE. Deux faits qui, ensemble, ne laissent qu'un endroit possible — une
  sortie silencieuse de la sauvegarde, avant toute ecriture.
  C'ETAIT LA PREMIERE LIGNE DE save(). Quand on edite une casquette depuis la
  page Profil, le moteur a besoin d'un projet : on lui en PRETE un vide, et le
  drapeau _engineMode empeche la sauvegarde de projet de partir — sans quoi on
  enregistrerait ce decor pret A LA PLACE du vrai projet. La garde est juste.
  LE DEFAUT EST QU'ELLE NE REDESCENDAIT QUE PAR LA PORTE PREVUE : tout ce qui
  faisait disparaitre le volet autrement — une navigation, un rendu qui refait
  la page — laissait le drapeau leve. Et alors TOUTE sauvegarde de projet
  repartait aussitot, sans erreur, sans message, sans rien dans la console.
  CE N'ETAIT DONC PAS UN DEFAUT DES DROITS : « Gerer les acces » n'a fait que
  le REVELER, parce que c'est le seul ecran qui annonce lui-meme la reussite.
  Tout le reste — scenario, depouillement, planning — se taisait pareil.
  DEUX REPARATIONS, ET UNE TROISIEME PAR PRINCIPE :
    - ON NE FAIT PLUS CONFIANCE AU DRAPEAU SEUL. Le volet est la preuve : s'il
      n'est plus a l'ecran, le mode est termine quoi qu'en dise le drapeau, et
      l'on remet en place le projet et le role qu'on avait pretes.
    - OUVRIR UN PROJET remet le mode a zero, deuxieme filet.
    - ET LA SAUVEGARDE NE SE TAIT PLUS quand elle refuse : elle renvoie false,
      et « Gerer les acces » dit alors que rien n'a ete enregistre au lieu
      d'annoncer une reussite. Un ecran qui ment sur une sauvegarde coute plus
      cher que la panne elle-meme : on cherche des heures du mauvais cote.
  LECON, la meme que pour les verrous de la veille : une garde POSEE SUR UN
  ETAT QU'ON MET A JOUR A LA MAIN finit toujours par rester coincee. Quand
  l'etat est deja visible quelque part — ici, un volet present ou absent — il
  faut le LIRE, pas le recopier.

  LE POIDS DU PROJET S'AFFICHE EN MEGAOCTETS SEULEMENT. « X Ko (Y Mo) »
  n'apprenait rien et encombrait la carte. Deux decimales sous 10 Mo, une seule
  au-dessus — a 24 Mo le centieme de mega ne veut plus rien dire — et jamais
  « 0 Mo » pour un projet qui existe : on montre « < 0,01 Mo ».

  UN PRESET DE DROITS NE DOIT PAS FERMER CE QU'IL NE CONNAIT PAS. Cherche apres
  un signalement du 21 septembre sur « Gerer les acces ». Le tableau des droits
  compte VINGT sections ; les presets de METIER (comedien, technicien, chef de
  poste, et les douze intitules) en definissent QUATORZE. Ils ont ete ecrits
  avant presentation, moodboard, ressources, rapports de script, depenses et
  contrats. La ligne remplissait donc ces six-la avec « aucun acces » : choisir
  « Comedien » RETIRAIT six acces sans le dire.
  LA REGLE EXISTAIT DEJA, A COTE : _normalize dit depuis longtemps qu'une
  section absente vaut LECTURE, jamais blocage — precisement pour qu'ajouter une
  section au tableau ne la referme pas pour tous les membres deja enregistres.
  Elle n'etait simplement pas appelee la. Elle l'est maintenant, dans applyPreset
  et dans les QUATRE sorties de getForMember, dont une seule sur quatre y passait.
  Ajouter une section demain ne refermera donc plus rien derriere nous.
  CE QUE CELA NE PROUVE PAS : que c'etait bien le defaut signale. Le reste a ete
  verifie et repond correctement — les 738 boutons de l'application pointent
  tous vers une fonction qui existe, et le tableau, les presets et la recolte
  des cases passent leurs tests dans un vrai DOM. La question reste ouverte au
  RESTE A FAIRE plutot que declaree reglee.

  « JE NE TROUVE PAS LA FICHE » ET « JE N'AI PAS LE DROIT DE LA VOIR » SONT DEUX
  CHOSES DIFFERENTES. Signale le 21 septembre sur un vrai projet a deux : B a
  acces au Depouillement mais pas aux onglets Personnages, Decors et Ressources.
  Chez A tout est rattache ; chez B, le depouillement declarait TOUS ses
  elements « sans fiche » et lui proposait d'en creer des centaines — en double
  de celles qui existent deja, et invisibles pour lui.
  CAUSE : le cloisonnement (v578) retire de la reponse serveur les cles
  auxquelles on n'a pas acces, et Store.getEmpty les recree VIDES pour que le
  reste de l'application ne plante pas. Un tableau vide et un tableau qu'on n'a
  pas le droit de lire se ressemblent trait pour trait — et tout ce qui conclut
  a une absence s'y trompait.
  LE GARDE-FOU EXISTAIT DEJA POUR L'ECRITURE, pas pour la LECTURE : la
  sauvegarde retire du paquet les cles cachees (sinon on effacerait le budget de
  tout le monde en enregistrant), et le declencheur SQL dit la meme chose cote
  serveur. Rien n'avait ete pose du cote des conclusions qu'on TIRE de ces
  tableaux vides. Aucune donnee n'a donc ete perdue — les fiches creees par B
  n'auraient meme pas ete enregistrees — mais l'ecran mentait, et la reparation
  proposee aurait fabrique le desordre qu'elle pretendait corriger.
  CORRECTION, UNE SEULE PORTE : Links.masquee(famille) repond a la question
  « cette famille m'est-elle cachee ? », a cote de la table qui relie deja les
  familles a leurs collections. Ce qui en decoule :
    - le controle des liens IGNORE les familles hors de portee — on ne conclut
      rien sur des donnees qu'on n'a pas — et le DIT, en toutes lettres, dans
      la fenetre de controle comme sur le compteur (« partiel ») ;
    - un element dont la fiche est cachee est montre RATTACHE, pas orphelin,
      avec pour explication « fiche rattachée, mais vous n'avez pas accès a
      cette section » ;
    - on ne rattache ni ne cree dans une famille cachee : on ne verrait pas les
      fiches existantes, donc on en fabriquerait forcement des doublons ;
    - meme regle dans l'autre sens, la ou elle manquait aussi : sans acces aux
      scenes, on ne propose plus de supprimer un decor ou un personnage « qui
      ne sert plus dans aucune scene ». Celui-la n'avait encore blesse
      personne, mais c'est exactement le meme raisonnement — et lui EFFACE.
  LA REGLE, pour tout ce qu'on ecrira ensuite : AVANT DE CONCLURE QU'UNE DONNEE
  MANQUE, DEMANDER SI ON AVAIT LE DROIT DE LA VOIR. Un tableau vide n'est pas
  une reponse, c'est parfois une porte fermee.

  LA LECON, ET ELLE EST DURE : les trois etapes precedentes etaient justes dans
  leur mecanique et fausses dans leur PREMISSE. On avait construit sur « les
  ecrans portent l'identifiant de leurs scenes » et sur « les ecritures passent
  par saveScene », deux choses qu'il suffisait de verifier et qu'on n'avait pas
  verifiees. Un mecanisme juste branche sur rien ne fait rien — et il en a
  l'air. Verifier ce a quoi on se branche vaut mieux que verifier ce qu'on
  branche.
