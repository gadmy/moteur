MÉTHODE DE TRAVAIL
==================

Ce projet est développé en collaboration avec Claude (Anthropic).
À chaque nouvelle conversation :

0. DEPUIS v599, LE FICHIER EST DECOUPE. index.html est GENERE : on édite
   les morceaux de src/parts/ (un fichier par module, ~12 Ko en moyenne),
   puis « node tools/build.mjs » recolle le tout. La concaténation redonne
   le fichier à l'octet près — aucune transformation n'a lieu au passage.
   « node tools/build.mjs --check » vérifie sans rien écrire, et l'action
   GitHub le lance à chaque push. Ne JAMAIS éditer index.html directement.
1. Le dépôt est cloné dans la session ; Claude travaille UNIQUEMENT sur les
   fichiers du dépôt, jamais de mémoire. (Avant v599 : le fichier HTML
   unique était uploadé en début de conversation.)
2. L'utilisateur explique la fonctionnalité ou la correction souhaitée.
3. Claude applique lui-même les modifications sur le fichier avec ses
   outils (petits remplacements ciblés à ancre unique, jamais de réécriture
   complète, jamais de gros bloc d'un coup) ; grosses modifs découpées en
   plusieurs patchs successifs.
4. Après chaque lot : node --check sur les scripts, équilibre des balises,
   puis le fichier mis à jour est re-présenté pour téléchargement. Pas de
   code dans les réponses : un résumé bref de ce qui a changé, c'est tout.
5. Utilisateur non codeur : vocabulaire technique simplifié, réponses
   réduites au minimum vital pour comprendre.
6. Contraintes techniques : pas de bandeaux ═ (U+2550), pas d'emoji dans les
   doc.text() de jsPDF, pas d'IIFE async.
7. L'utilisateur teste dans le navigateur (recharger cache vide :
   Ctrl+Shift+R).
8. VERSION : un seul numéro, celui affiché dans l'appli sous la forme
   "vvXXX" (double v, grep-able) — PAS de numérotation séparée dans ce
   journal. Le développeur décide SEUL quand ce numéro change ; Claude ne le
   touche jamais de sa propre initiative, ni le numéro affiché ni le journal
   ci-dessous. Uniquement quand l'utilisateur dit explicitement "changement
   de conversation" : Claude résume proprement le journal de la version en
   cours (même style que les entrées précédentes), ouvre la nouvelle entrée
   "vvXXX+1" avec un journal vide, et met à jour le numéro affiché dans
   l'appli en conséquence. Ce journal vide se remplit au fil des échanges de
   la conversation qui suit, jusqu'au prochain "changement de conversation".

  imposerait 95 requetes au demarrage sans etape de construction.

  « verifier-build » relance la reconstruction a chaque push et echoue si le

  dans la liste des plans, les images n'apparaissaient qu'apres avoir ouvert

    1) LES BLOBS REVOQUES. Les dessins ne passent pas par le cache d'images du

    2) LE CANVAS ORPHELIN. renderDrawingData capturait le CONTEXTE du canvas a
       l'appel, alors que les calques se dessinent APRES telechargement : un
       second rendu entre-temps et la peinture atterrissait dans un canvas
       retire du document. La fonction recoit desormais un IDENTIFIANT et
       retrouve le canvas au moment de peindre. Les calques sont aussi dessines

       d'arrivee (un calque lourd du dessous recouvrait ceux du dessus).

       FAUX EN PERMANENCE. Defaut present DEUX FOIS (objets image et icones
       SVG). Remplacee par la bonne condition — ne pas redessiner la liste
       pendant qu'on EDITE un plan — avec repeinte coalescee

    4) L'UNIQUE TENTATIVE BRULEE. getOrCreateUploadedImage posait
       « img.src = Utils.signedUrlFor(...) » sans verifier le resultat ; cette
       fonction rend le CHEMIN BRUT tant que l'URL n'est pas signee, l'echec

  liste. Langues sur les DEUX casquettes, sports sur le comedien seul, comme
  avant. DEUX ECRITURES A CHAQUE CHANGEMENT, et c'est le point important : la
  liste detaillee (languagesWithLevels / sportsWithLevels) ET le texte libre
  (languages / sports). Le texte libre reste ce que lisent l'Univers, les
  autres ecrans et les PDF ; le desynchroniser rendrait introuvable un profil
  pourtant rempli. Chez le comedien, la brique remplace les deux champs texte
  de « Description physique » : deux saisies pour la meme donnee finissent
  toujours par diverger. Migration douce a l'ouverture.

  DEPARTEMENTS ET POSTES DES TECHNICIENS : QUATRE DEFAUTS SUR LE MEME CHEMIN,
  celui de la recherche dans l'Univers. Verification demandee apres le retrait
  du formulaire ; elle en a trouve plus que prevu.
    1) FICHE TECHNICIEN SANS AUCUN DEPARTEMENT (regression du lot 1). La liste
       etait lue dans un SELECTEUR de l'ancien formulaire. Celui-ci supprime,
       elle revenait vide : plus de departement, donc plus de fonction, donc un
       profil introuvable. Elle vient desormais du REFERENTIEL
       (CONFIG.crewGroups), comme les fonctions l'etaient deja.
    2) LE FILTRE « FONCTION » DE L'UNIVERS NE POUVAIT RIEN TROUVER. Il avait sa
       PROPRE table de postes, avec ses propres identifiants de departement
       ('image', 'lumiere'...) et ses propres orthographes ('Cadreur',
       'Perchman'). Or le selecteur Departement est rempli depuis
       CONFIG.crewGroups ('gc1', 'gc2'...) : choisir un departement ne donnait
       AUCUNE fonction, et sans departement la liste proposait des libelles que
       pas un profil ne porte. Table supprimee, referentiel commun. « Autre »
       est ecarte des filtres : c'est une porte de sortie de saisie.
    3) LE DEPARTEMENT CHOISI DANS LA FICHE N'ARRIVAIT PAS JUSQU'A LA RECHERCHE.
       L'Univers filtre sur le champ PLAT du profil, et 'department' n'est pas
       dans FACET_SWAP_KEYS — l'y mettre donnerait un departement a la casquette
       comedien, qui l'effacerait en passant. Rien ne le recopiait donc. Il
       remonte maintenant au profil a l'enregistrement, jamais ecrase par du
       vide.
    4) UNE DEUXIEME FICHE TECHNICIEN ETAIT INTROUVABLE. Depuis v597 un compte
       peut en porter plusieurs ; les champs plats n'en decrivent qu'une. Les
       filtres interrogent desormais TOUTES les fiches visibles, tout en
       continuant de tester les champs plats — seuls remplis sur les profils
       d'avant les casquettes.
  TROIS AUTRES DEFAUTS TROUVES EN CHEMIN : « ➕ Autre… » pour saisir un poste a
  la main enregistrait « [object Promise] » (fonction asynchrone non attendue,
  defaut present aussi dans l'onglet Equipe) ; un poste deja enregistre mais
  absent du referentiel ne figurait pas dans le selecteur, qui retombait sur
  « -- Fonction -- » et l'effacait au premier passage ; et la ligne « Fonction »
  affichee au-dessus du selecteur « Poste » portait la MEME valeur sans jamais
  etre redessinee — deux fonctions differentes a l'ecran. Elle n'apparait plus
  qu'en lecture seule, la ou les selecteurs sont absents.
  A RETENIR : quand deux ecrans decrivent la meme chose, chercher s'ils lisent
  la MEME table. Ici TROIS listes de postes coexistaient — le referentiel, une
  copie figee dans le formulaire supprime, et celle de l'Univers — et la
  recherche tombait dans l'ecart entre elles.
  « CHEF·FE ÉLECTRO » a enfin quitte 'gc1' (Image) pour rejoindre 'gc2'
  (Lumiere), ou il existait deja sous « Chef·fe électricien·ne ». Il avait ete
  signale plutot que corrige, faute de savoir qui l'avait choisi : compte en
  base, AUCUN profil. LA METHODE COMPTE PLUS QUE LE CORRECTIF — une valeur
  stockee ne se renomme pas sur une intuition, on compte d'abord qui l'a
  choisie ; a zero c'est gratuit, sinon il faut migrer ou ne rien faire.

  LES ERREURS ET LES RETOURS DES UTILISATEURS REMONTENT ENFIN. Jusqu'ici un
  plantage chez quelqu'un d'autre restait dans SON navigateur (ErrorLogger, en
  memoire locale) et il fallait qu'il tape une commande en console pour qu'on
  en sache quelque chose — autant dire jamais. Les remarques ecrites, elles,
  partaient en MAIL une fois par jour et la file locale etait videe ensuite :
  la seule trace vivait dans une boite mail, qui ne se trie pas, ne se compte
  pas et ne se relit pas a deux.
  DEUX TABLES (client_errors, client_feedback ; sql/remontee_erreurs.sql et
  sql/remontee_retours.sql), et deux onglets au tableau de bord admin :
  « 🐞 Erreurs », REGROUPEES par erreur identique — « 47 × », pas 47 lignes —
  avec pile depliable, copie et marquage traite ; et « 💬 Retours », filtre par
  type, urgence en trois crans, urgents en tete. Bouton « Copier pour
  analyse » : retours ET erreurs en attente reunis en un seul texte, matiere
  d'une seance de tri.
  ENVOI SANS LE SDK, par un simple appel reseau, et c'est le point de
  conception : les erreurs les plus precieuses sont celles du DEMARRAGE, quand
  le SDK n'est pas encore charge — ou quand c'est lui qui a echoue. Pour la
  meme raison l'adresse et la cle publique de la base sont declarees AVANT
  l'application (MOTEUR_SUPABASE), qui les reprend : une seule source.
  LES DEUX TABLES SONT EN ECRITURE SEULE pour le public : on peut y deposer,
  jamais y lire ni y modifier. Le depot est ouvert meme aux visiteurs non
  connectes, sans quoi on ne verrait jamais les pannes d'ouverture de session —
  justement les plus graves. Verifie en base : un visiteur anonyme depose bien,
  et voit zero ligne en lecture.
  CE QU'ON ENVOIE, ET RIEN D'AUTRE : pour une erreur, message, fichier, ligne,
  pile, page, version, navigateur abrege ; pour un retour, le texte, le
  contexte et la version. NI compte, NI projet, NI adresse. Choix assume : on
  repare sans avoir a traiter ces traces comme de la donnee personnelle.
  LE MAIL QUOTIDIEN EST SUPPRIME : il faisait doublon. Consequence assumee, a
  ne pas defaire a moitie — l'adresse de la personne n'existant plus nulle
  part, on ne peut PLUS recontacter quelqu'un depuis un retour ; qui a vraiment
  besoin d'une reponse ecrit directement a l'editeur.
  GARDE-FOUS : longueurs bornees cote base ; une meme erreur envoyee une seule
  fois par session, dix au plus ; ecartes du flux les extensions du navigateur,
  « Script error. » (script d'un autre domaine, sans message ni ligne), la
  boucle ResizeObserver, et tout ce qui survient en ouverture locale (file://).
  Purge a 60 jours pour les erreurs ; aucune pour les retours — une erreur de
  l'an dernier n'apprend plus rien, une idee d'utilisateur si.
  LA PASTILLE PREVIENT AVANT QU'ON REGARDE. Premiere version ratee, corrigee
  aussitot : les pastilles des nouveaux onglets ne se posaient qu'une fois
  l'onglet OUVERT, donc ne prevenaient de rien. Le compte est fait au
  chargement du tableau de bord puis toutes les deux minutes, par la fonction
  qui servait deja aux signalements ; elle additionne desormais signalements +
  erreurs + retours sur le bouton « 🛡️ Admin ». Les erreurs sont comptees
  DISTINCTES : « 200 » pour un seul bug qui boucle ne dirait rien d'utile.

  LE MODE SOMBRE NE RETOURNAIT PAS LES PANNEAUX-DOCUMENTS. Signale sur le
  synopsis, verifie partout : quatre panneaux etaient peints en dur (fond
  blanc, texte quasi noir) au lieu d'utiliser les variables de theme — la page
  A4 du SYNOPSIS, l'editeur de FEUILLE DE SERVICE, le document des CONTRATS et
  le PLAN DE TRAVAIL. Plus trois panneaux d'interface (palette du mood board,
  roue chromatique, menu d'etoiles des rapports), l'apercu d'une version de
  scene et l'encadre de detail de l'assistant. L'editeur de SCENARIO, lui,
  etait deja correct : le defaut ne touchait pas tout, d'ou l'interet de
  verifier plutot que de supposer.
  DEUX PIEGES TRAITES, qui font la difference entre corriger et casser :
    - IMPRESSION. Ces panneaux sont des documents qu'on imprime ; une fois
      passes au theme, imprimer en mode sombre aurait donne des pages noires.
      Plutot que de rattraper chaque regle, une seule bascule redefinit les
      VARIABLES en clair sous @media print. « body.dark-mode » doit y figurer
      nommement, sinon la declaration du theme sombre, plus specifique,
      continue de gagner.
    - TEXTE DEVENU INVISIBLE. Eclaircir un fond sans regarder ce qui est ECRIT
      dessus fabrique du noir sur noir : titre de la palette, boutons de la
      feuille de service et ses accents (liens bleu fonce, mentions rouge
      sombre) ne tenaient que sur du blanc.
  NON TOUCHES a dessein : les surfaces de DESSIN (calque storyboard, toile du
  mood board) et les APERCUS D'IMPRESSION du storyboard, photographies par
  html2canvas pour le PDF — les assombrir ruinerait l'export ; les pages du
  lecteur externe non plus, elles n'ont pas de mode sombre.
  TROUVE EN CHEMIN : une regle « [data-theme=dark] » sur la roue chromatique,
  morte depuis toujours — le theme se marque par la classe « dark-mode » sur le
  corps de page, jamais par cet attribut. Encore une garde qui ne passait
  jamais (voir la lecon de v599).

  MENAGE DU RESTE A FAIRE. Clos : le prechargement des images storyboard /
  mood board (la vraie cause, la revocation des URL blob, est corrigee depuis
  v599 — si une attente reapparait, lire Utils.prefetchInfo() AVANT de recoder
  quoi que ce soit). Ecarte : le chargement differe des gros modules — le
  decoupage porte sur la SOURCE, le fichier publie reste un seul bloc, et
  differer un module imposerait de declarer un par un qui a besoin de qui,
  exactement le cout refuse en ecartant import / export ; verifie au passage,
  aucune image encodee en dur, les gros morceaux sont du VRAI code.
  TUILES DE CARTE : on ne bascule pas tant que ca marche, mais le choix est
  desormais instruit (voir le RESTE A FAIRE) — MapTiler par defaut le moment
  venu. Stadia Maps, cite depuis toujours dans cette note, est AMERICAIN : sa
  nationalite n'avait jamais ete verifiee, il est retire.

vv601 (20 septembre 2026) — EN COURS.

  MENAGE DU RESTE A FAIRE. Deux entrees d'OUVERT n'etaient plus des chantiers
  mais des decisions deja prises ; elles descendent aux DECISIONS CLOSES.
  Les ~300 attributs a identifiant interpole : verifies un par un en v593,
  aucun ne recoit de saisie utilisateur — on n'y touche pas, Utils.escape a ete
  rendue increvable a la place. La taxonomie des postes : reglee en v600, le
  referentiel CONFIG.crewGroups / crewRoles est desormais la seule source et
  « Autre » est ecarte des filtres. Sa regle de fond — un identifiant de
  departement ou un libelle de poste est une VALEUR STOCKEE, on en ajoute, on
  n'en renomme pas sans avoir COMPTE en base qui l'a choisi — ne disparait pas
  avec l'entree : elle rejoint les REGLES VIVANTES, a cote de celle des cles de
  depouillement, qui dit la meme chose pour une autre famille de valeurs.

  INFOBULLES SUR TABLETTE. Un champ rempli n'affiche plus son texte grise :
  « 180 » sans rien autour. A la souris, le survol rappelait de quoi il s'agit ;
  sur tablette il n'y a pas de survol, donc plus rien. La bulle s'ouvre
  desormais au FOCUS quand l'appareil n'a pas de survol, et s'efface seule au
  bout de deux secondes et demie ou des la premiere touche frappee. Uniquement
  sur les champs de SAISIE et uniquement REMPLIS — vide, le texte grise est deja
  la et la bulle ferait doublon. Rien ne change a la souris.
  TROIS PIEGES, tous dus au meme fait : sur un ecran tactile, TOUT arrive APRES
  le focus — le clic qui l'a donne, le defilement vers le champ, l'ouverture du
  clavier virtuel. Une bulle affichee aussitot etait donc balayee par son propre
  clic. D'ou un delai d'attente, un compteur SEPARE de celui du survol (celui du
  survol est remis a zero par hide(), que ce meme clic declenche), et un
  redimensionnement de fenetre qui REPLACE la bulle au lieu de la masquer,
  puisque c'est le clavier qui l'a provoque.
  Le test « pas de survol » est refait a chaque focus, jamais mémorisé au
  demarrage : une tablette a laquelle on branche une souris redevient un poste
  normal sans recharger la page.

  L'AMPOULE DES REMARQUES SE RAPPELLE AU SOUVENIR. Elle est en bas a gauche et
  ne bouge jamais : au bout d'une heure on ne la voit plus. Entre 1 et 10
  minutes, elle brille maintenant quelques instants et le mot « Remarques »
  monte au-dessus en fondu, comme les degats au-dessus d'un ennemi dans un jeu.
  DELAI TIRE AU HASARD A CHAQUE FOIS, et c'est le point : un battement regulier
  redevient du decor aussi vite que l'ampoule fixe. Elle passe son tour, sans
  rien jouer, si l'onglet est en arriere-plan ou si le panneau des remarques est
  deja ouvert — briller devant personne ne previent de rien.
  DEUX DETAILS QUI COMPTENT : le mot ne recoit aucun clic (pointer-events none),
  sinon il intercepterait celui destine a l'ampoule au moment ou il la
  recouvre ; et reposer la classe d'animation dans la foulee ne la REJOUE pas
  tant qu'on n'a pas relu une dimension de l'element — sans cette relecture, le
  navigateur ne voit aucun changement et le rappel n'a lieu qu'une seule fois.
  Rien ne bouge pour qui a demande moins d'animations (prefers-reduced-motion).

  LES AIDES REPASSEES AU CRIBLE : GUIDE ET VISITES GUIDEES. Beaucoup avait bouge
  sous elles depuis leur ecriture. Verification faite par PROGRAMME la ou c'est
  possible — chaque cible de la visite guidee cherchee dans le reste du code,
  chaque notion citee par les Cours cherchee dans le glossaire — puis a la main
  pour ce qu'aucune machine ne peut dire : un texte peut etre parfaitement
  valide et decrire un ecran qui n'existe plus.
  CIBLES DE LA VISITE : aucune morte, mais DEUX POINTAIENT A COTE. « Tu peux
  avoir plusieurs casquettes » entourait le bloc ENTIER du profil au lieu des
  cartes, et « Visible ou non » designait le bandeau « profil incomplet » en
  parlant d'un interrupteur de visibilite qui, depuis v600, vit sur chaque
  carte. Une cible qui existe n'est pas une cible juste : le controle par
  programme ne voit que la premiere moitie.
  GUIDE, SIX AFFIRMATIONS DEVENUES FAUSSES : la visibilite « par section »
  (retiree en v600, elle est par casquette), la « barre d'onglets » des
  casquettes (c'est une grille de cartes), le « matos perso » du profil
  technicien et le « materiel technique » de la fiche technicien du projet
  (aucune des deux n'a plus de champ pour ca), les 30 formes du mood board (il
  y en a 34), et le menu Aide donne pour deux entrees quand il en a quatre.
  Les retours, enfin, renvoyaient au Forum alors que l'ampoule 💡 existe.
  UN TROU ENTIER : LES SERIES. Saisons et episodes n'etaient NULLE PART, ni dans
  le guide ni dans les visites — c'est pourtant un choix fait a la creation du
  projet et qu'on ne peut plus changer ensuite. Une section de guide et un
  chapitre de visite comblent le trou, en insistant sur le seul point qui se
  paye cher quand on l'ignore : une scene appartient a l'episode ACTIF au moment
  ou on la cree.
  Le chapitre couvre DEUX onglets, Saisons et Episodes ; la visite « de l'onglet
  en cours » ne connaissait qu'un onglet par chapitre, elle en accepte
  desormais une liste.
  LES COURS SONT SAINS : 166 notions citees, 166 definies, zero manquante.
  Une seule definition ne sert a rien (« vertigo-effect », jamais citee).

  TROUVE EN CHEMIN, ET QUI N'EST PAS DE L'AIDE : LE MATERIEL DES TECHNICIENS EST
  UN CHAMP MORT-VIVANT. cameras, lenses, lights, sounds, grips, makeups et
  otherEquipment sont encore LUS a quatre endroits — le filtre « 🔧 Materiel »
  de l'Univers, le meme filtre dans Contacts, et l'affichage des deux fiches —
  mais PLUS AUCUN ECRAN NE PERMET DE LES REMPLIR depuis le retrait du formulaire
  (v600). Les valeurs deja en base repondent encore ; personne ne peut en
  ajouter. Exactement la famille de defauts de v600, trouvee cette fois par
  l'audit et non par un utilisateur. DECISION A PRENDRE : rendre le champ
  remplissable (une brique de fiche technicien) ou retirer les filtres. Ne pas
  laisser en l'etat : un filtre qui ne trouve rien fait croire que personne ne
  correspond. Egalement mort : #profile-form-container, coquille vide laissee
  par le formulaire retire.

  LE MATERIEL EST RENDU REMPLISSABLE — EN DEUX LISTES, PAS SIX. Arbitrage du
  developpeur : on cherche un boitier ou une serie d'optiques, pratiquement
  jamais un projecteur ou une perche. Lumiere, son, machinerie et maquillage
  sont donc ECARTES ; restent CAMERAS et SERIES D'OBJECTIFS, en listes
  predeterminees (34 boitiers, 25 series) avec « ➕ Autre… » pour ce qui manque.
  Nouveau module ProfileGear, calque sur ProfileSkills : puces, choix dans la
  liste, saisie libre attendue (await — sans quoi on enregistre « [object
  Promise] », le defaut de v600).
  DEUX ECRITURES, comme pour les langues : la FICHE technicien (une liste par
  fiche, deux specialites n'ont pas le meme materiel) ET le profil PLAT, seul
  endroit que la recherche regarde. Le plat est la REUNION des fiches VISIBLES :
  la question du filtre est « possede-t-elle ce boitier ? », pas « sur laquelle
  de ses fiches ». Une fiche refermee ou masquee n'y entre pas — se retirer de
  la recherche doit aussi en retirer son materiel.
  TROIS PIEGES, tous de placement, et c'est la tout l'interet :
    - LE RECALCUL EST DANS saveCurrentProfile, pas dans la fiche. « Effacer »
      une carte vide la casquette SANS passer par la fiche : place la, le calcul
      aurait ete saute et on serait reste trouvable pour du materiel efface.
    - LA REPRISE DES PROFILS D'AVANT EST AU CHARGEMENT, pas a l'ouverture de la
      fiche. La sauvegarde recalculant le plat depuis les fiches, un profil
      enregistre sans avoir ouvert sa fiche technicien aurait vu son materiel
      efface sans jamais avoir ete repris. Elle sert la PREMIERE fiche seulement
      — la liste plate est unique, la recopier sur chacune inventerait du
      materiel en double — et verse l'ancien « autre materiel », prive d'editeur,
      dans les cameras plutot que de le laisser invisible.
    - LE RECALCUL NE S'APPLIQUE QU'AUX PROFILS QUI ONT DES FICHES TECHNICIEN.
      Sinon une sauvegarde faite depuis la carte comedien effacait un materiel
      que rien n'avait repris.
  TROUVE EN CHEMIN : l'export PDF d'un profil affichait « Materiel » depuis
  profile.equipment — champ qui n'a JAMAIS existe. La ligne ne s'est donc jamais
  affichee ; elle lit desormais cameras et lenses.

  LE FORUM PERD SA PARTIE « RETOURS SITE ». Dix-sept sous-categories de
  signalement (bugs par ecran) y attendaient des messages, alors que les
  remarques passent par l'ampoule 💡 et les erreurs par leur table depuis v600 :
  trois portes pour la meme chose, dont deux que personne ne regarde. Retirees
  du balisage, du code et du CSS (8 regles devenues sans cible). Le forum
  lui-meme reste SUSPENDU, et son avenir rejoint le RESTE A FAIRE.

  EXPORT PDF, PREMIER LOT : LES TITRES ET LES BLANCS.
  LES BANDEAUX GRIS FONCE PLEINE LARGEUR PARTENT. Une page de dossier en
  comptait parfois cinq ; le noir plein mange l'encre et n'aide pas a lire. Le
  remplacant reprend le vocabulaire DEJA pose sur les pages de garde — une barre
  a la couleur de la section, le titre en gris tres fonce, un filet fin dessous,
  et un texte secondaire facultatif a droite (effectif, date). Rien de neuf a
  apprendre en feuilletant.
  UNE SEULE PORTE, PdfTheme.sectionBand : les DOUZE copies du bandeau sont
  remplacees par un appel. Changer le style se fera desormais en un endroit.
  Elle renvoie le y SUIVANT, pour que l'appelant n'ait plus a recalculer l'avance
  a la main — c'est la que les copies divergeaient (12, 13 ou 14 mm selon les
  fichiers). Et elle repose la police, la couleur et le trait avant de rendre la
  main : sans cela, le premier appelant qui oubliait de le faire ecrivait son
  paragraphe en gris clair.
  NON TOUCHES a dessein : les bandeaux pleine largeur en TETE de page de fiche
  (personnage, comedien, decor, technicien, structure) et les lignes d'en-tete de
  TABLEAU. Ce ne sont pas le meme objet ; a voir si on les allege aussi.
  LES GRANDS BLANCS DU SYNOPSIS. Chaque section ouvrait une page neuve : un
  synopsis d'un tiers de page laissait deux tiers de blanc avant le resume court,
  lui aussi court, et ainsi de suite — six sections faisaient six pages presque
  vides. On enchaine desormais, SAUF s'il ne reste pas de quoi poser le titre et
  quelques lignes dessous (42 mm) : un titre seul en bas de page est pire qu'un
  blanc. Mesure sur un cas type : SIX pages deviennent DEUX.

  STORYBOARD ABSENT D'UN EXPORT GLOBAL : UNE PISTE SERIEUSE, ET LA DIFFERENCE
  AVEC LE MOOD BOARD. Le mood board pose ses images en BALISES et attend
  img.complete ; le storyboard, lui, telecharge ses dessins par le SDK et les
  peint dans un CANVAS — il n'y a donc AUCUNE balise a attendre, et la seule
  garde est la file de promesses d'images.
  DEFAUT TROUVE DANS CETTE FILE : on la PHOTOGRAPHIAIT au lieu de la VIDER.
  Promise.all fige la liste au moment de l'appel ; or un dessin a plusieurs
  CALQUES n'empile le deuxieme qu'une fois le premier telecharge, donc apres
  cette photo. Les calques suivants n'etaient pas attendus et une planche pouvait
  partir a moitie peinte. On recommence maintenant tant que la file grossit.
  A CONFIRMER sur le cas signale (export global sans etre passe par l'onglet) :
  si le defaut persiste, la console du navigateur le nommera.

  EXPORT PDF, SECOND LOT : LES TABLEAUX A DEUX COLONNES.
  Lecture du VRAI dossier exporte (207 pages) plutot que du code : c'est elle qui
  a nomme les defauts, et elle en a trouve deux qui n'etaient pas demandes.
  RECAPITULATIF GLOBAL : chaque ligne portait un nom a gauche et « (n scenes) »
  cale a l'extreme droite — dix centimetres de vide entre les deux, sur toute la
  hauteur. Ce sont des tableaux a DEUX colonnes ; on en pose donc deux cote a
  cote. Remplissage EN LIGNES et non en colonnes : commencer par la colonne de
  gauche obligerait a connaitre la hauteur totale AVANT d'ecrire, or une
  categorie peut deborder sur la page suivante.
  BESOINS EQUIPE : meme traitement, et le cas est plus net encore puisque la
  valeur est un simple NOMBRE.
  DEUX DEFAUTS TROUVES EN CHEMIN, tous deux invisibles jusque-la :
    - LIBELLE LONG PAR-DESSUS SA VALEUR. La colonne des valeurs est a 50 mm
      fixes ; « Touristes / villageois / hommes de main : » la depasse et
      s'imprimait SUR « 40 role(s) », deux textes superposes. Quand le libelle
      deborde, la valeur passe desormais a la ligne sous lui.
    - BOUCLE INFINIE DANS LA TRONCATURE, qui aurait fige le navigateur. Elle
      retirait DEUX caracteres et en rajoutait TROIS (« ... ») : chaque tour
      RALLONGEAIT le texte et la sortie ne tombait jamais. Dormante depuis
      toujours parce que la limite etait la page entiere, jamais atteinte — elle
      s'est reveillee des qu'on a mesure sur une COLONNE. Trouvee par le banc
      d'essai, pas par relecture : le programme de test s'est fige.
      LECON : une troncature se mesure suite COMPRISE, et on raccourcit d'un
      caractere a la fois. Il y en avait deux exemplaires, tous deux corriges.

  BANC D'ESSAI PDF (outil de travail, hors application). Les PDF sont desormais
  GENERES et REGARDES pendant le developpement : jsPDF tourne hors navigateur,
  PdfTheme et les blocs de mise en page sont extraits du vrai fichier, le PDF est
  rasterise et l'image relue. C'est ce qui a permis de comparer avant / apres sur
  les titres, de compter six pages devenues deux, et de trouver la boucle
  infinie. Rien de tout cela n'est dans l'application : que des outils.

  EXPORT PDF, TROISIEME LOT : LE NOUVEAU TITRE GAGNE TOUS LES NIVEAUX.
  Le titre de section ayant convaincu, il descend aux titres INTERIEURS, avec la
  couleur qui change selon ce qu'on lit : groupes de PERSONNAGES (vert), de
  COMEDIENS (vert), de DECORS (brun), titres de SCENE du depouillement (orange),
  et bandes de CATEGORIE du recapitulatif global, chacune gardant SA couleur —
  c'est elle qui fait lire la page d'un coup d'oeil, on ne la perd pas en
  allegeant le fond.
  Les trois familles de groupes passaient deja par une porte commune,
  FichesPDF._drawGroupHeader, et l'accent y etait deja pose par l'export
  appelant : une seule ligne a changer pour les trois.
  DEUX PIEGES TRAITES AU PASSAGE :
    - TITRE DE SCENE PAR-DESSUS SON BADGE. Le depouillement pose « FINAL » ou
      « BROUILLON » a droite du titre ; un titre de scene un peu long s'imprimait
      dessus. La troncature est posee DANS sectionBand, pas chez l'appelant :
      elle sert desormais tout le monde, et le texte de droite est mesure AVANT
      le titre puisque c'est lui qui decide de la place restante.
    - ORDRE DE DESSIN. Le badge est dessine AVANT le titre, parce que sectionBand
      laisse derriere elle un etat de dessin propre — l'inverse aurait oblige a
      reposer police et couleur a la main apres le badge.
  NON TOUCHES, faute de les avoir identifies : « titre des scenes » demande en
  premier. Le sequencier n'a jamais eu de bandeau, le storyboard a deja un titre
  souligne a la couleur de sa section, et la fiche de script est un FORMULAIRE
  encadre, pas un titre. A preciser.

  EXPORT PDF, QUATRIEME LOT.
  TITRE DES PLANCHES DU MOOD BOARD, dans les deux sens. En PORTRAIT c'est le
  meme appel que partout ailleurs. En PAYSAGE la page entiere est pivotee d'un
  quart de tour a la fin : le sens de lecture suit +y et non +x, donc la barre
  d'accent « large de 2,4 et haute de 7,4 » devient « haute de 2,4 et large de
  7,4 », et le filet passe du dessous du titre au cote interieur de la bande.
  Le fond plein ne manquera pas : il est pose dans la MARGE, sur du papier
  blanc, l'image commence en dessous.

  STORYBOARD, DEUXIEME PISTE — ET ELLE EXPLIQUE ENFIN L'ECART AVEC LE MOOD
  BOARD. Le mood board pose ses images en BALISES : le navigateur les met en
  file tout seul, quelques connexions a la fois. Le storyboard peint dans un
  CANVAS, donc rien ne les met en file : une douzaine de pages a quatre plans
  lancaient une CINQUANTAINE de telechargements simultanes, chacun avec huit
  secondes pour repondre. Passe ce delai on dessinait quand meme — d'ou des
  vignettes vides, sans la moindre erreur affichee.
  QUATRE A LA FOIS desormais, comme le ferait le navigateur.
  ET SURTOUT, ON LE DIT : chaque image non dessinee est nommee en console avec
  sa raison (chargement refuse, delai depasse), et un message previent a la fin
  de l'export. Une planche vide passait jusqu'ici inapercue jusqu'a l'ouverture
  du PDF ; mieux vaut l'annoncer quand on peut encore recommencer. Si le defaut
  revient, c'est cette trace qui le nommera.

  STORYBOARD : LA VRAIE CAUSE, ET ELLE N'AVAIT RIEN A VOIR AVEC L'ATTENTE.
  Trouvee grace a une observation du developpeur, qui valait mieux qu'une heure
  de lecture : les fausses images posees a la creation du projet s'affichent
  dans l'ONGLET mais pas dans l'EDITEUR, et celles qu'il insere dans l'EDITEUR
  ne s'affichent pas dans l'onglet. Deux populations, donc deux rangements.
  UN PLAN PEUT PORTER SON IMAGE A DEUX ENDROITS :
    - A LA RACINE (shot.imageType / imageUrl / drawingData), l'ancien format,
      celui que la vignette de l'onglet lit encore ;
    - DANS LA ZONE « original » (shot.drawings.original), le format des quatre
      calques, celui que l'EDITEUR ecrit depuis qu'il existe — et une image
      inseree dans l'editeur y devient un OBJET (objects[]), pas une imageUrl.
  L'EXPORT NE LISAIT QUE LA RACINE. Pire : il n'allait chercher les objets de la
  zone QUE si la racine portait deja un drawingData. Un plan dessine ou illustre
  uniquement dans l'editeur ne remplissait aucune des deux conditions : « Pas
  d'image », page blanche, et pas la moindre erreur pour le dire.
  ON COMPOSE DESORMAIS DANS L'ORDRE NATUREL : image de fond (racine OU zone),
  calques de dessin (zone d'abord, racine en repli), puis objets, puis le calque
  technique. L'ancien chemin est retire, pas neutralise.
  LECON, la meme qu'en v600 sous un autre visage : quand deux ecrans montrent la
  meme chose differemment, ils ne lisent pas la meme table. Ici l'onglet,
  l'editeur et l'export en lisaient DEUX a eux trois, et le PDF etait le seul a
  n'en lire qu'une.
  A NOTER : les deux corrections precedentes (file d'attente, vidage de la file)
  restent justes, elles reglaient de vrais defauts — elles ne reglaient juste pas
  CELUI-LA.

  STORYBOARD, LA DERNIERE PIECE : LE CANVAS SOUILLE. L'onglet montrait les
  images, le PDF sortait blanc — et la difference tenait a l'ORIGINE de l'image.
  Les CALQUES de dessin passent par _loadPrintImg, donc par une URL blob
  fabriquee par la page elle-meme : meme origine. Les IMAGES INSEREES dans
  l'editeur, elles, etaient posees depuis l'URL SIGNEE du stockage : une autre
  origine. Dessiner une telle image dans un canvas ne rate pas — elle s'affiche
  parfaitement — mais elle SOUILLE le canvas, et le navigateur interdit ensuite
  d'en relire le contenu. Or c'est exactement ce que fait html2canvas pour
  fabriquer la page. D'ou une planche vide, sans la moindre erreur, alors que la
  vignette de l'onglet etait impeccable.
  UN MEDIA DE PROJET PASSE DESORMAIS TOUJOURS PAR LE TELECHARGEMENT, jamais par
  l'URL signee — le chemin que les calques empruntaient deja, et qui marchait.
  Les adresses exterieures, elles, demandent le partage d'origine : si le serveur
  refuse, l'image ne se charge pas du tout, echec franc prefere a une page vide.
  GARDE-FOU : avant de rasteriser, on lit UN pixel de chaque canvas. S'il est
  illisible, on le dit en console et a l'ecran. Moins d'une milliseconde, et un
  defaut jusqu'ici totalement muet devient nommable.
  A RETENIR : « ca s'affiche a l'ecran » ne prouve RIEN sur ce qu'on pourra
  relire. Afficher et relire sont deux droits differents.

  ET POUR FINIR, L'ESQUISSE DE DEPART NE REVIENT PLUS EN FOND. Une fois les deux
  rangements lus, ils se composaient TOUS LES DEUX : l'image de la racine —
  souvent une esquisse posee a la creation du projet — se redessinait derriere le
  travail reel des que celui-ci ne couvrait pas tout le cadre. Desormais, des que
  la zone « original » a quelque chose a elle (un calque, un objet, une image),
  elle est la SEULE source ; la racine ne sert plus que de repli pour les plans
  jamais ouverts dans l'editeur — c'est-a-dire les projets d'avant, qui continuent
  de sortir comme avant.
  RIEN N'EST EFFACE, et c'est deliberе : l'ancienne image dort dans les donnees et
  reapparaitrait si on vidait la zone. On choisit ce qu'on REGARDE, pas ce qu'on
  garde. Effacer pour de bon serait une operation sur les DONNEES, pas sur le
  SOURCE UNIQUE D'UNE VIGNETTE, ET FIN DE L'HISTOIRE. Precision du developpeur :
  ces esquisses venaient d'un besoin ponctuel, personne n'en aura jamais l'usage,
  et la seule image qui doit s'afficher est celle de l'EDITEUR DE DESSIN — rien
  dans l'editeur, case vide, ce qui est la reponse honnete.
  Nouveau Storyboard.contenuPlan : les TROIS ecrans qui dessinent une vignette —
  carte compacte, carte de plan, export PDF — lisent desormais la meme chose, la
  zone « original ». La racine n'est plus lue par aucun d'eux.
  LES PROJETS D'AVANT NE PERDENT RIEN : au chargement, Store recopie deja la
  racine dans la zone quand celle-ci n'existe pas (migration « drawings »). Les
  seuls plans qui deviennent vides sont ceux ou la zone existait DEJA en restant
  vide a cote d'une image de racine — un etat qu'aucun ecran de l'application ne
  sait produire, et qui venait ici d'un outil exterieur.
  RIEN N'EST EFFACE POUR AUTANT : l'ancienne image dort dans les donnees. On a
  change ce qu'on REGARDE, pas ce qu'on garde ; l'effacer serait une operation
  sur les DONNEES, reversible par personne.
  UNE EXCEPTION ASSUMEE : l'editeur de dessin, quand on travaille sur un calque
  AUTRE que l'original, affiche l'original en arriere-plan et garde la un repli
  sur la racine — mais il ne s'y rabat QUE si la zone n'existe pas du tout. Le
  cas signale ne passe donc pas par la. Le dire plutot que d'annoncer un menage
  total qui n'en serait pas un.
  LECON D'ENSEMBLE DE LA JOURNEE, la meme que pour les postes en v600 et le
  materiel en v601 : quand deux ecrans montrent la meme chose differemment, ils
  ne lisent pas la meme table. Ici ils etaient TROIS a en lire DEUX.

  LES PHOTOS DE COMEDIENS, DE PERSONNAGES ET DE DECORS NE S'AFFICHAIENT PLUS.
  Signale sur une vignette de personnage, ou le rond montrait « Phot du... » —
  c'est-a-dire le TEXTE DE REMPLACEMENT d'une image cassee, pas un libelle.
  CAUSE : safeMediaUrl, le filtre de securite pose sur toute adresse d'image, ne
  laissait passer que « data:image/ » et « https:// ». Or un media de projet est
  stocke soit par son CHEMIN NU (« projects/xxx/yyy.jpg »), qui ne commence pas
  par https, soit par une adresse « /object/public/ » que le bucket PRIVE refuse
  de servir. Les deux formes etaient donc perdues : la premiere effacee par le
  filtre, la seconde renvoyee en 403.
  ON SIGNE AVANT DE VALIDER, et l'ordre est tout : la valeur est d'abord resolue
  en URL signee, le controle de securite s'applique ENSUITE, sur ce qui sera
  reellement pose dans la page. Il garde donc le dernier mot.
  UNE SEULE LIGNE, ET TOUS LES APPELANTS SONT SERVIS — vignettes, fiches,
  en-tetes, exports. C'etait encore la meme faute de fond que le reste de la
  journee : une donnee lue par deux portes qui ne s'accordaient pas.
  Verifie sur les sept formes possibles : chemin nu, adresse publique du bucket
  prive, image encodee en dur, adresse externe, chemin inconnu, tentative
  « javascript: » et valeur vide. Les trois dernieres rendent bien du vide.

  LE VERROU DESCEND A LA SCENE. Jusqu'ici un verrou couvrait un DOMAINE entier :
  « scenes » bloquait d'un coup le Scenario, le Sequencier et le Depouillement.
  Une personne ecrivait, tout le monde regardait. Trois etapes, dans cet ordre,
  et l'ordre est tout : l'ECRITURE d'abord, le verrou ensuite.

  (1) ECRIRE UNE SEULE SCENE. La sauvegarde envoyait la LISTE COMPLETE des
  scenes ; deux personnes qui ecrivent chacune la sienne s'ecrasaient, la
  derniere gagnait. Le verrou de domaine n'etait que le pansement pose sur ce
  defaut-la. Nouvelle fonction serveur patch_project_scene (sql/ecriture_par_
  scene.sql, appliquee sur la base) : elle remplace UNE entree du tableau,
  reperee par son identifiant, sans toucher aux autres — et si l'identifiant est
  inconnu, elle AJOUTE plutot que d'echouer, pour que deux creations simultanees
  en gardent chacune une. Memes gardes que patch_project_data : aucun acces
  nouveau. Cote navigateur, StoreSave.saveScene. REPLI AUTOMATIQUE : si la
  fonction manque sur la base, on retombe sur l'ancienne sauvegarde — mais
  UNIQUEMENT sur l'erreur « fonction inconnue ». Une erreur de droit ou de
  reseau ne doit pas se transformer en reecriture complete et silencieuse.

  (2) FUSIONNER SCENE PAR SCENE. C'etait la piece dangereuse. L'ancienne fusion
  protegeait une cle ENTIERE : une modification non enregistree dans « scenes »
  faisait refuser TOUT ce qui venait des autres. Desormais StoreRealtime fusionne
  scene par scene : je garde celles que j'ai modifiees, je prends les leurs,
  l'ORDRE du serveur fait foi, mes scenes toutes neuves encore jamais
  enregistrees sont ajoutees a la fin, et une scene supprimee chez eux disparait
  bien chez moi. Se tromper la, c'est perdre le texte de quelqu'un SANS message
  d'erreur : chaque cas a ete eprouve un par un.

  (3) LE VERROU PAR SCENE. Aucune piece serveur nouvelle : la table des verrous
  accepte n'importe quelle clef en texte libre et les arbitre toutes de la meme
  facon (premier arrive, expiration a trois minutes sans battement). On y pose
  donc « scene:<identifiant> ». Nouveau module SceneLock.
  ON NE PREND QU'UNE SCENE A LA FOIS : ouvrir une autre scene libere la
  precedente. Sans cela, quelqu'un qui parcourt son scenario verrouillerait tout
  ce qu'il a survole et le laisserait bloque trois minutes.
  LE VERROU SE PREND QUAND LE CURSEUR ENTRE DANS LA SCENE — pas au survol (on
  verrouillerait tout ce qu'on parcourt), pas a l'enregistrement (trop tard,
  l'autre aurait deja ecrit). Le defilement ne deplace pas le curseur : LIRE ne
  verrouille donc rien. Et le declencheur vit DANS le module, pas dans
  l'editeur : le jour ou un autre ecran rend une scene modifiable, il est
  couvert sans qu'on y pense.
  LE REFUS EST POSE LA OU L'ECRITURE PART, pas sur les ecrans. Cinq ecrans
  montrent une scene aujourd'hui et il en viendra d'autres ; chacun pourrait
  oublier de verifier. StoreSave.saveScene refuse donc toute scene tenue par
  quelqu'un d'autre, quel que soit l'ecran qui le demande, et le dit.
  LE BADGE D'ONGLET RESTE, IL CESSE SEULEMENT DE VERROUILLER. Savoir que
  quelqu'un ecrit dans le Scenario reste utile — on continue de l'annoncer, sans
  empecher personne d'entrer. La scene tenue, elle, porte la pastille de la
  personne et la mention « Verrouillee » PARTOUT ou elle apparait : on ne marque
  pas les ecrans un par un, on marque tout element qui porte l'identifiant d'une
  scene. Les listes de choix des exports en sont ecartees — y cocher une scene
  ne la modifie pas.

  LE DOMAINE « SCENES » EST COUPE EN DEUX, PAS SUPPRIME. Il couvrait aussi les
  saisons, les episodes, les etiquettes, les groupes et les metadonnees du
  scenario. Ce ne sont pas des scenes et elles n'ont aucun verrou fin : les
  laisser sans domaine, c'etait les laisser sans filet. Elles gardent donc un
  verrou de domaine, sous leur vrai nom, « Structure du recit ».

  CE QU'ON NE VERROUILLE PAS, ET POURQUOI. Verrouiller en cascade les fiches
  liees (comedien, personnage, decor) paraissait prudent : c'est l'inverse.
  Mesure sur un projet reel de 21 scenes — la realisatrice est rattachee aux 21,
  les comediens principaux a 20. Verrouiller une seule scene aurait donc fige
  presque toutes les fiches du projet, bien pire qu'avant. Le vrai danger n'est
  pas qu'on RENOMME un decor pendant que j'ecris (je verrai le nouveau nom),
  c'est qu'on l'EFFACE : la scene perd son lien et je ne m'en apercois qu'a
  l'export. C'est donc la SUPPRESSION, et elle seule, qui est refusee tant
  qu'une scene qui s'en sert est tenue par quelqu'un. Refus temporaire, jamais
  definitif. La garde est posee sur UI.deleteDataItem, porte unique de la
  suppression des fiches.

  LES SOUS-ELEMENTS SONT COUVERTS D'OFFICE : depouillement, resume, titre, liens
  vers les personnages et le decor vivent DANS l'objet scene. Verrouiller la
  scene les verrouille tous, partout a la fois.

  DETAIL QUI AURAIT TOUT GACHE : le battement de coeur. Un verrou qu'on ne fait
  plus battre est considere abandonne au bout de trois minutes. Les verrous de
  scene se branchent sur la meme horloge que les domaines — sans cela ma propre
  scene aurait expire sous mes doigts pendant que j'ecris, et le voisin aurait
  pu la prendre.

  (4) CE QUI A BOUGE AUTOUR DE MOI. Le verrou traite les vrais conflits ; reste
  tout ce qui n'en est pas. Quelqu'un deplace ma scene, change son decor, y
  ajoute un personnage : rien ne m'empeche d'ecrire — mais si personne ne me le
  DIT, je decouvre a l'export que ma scene 12 est devenue la 4 et se joue dans
  une cuisine. Nouveau module SceneNews : un bandeau d'information en haut de
  l'onglet, qui ne bloque rien et s'efface seul au bout de quinze secondes.
  DEUX REGLES POUR QUE CE NE SOIT PAS UN BRUIT DE FOND. On ne parle que de MA
  scene — celle que je tiens, sinon celle ou est mon curseur, sinon celle dont
  la fiche est ouverte ; un projet a cinquante scenes, annoncer les quarante-
  neuf autres c'est n'annoncer rien. Et un seul bandeau a la fois, qui groupe
  ses lignes. Seule exception qui ne s'efface pas : « cette scene vient d'etre
  supprimee », le seul cas ou du texte peut se perdre.
  LE DIFF SE PREND AVANT LA FUSION, jamais apres : apres, les deux etats sont
  confondus et il n'y a plus rien a comparer. Le bandeau, lui, se pose APRES le
  rendu — le re-rendu de la mise a jour distante l'effacerait sinon, defaut deja
  corrige en v570 sur les bandeaux de verrou.

  DEUX TROUS TROUVES EN PREPARANT L'ETAPE 4, ET C'EST LA LE VRAI SUJET. Ecrire
  une scene passe par saveScene, donc par le refus. Mais DEPLACER, AJOUTER ou
  SUPPRIMER une scene change la FORME du tableau : ces trois gestes passent par
  la sauvegarde COMPLETE, qui renvoie tout le tableau — et ne rencontrait aucun
  refus. Le verrou de domaine les couvrait jusqu'ici en empechant simplement
  deux personnes d'etre la en meme temps ; en le retirant, on les avait mis a
  nu. Deux corrections :
    - SUPPRESSION. Une scene tenue par quelqu'un ne peut plus etre supprimee,
      ni seule (Actions.deleteScene), ni emportee par la suppression de son
      episode ou de sa saison. Sans cela, l'affirmation de l'etape 3 — « une
      scene tenue n'est plus effacee par un autre » — etait fausse.
    - DEPLACEMENT. Renvoyer tout le tableau pour bouger une scene renvoie aussi
      NOTRE copie de celle que le voisin ecrit, dans l'etat ou on l'avait recue.
      Si son enregistrement est arrive entre-temps, le notre l'effacait sans un
      mot. Avant d'envoyer, on relit donc le serveur et on reprend SA version
      des scenes qu'on n'a pas touchees, en gardant NOTRE ordre — c'est ce qu'on
      est en train de faire — et en rajoutant les scenes nees ailleurs depuis
      notre derniere synchro plutot que de les supprimer par omission.
      UNE LECTURE DE PLUS, ET SEULEMENT quand quelqu'un d'autre tient vraiment
      une scene : le reste du temps, rien ne change.
  LECON, encore la meme : on avait mesure les ECRITURES DE CONTENU (22 endroits
  modifient une scene, 11 touchent au tableau) sans voir que le verrou qu'on
  retirait couvrait AUSSI les 11 autres. Retirer un filet oblige a regarder tout
  ce qu'il retenait, pas seulement ce qu'on voulait lui faire lacher.

  (5) ET LA VERIFICATION QUI A TOUT REPRIS. Question du developpeur apres coup :
  « il y a des soucis avec ce vrai sujet ? » Il y en avait trois, et le premier
  vidait le chantier de sa substance.
  LE VERROU NE SE PRENAIT QUE DANS LE SCENARIO. Le declencheur cherche un
  conteneur qui PORTE l'identifiant de la scene. Verifie ligne a ligne apres la
  question : dans toute l'application, UN SEUL en portait un, le bloc de
  l'editeur continu. Le depouillement, le sequencier, le Beat Board et la fiche
  passaient le leur par un onclick. On pouvait donc depouiller a deux la meme
  scene sans que rien ne s'allume. Les cinq conteneurs portent desormais
  data-scene-id ; pour la fiche, l'identifiant est pose sur une ENVELOPPE a
  l'interieur du corps de la fenetre et non sur le corps : ouvrir ensuite la
  fiche d'un comedien remplace ce contenu, donc l'enveloppe disparait d'elle-
  meme — sur le corps, l'attribut serait reste et la fiche du comedien se serait
  crue verrouillee.
  LE BADGE ALLAIT AUSSI AU MAUVAIS ENDROIT. « Marquer tout element qui porte
  l'identifiant d'une scene » paraissait robuste ; en pratique, les seuls autres
  a en porter un etaient les pastilles de commentaire, l'apercu de relecture et
  LES CASES A COCHER DES EXPORTS — celles-la meme qu'on croyait avoir ecartees
  (le filtre visait « modal-overlay », or ces fenetres s'appellent
  « confirm-modal-overlay »). Et dans le Scenario le badge se posait DEUX fois,
  le bloc et son titre portant tous deux l'identifiant. On NOMME donc les zones,
  une fois, dans SceneLock : sept zones marquees, dont quatre ou poser le
  curseur prend le verrou. Les listes et les cartes n'en font pas partie : les
  parcourir, c'est lire.
  ET LE PLUS GENANT : PERSONNE N'APPELAIT saveScene. Le refus d'ecriture avait
  ete pose dedans, « la ou l'ecriture part » — sauf qu'aucun ecran n'y passe.
  Tous ecrivent par la sauvegarde complete. Le refus ne refusait donc rien.
  IL VIT MAINTENANT DANS save(), qui est le vrai point de passage : avant
  d'envoyer, et seulement a plusieurs, on relit le serveur et on reprend SA
  version des scenes qu'il tient — meme celles qu'on a modifiees. Et on le DIT :
  une modification qui disparait sans un mot est pire que pas de verrou du tout.
  saveScene reste en place, juste et inutilisee, pour le jour ou les editeurs y
  passeront ; le journal le dit desormais au lieu de laisser croire le contraire.
  ET UN QUATRIEME, TROUVE EN VOULANT REPONDRE « on est bon ? » : LES MARQUES NE
  TENAIENT PAS. Chaque redessin d'ecran — changement d'onglet, sauvegarde, tri —
  reconstruit ses scenes et effacait les badges avec ; rien ne les reposait
  avant le rafraichissement suivant des verrous, jusqu'a une minute plus tard.
  Les reposer depuis chaque fonction de rendu, c'est en oublier une : on en
  avait deja oublie cinq. On SURVEILLE donc la page (MutationObserver) : des
  qu'elle bouge, les marques sont reposees une fois, apres un court delai. Un
  ecran ajoute demain est couvert sans qu'on y pense.
  LE PIEGE DE CETTE SOLUTION, et il fallait le voir : poser un badge FAIT bouger
  la page, donc rappelle la surveillance, donc repose le badge — une boucle sans
  fin qui aurait chauffe l'ordinateur en silence. Deux precautions : on n'ecoute
  que l'apparition et la disparition d'elements (jamais les attributs ni le
  texte, sinon chaque touche frappee relancerait le calcul), et le badge n'est
  refait que si la personne qui tient la scene a CHANGE. Mesure : le systeme se
  stabilise apres un seul passage, et n'en fait plus aucun ensuite.

  ET LE VRAI COUPABLE, TROUVE AU PREMIER ESSAI A DEUX (21 septembre). Symptome
  du developpeur : « A prend la scene 1, B la voit verrouillee, bien ; A passe a
  la scene 2, et B voit les DEUX occupees — ca ne se deverrouille jamais. »
  VERIFIE EN BASE, ET CE N'ETAIT PAS LE CODE DU VERROU : A libere bien la scene
  1, la ligne disparait du serveur. C'est B qui ne l'apprenait jamais.
  LA TABLE DES VERROUS N'ETAIT PAS DIFFUSEE EN TEMPS REEL. LockManager s'abonne
  aux changements de project_locks depuis des mois ; la table n'etait pas dans
  la publication. L'abonnement REUSSISSAIT et restait muet — un abonnement a une
  table non publiee ne renvoie aucune erreur. Chaque poste gardait donc la photo
  des verrous prise a l'ouverture du projet. Cela valait aussi pour les verrous
  de DOMAINE : le badge « quelqu'un travaille ici » n'a jamais bouge en direct,
  il apparaissait a l'ouverture et n'en repartait plus.
  DEUX CORRECTIONS. Cote base, project_locks rejoint la publication, avec
  REPLICA IDENTITY FULL — sans elle la ligne effacee n'arrive qu'avec sa cle
  primaire, le filtre par projet ne la reconnait pas, et l'on verrait les prises
  sans jamais voir les LIBERATIONS, c'est-a-dire tout sauf ce qu'on cherche
  (sql/verrous_temps_reel.sql). Cote navigateur, on ne fait plus dependre
  l'affichage d'un seul canal : les verrous sont relus toutes les vingt
  secondes. Un canal muet ne pourra plus figer l'ecran en silence.
  ET QUITTER UNE SCENE LA REND, ENFIN. La premiere version gardait le verrou
  tant qu'on n'en prenait pas un autre : on pouvait partir au Planning et
  laisser sa scene bloquee indefiniment, le battement de coeur la maintenant en
  vie. Desormais, apres vingt secondes de curseur hors de toute scene, on rend
  la main. Pas tout de suite : cliquer un bouton de la barre d'outils sort le
  curseur pour y revenir aussitot, et lacher a chaque aller-retour ferait
  clignoter le verrou.

  LE SYNOPSIS PASSE AU VERROU PAR SECTION (21 septembre). Son onglet porte SIX
  textes independants : synopsis, resume court, resume long, note d'intention,
  note du realisateur, note du producteur. Un seul verrou les couvrait tous : la
  productrice qui redigeait sa note bloquait le realisateur sur la sienne, alors
  qu'ils n'ecrivent pas au meme endroit.
  LES DONNEES ETAIENT DEJA PRETES, et c'est ce qui rend ce cas simple : six
  textes, six CLES SEPAREES, et la sauvegarde n'envoie que les cles modifiees.
  Deux personnes sur deux sections ne s'ecrasaient donc DEJA pas cote serveur —
  seul le verrou d'onglet les empechait de travailler en meme temps. Le retirer
  ne fait perdre aucune securite. Restait a couvrir le cas reel : deux personnes
  sur la MEME section, ou la derniere ecriture gagne.
  RIEN A AJOUTER AU HTML non plus : chaque section porte deja data-section
  depuis toujours, pour la navigation entre les six textes.
  LE REFUS EST PLUS SIMPLE QUE POUR LES SCENES, et pour la meme raison : il n'y
  a rien a recoudre. On retire du paquet la cle qu'on n'a pas le droit d'ecrire,
  on remet a l'ecran la derniere version connue du serveur, et on le dit. Pas de
  relecture, pas de fusion.

  ET LE MECANISME DEVIENT COMMUN — VerrouFin. Les scenes avaient ouvert la voie ;
  le synopsis arrivait trois jours plus tard avec exactement les memes besoins :
  prendre, rendre, battre, suivre le curseur, marquer les ecrans, ne pas en
  tenir deux a la fois. Une deuxieme copie, c'etait deux endroits a corriger le
  jour ou l'on trouve un defaut — et dans ce chantier-la on en a trouve QUATRE.
  Tout ce qui est commun vit donc en un seul endroit ; une famille n'apporte que
  ce qui lui est propre : ou sont ses zones, comment on lit leur identifiant.
  SceneLock n'est plus qu'une declaration de zones plus ses trois gardes de
  suppression ; SynopsisLock tient en vingt lignes.
  CE QUE LE REGROUPEMENT A DONNE AU PASSAGE, sans qu'on ait rien a ecrire : le
  synopsis herite de la surveillance de page, du battement de coeur, de la
  liberation en partant et du refus d'un double verrou — quatre corrections
  gagnees par les scenes a la dure, appliquees d'office.
  VERIFIE PAR LES MEMES TESTS : les 23 du verrou par scene rejoues a l'identique
  apres le regroupement, plus 12 pour le synopsis et 8 pour la liberation et la
  surveillance. Refondre du code qui marche ne se fait pas sans filet.

  « JE NE TROUVE PAS LA FICHE » ET « JE N'AI PAS LE DROIT DE LA VOIR » SONT DEUX
  CHOSES DIFFERENTES. Signale le 21 septembre sur un vrai projet a deux : B a
  acces au Depouillement mais pas aux onglets Personnages, Decors et Ressources.
  Chez A tout est rattache ; chez B, le depouillement declarait TOUS ses
  elements « sans fiche » et lui proposait d'en creer des centaines — en double
  de celles qui existent deja, et invisibles pour lui.
  CAUSE : le cloisonnement (v578) retire de la reponse serveur les cles
  auxquelles on n'a pas acces, et Store.getEmpty les recree VIDES pour que le
  reste de l'application ne plante pas. Un tableau vide et un tableau qu'on n'a
  pas le droit de lire se ressemblent trait pour trait — et tout ce qui conclut
  a une absence s'y trompait.
  LE GARDE-FOU EXISTAIT DEJA POUR L'ECRITURE, pas pour la LECTURE : la
  sauvegarde retire du paquet les cles cachees (sinon on effacerait le budget de
  tout le monde en enregistrant), et le declencheur SQL dit la meme chose cote
  serveur. Rien n'avait ete pose du cote des conclusions qu'on TIRE de ces
  tableaux vides. Aucune donnee n'a donc ete perdue — les fiches creees par B
  n'auraient meme pas ete enregistrees — mais l'ecran mentait, et la reparation
  proposee aurait fabrique le desordre qu'elle pretendait corriger.
  CORRECTION, UNE SEULE PORTE : Links.masquee(famille) repond a la question
  « cette famille m'est-elle cachee ? », a cote de la table qui relie deja les
  familles a leurs collections. Ce qui en decoule :
    - le controle des liens IGNORE les familles hors de portee — on ne conclut
      rien sur des donnees qu'on n'a pas — et le DIT, en toutes lettres, dans
      la fenetre de controle comme sur le compteur (« partiel ») ;
    - un element dont la fiche est cachee est montre RATTACHE, pas orphelin,
      avec pour explication « fiche rattachée, mais vous n'avez pas accès a
      cette section » ;
    - on ne rattache ni ne cree dans une famille cachee : on ne verrait pas les
      fiches existantes, donc on en fabriquerait forcement des doublons ;
    - meme regle dans l'autre sens, la ou elle manquait aussi : sans acces aux
      scenes, on ne propose plus de supprimer un decor ou un personnage « qui
      ne sert plus dans aucune scene ». Celui-la n'avait encore blesse
      personne, mais c'est exactement le meme raisonnement — et lui EFFACE.
  LA REGLE, pour tout ce qu'on ecrira ensuite : AVANT DE CONCLURE QU'UNE DONNEE
  MANQUE, DEMANDER SI ON AVAIT LE DROIT DE LA VOIR. Un tableau vide n'est pas
  une reponse, c'est parfois une porte fermee.

  LA LECON, ET ELLE EST DURE : les trois etapes precedentes etaient justes dans
  leur mecanique et fausses dans leur PREMISSE. On avait construit sur « les
  ecrans portent l'identifiant de leurs scenes » et sur « les ecritures passent
  par saveScene », deux choses qu'il suffisait de verifier et qu'on n'avait pas
  verifiees. Un mecanisme juste branche sur rien ne fait rien — et il en a
  l'air. Verifier ce a quoi on se branche vaut mieux que verifier ce qu'on
  branche.
