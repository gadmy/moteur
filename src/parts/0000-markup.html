MÉTHODE DE TRAVAIL
==================

Ce projet est développé en collaboration avec Claude (Anthropic).
À chaque nouvelle conversation :

0. DEPUIS v599, LE FICHIER EST DECOUPE. index.html est GENERE : on édite
   les morceaux de src/parts/ (un fichier par module, ~12 Ko en moyenne),
   puis « node tools/build.mjs » recolle le tout. La concaténation redonne
   le fichier à l'octet près — aucune transformation n'a lieu au passage.
   « node tools/build.mjs --check » vérifie sans rien écrire, et l'action
   GitHub le lance à chaque push. Ne JAMAIS éditer index.html directement.
1. Le dépôt est cloné dans la session ; Claude travaille UNIQUEMENT sur les
   fichiers du dépôt, jamais de mémoire. (Avant v599 : le fichier HTML
   unique était uploadé en début de conversation.)
2. L'utilisateur explique la fonctionnalité ou la correction souhaitée.
3. Claude applique lui-même les modifications sur le fichier avec ses
   outils (petits remplacements ciblés à ancre unique, jamais de réécriture
   complète, jamais de gros bloc d'un coup) ; grosses modifs découpées en
   plusieurs patchs successifs.
4. Après chaque lot : node --check sur les scripts, équilibre des balises,
   puis le fichier mis à jour est re-présenté pour téléchargement. Pas de
   code dans les réponses : un résumé bref de ce qui a changé, c'est tout.
5. Utilisateur non codeur : vocabulaire technique simplifié, réponses
   réduites au minimum vital pour comprendre.
6. Contraintes techniques : pas de bandeaux ═ (U+2550), pas d'emoji dans les
   doc.text() de jsPDF, pas d'IIFE async.
7. L'utilisateur teste dans le navigateur (recharger cache vide :
   Ctrl+Shift+R).
8. VERSION : un seul numéro, celui affiché dans l'appli sous la forme
   "vvXXX" (double v, grep-able) — PAS de numérotation séparée dans ce
   journal. Le développeur décide SEUL quand ce numéro change ; Claude ne le
   touche jamais de sa propre initiative, ni le numéro affiché ni le journal
   ci-dessous. Uniquement quand l'utilisateur dit explicitement "changement
   de conversation" : Claude résume proprement le journal de la version en
   cours (même style que les entrées précédentes), ouvre la nouvelle entrée
   "vvXXX+1" avec un journal vide, et met à jour le numéro affiché dans
   l'appli en conséquence. Ce journal vide se remplit au fil des échanges de
   la conversation qui suit, jusqu'au prochain "changement de conversation".

  AGENDA ET TRANSPORTS : UNE SEULE FOIS PAR PERSONNE (etape 2). Outil commun
  PersonIdentity.dedupe, qui ne garde qu'une entree par corps dans une liste.
  Agenda du Planning : la liste des disponibilites ne propose la personne qu'une
  fois (son etiquette porte toutes ses fonctions, « Bob - Cadreur, Electro »),
  l'ecarte des que l'UN de ses postes est choisi, et le calendrier ne pose plus
  qu'une barre par personne et par jour au lieu de deux identiques. Tableaux
  TRANSPORTS, a l'ecran comme au PDF : une ligne par personne — c'est de la
  logistique, et deux lignes laissaient croire a deux vehicules ou deux pick-up
  a prevoir. Liste « part avec » : la personne ne se propose plus a elle-meme
  (elle ne monte pas dans sa propre voiture) et chaque autre n'y figure qu'une
  fois. DISTINCTION A GARDER : les tableaux de CONVOCATION gardent une ligne PAR
  POSTE — le chef de chaque departement doit y retrouver sa personne ; seuls les
  tableaux de LOGISTIQUE sont regroupes. PIEGE TRAITE : une cle de covoiturage
  enregistree peut viser un AUTRE poste que celui retenu par le regroupement ;
  les comparaisons portent donc sur le corps, sinon un passager disparaissait de
  l'affichage.

  LE CORPS EST COMMUN A TOUTES LES CASQUETTES (etape 3). Telephone, vehicule,
  permis et agenda (dispos / indispos) vivaient dans CHAQUE casquette :
  dupliquer une fiche technicien dupliquait l'agenda, et corriger ses indispos
  sur une fiche laissait les autres perimees. Ces champs quittent
  FACET_SWAP_KEYS pour une nouvelle liste FACET_COMMON_KEYS et habitent le
  PROFIL, en un seul exemplaire. Consequences voulues : changer de casquette ne
  les bascule plus, et « Effacer » une carte ne les touche plus — vider sa carte
  comedien n'a pas a supprimer son numero de telephone. RESTENT PAR CASQUETTE a
  dessein : hidePhone (choix d'affichage public, carte par carte) et agentPhone
  (l'agent ne concerne que le comedien). La fiche unifiee lit et reecrit ces
  champs sur le profil, sur un CLONE : les editeurs mutent les tableaux en place,
  sans clone une modification du calendrier touchait le profil meme en refermant
  sans enregistrer. MIGRATION DOUCE (_liftCommonToProfile, jouee au chargement de
  ses propres profils) : la premiere valeur trouvee dans les casquettes remonte
  au profil quand celui-ci n'a rien, puis la cle est EFFACEE de toutes les
  casquettes. Cet effacement est le coeur de la migration : partout la lecture
  est « casquette, sinon profil », et une copie oubliee continuerait de gagner —
  y compris un TABLEAU VIDE, vrai en JavaScript, qui aurait masque l'agenda
  remonte. Les profils des autres ne sont pas touches : tant que leur
  proprietaire n'a pas sauvegarde, leurs casquettes font foi et le repli sur le
  profil joue tout seul.

  AJOUT D'UNE FICHE TECHNICIEN — LA TUILE « + ». Le bouton « Dupliquer » quitte
  l'interieur de la fiche : on ajoute une fiche la ou on les voit toutes, pas
  depuis l'une d'elles. La grille de Mon Profil porte desormais une tuile
  « + Ajouter un profil technicien ». La nouvelle fiche reprend ce qui tient a la
  PERSONNE — nom, photo, sexe, telephone, ville, adresse, vehicule et permis
  (liste CREW_NEW_INHERIT) — depuis la premiere fiche technicien remplie, a
  defaut la casquette comedien. L'age et la date de naissance ne sont pas listes :
  ils vivent deja sur le profil, communs a toutes les casquettes. Le METIER
  (departement, fonction, parcours, bande demo, tarif) et l'email de CONTACT ne
  sont jamais repris. Les valeurs copiees sont CLONEES : deux fiches ne partagent
  jamais le meme tableau de permis. Les emplacements vides n'ont plus de tuile
  grisee a eux (activateCrewCard supprimee, plus aucun appelant) : la tuile « + »
  reprend d'elle-meme le premier emplacement libre — donc le premier quand aucune
  fiche n'existe encore. GARDE : un emplacement REFERME mais non vide est rouvert
  tel quel, jamais ecrase (_crewCardHasContent) — « Refermer » promet de garder
  les donnees. Le numero affiche sur les tuiles suit les fiches REMPLIES et non
  l'index du tableau, sans quoi un emplacement laisse vide donnait un « n°2 »
  sans « n°1 ».

  PROFIL PUBLIC, deux correctifs decouverts en testant. 1) L'identite saisie
  dans la fiche unifiee (nom, telephone, ville, sexe) ne rejoignait jamais les
  champs PLATS du profil : saveCurrentProfile les y valide, et la base les range
  en COLONNES (celles que fouille l'Univers). Un profil rempli entierement depuis
  la fiche restait donc bloque sur « Veuillez remplir les champs obligatoires »
  — champs pourtant remplis — et serait parti en base avec un nom vide. Ces
  quatre champs sont la PERSONNE, pas la casquette : ils sont desormais recopies
  vers le profil, sans jamais ecraser une valeur connue par du vide. 2)
  _engineDoSave annoncait « Casquette enregistree » meme quand la sauvegarde
  venait d'etre refusee, d'ou deux messages contradictoires a l'ecran ;
  saveCurrentProfile renvoie maintenant vrai/faux et le message suit. La
  duplication de fiche technicien s'abstient aussi quand le save a echoue.
  RESTE OUVERT : l'ancien formulaire de profil (deja liste plus haut comme
  doublon a retirer) n'est pas rafraichi apres un enregistrement depuis la
  fiche — cliquer ensuite sur le gros « Sauvegarder » sans recharger la page
  repart de champs a l'ecran perimes.

  Au passage, deux blocages du MODE LOCAL (file://), invisibles en ligne
  puisque le code concerné ne s'y exécute jamais : le réglage d'auto-refresh
  touchait supabase.auth une trentaine de lignes AVANT l'attente de
  initSupabase(), donc avant l'existence du client — page blanche et
  « supabase is undefined » dès l'ouverture du fichier en local. Réglage
  déplacé après l'attente, et gardé. Le Router, lui, tentait un pushState
  vers une URL applicative depuis un document d'origine « null » : refus du
  navigateur et console inondée de SecurityError. L'historique est désormais
  sauté en file://, le titre de page reste posé.

  Reste à faire sur ce chantier : agenda du Planning (la personne apparaît
  deux fois dans la liste des disponibilités) ; tableau transport écran et
  PDF (elle y figure deux fois) ; profil public, où « Dupliquer » recopie
  aussi le calendrier de disponibilités, le véhicule et le téléphone alors
  que ces trois-là tiennent au corps et doivent devenir COMMUNS aux fiches
  technicien.

vv599 (en cours)

  Livre avec vv598 mais pousse APRES la fusion, donc absent de la version
  publiee : le correctif du CHAMP EFFACE QUI REVENAIT, repris ici.

  VIGNETTES DU STORYBOARD — LA CAUSE, TROUVEE EN BASE. Quatre correctifs
  successifs avaient echoue parce qu'ils cherchaient dans le RENDU. La reponse
  etait dans la DONNEE, et il a fallu ouvrir la base pour la voir :
    - bucket 'projects' : PRIVE (storage.buckets.public = false) ;
    - les 32 objets image du projet testes stockent une URL de forme
      /object/public/projects/... — zero signee, zero chemin brut ;
    - une adresse publique sur un bucket prive est TOUJOURS refusee par le
      serveur : ces images ne pouvaient donc jamais se charger.
  POURQUOI CET ETAT : Utils.migrateProjPathsInData convertit justement ces URLs
  en chemins bruts, mais son appel dans Store etait garde par un drapeau
  BOOLEEN (_mediaPathsMigrated). Une fois pose, la migration ne repassait plus
  jamais — les medias ajoutes APRES ce passage restaient donc en forme publique
  pour toujours. Constate : drapeau deja a true sur le projet, 7 projets sur 38
  marques migres. Le drapeau devient VERSIONNE (valeur 2) : la migration rejoue
  une fois pour tout le monde, elle est idempotente, et le resultat part au
  prochain enregistrement.
  DEFENSE AJOUTEE, car la donnee peut toujours redevenir sale : une URL de
  media projet n'est PLUS JAMAIS posee telle quelle. signedUrlFor rend la
  valeur stockee inchangee quand la signature n'est pas en cache — un repli
  presente comme sur, mais garanti de rater sur un bucket prive. Desormais,
  media projet = URL signee si le cache a repondu, sinon telechargement par le
  SDK ; les adresses data:, blob: et externes restent posees directement.
  LECON DE METHODE, a garder : quatre hypotheses de suite sur le mecanisme de
  rendu, toutes fausses, alors que la reponse tenait dans une requete SQL. Pour
  une image qui ne s'affiche pas, REGARDER D'ABORD CE QUI EST STOCKE.

  VIGNETTES, QUATRIEME PASSE : NE PLUS DEPENDRE DE LA SIGNATURE. Le diagnostic
  a tranche : « repeintes : 0 » et AUCUNE entree dans le cache d'images
  (pretes, en cours et echouees toutes a zero). Donc aucun chargement n'etait
  meme tente — l'URL signee n'est pas disponible pour ces objets image, alors
  qu'elle l'est pour les calques de dessin du meme plan (blobs_deja_en_cache a
  1). La difference tient au CHEMIN EMPRUNTE : les calques passent par
  StoryboardExport._resolveBlobUrl, qui telecharge le fichier par le SDK,
  authentifie, SANS signature ; les objets image, eux, dependaient de
  Utils.signedUrlFor. getOrCreateUploadedImage a donc desormais DEUX chemins :
  URL directement utilisable (http, data:, blob:), sinon telechargement par le
  SDK comme les calques. Et quand rien n'aboutit, l'entree est RETIREE du cache
  au lieu d'etre marquee ratee, pour ne jamais bruler l'unique tentative.
  A RETENIR : dans ce fichier, deux mecanismes coexistent pour atteindre un
  media prive — l'URL signee et le telechargement SDK. Quand l'un affiche et
  l'autre pas sur la MEME donnee, c'est le premier endroit ou regarder.

  VIGNETTES, TROISIEME PASSE : L'UNIQUE TENTATIVE BRULEE. La garde corrigee
  ci-dessous a debloque l'affichage sans clic sur une fiche, mais il fallait
  encore quitter la scene et y revenir. Piste suivie :
  getOrCreateUploadedImage posait « img.src = Utils.signedUrlFor(imageData) »
  SANS verifier ce que signedUrlFor avait rendu. Or cette fonction rend le
  CHEMIN BRUT tant que l'URL n'est pas signee — une adresse relative, qui
  echoue, et dont l'echec etait memorise DEFINITIVEMENT (failed: true). L'unique
  tentative etait donc brulee, et l'image ne s'affichait plus jamais meme une
  fois la signature disponible. On s'abstient desormais quand l'URL n'est pas
  utilisable, SANS rien mettre en cache : le rendu suivant reessaie. Retiree
  aussi la condition « pas pendant l'edition d'un plan » ajoutee a la passe
  precedente — sans consequence, et une condition de trop est un frein possible
  de plus. Ajoutes au diagnostic : l'etat des OBJETS IMAGE (pretes, en cours,
  echouees, non signees) et le nombre de repeintes depuis le chargement.

  VIGNETTES DU STORYBOARD, LA CAUSE REELLE — UNE GARDE QUI NE PASSAIT JAMAIS.
  Trouvee grace au diagnostic pose a l'etape precedente : il a montre que TOUT
  etait en place (calques presents, blobs deja en cache, canvas bien dans le
  document) et que l'image n'etait pas un calque mais un OBJET IMAGE insere.
  Quand un tel objet n'est pas encore charge, renderObjectsOnCanvas dessine un
  remplacant en pointilles — le rectangle vide qu'on voyait. Sa repeinte etait
  bien prevue a la fin du chargement, mais gardee par
  « state.currentShotId === null ». Or state.currentShotId N'EXISTE PAS dans le
  code : seuls DrawingEditor.currentShotId et ScriptReport.currentShotId sont
  poses quelque part. La condition valait donc undefined === null, soit FAUX
  EN PERMANENCE, et la repeinte ne partait jamais — jusqu'a ce qu'un autre
  evenement redessine la liste, typiquement l'ouverture puis la fermeture d'une
  fiche de plan, d'ou « toutes les images apparaissent d'un coup apres avoir
  clique ». Le defaut etait present DEUX FOIS (objets image et icones SVG).
  Remplace par la bonne condition — ne pas redessiner la liste pendant qu'on
  EDITE un plan — et par une repeinte coalescee (Storyboard.
  planifierRepeinteVignettes), sans quoi dix images arrivant ensemble
  provoqueraient dix redessins complets.
  A RETENIR POUR TOUT AUDIT : chercher les gardes qui comparent une propriete
  jamais ecrite. Elles ne levent aucune erreur, ne laissent aucune trace, et
  desactivent silencieusement le code qu'elles protegent.

  VIGNETTES DU STORYBOARD, DEUXIEME CAUSE — LE CANVAS ORPHELIN. La premiere
  correction (cache des blobs, ci-dessous) n'a pas suffi : les miniatures
  restaient vides tant qu'on n'avait pas ouvert une fiche au moins une fois.
  Trouve dans renderDrawingData : le CONTEXTE du canvas etait capture a
  l'appel, alors que les calques se dessinent APRES leur telechargement. Si la
  liste des plans est redessinee entre-temps — changement de scene, retour
  d'onglet, simple second rendu — la peinture atterrit dans un canvas retire du
  document, et la vignette reste vide jusqu'au rendu suivant. La fonction
  accepte desormais un IDENTIFIANT de canvas et le retrouve au moment de
  peindre, jamais avant ; les deux vignettes (compacte et fiche) le lui passent.
  Corrige au passage : les calques partaient tous en parallele et se dessinaient
  dans leur ordre d'ARRIVEE, si bien qu'un calque lourd place dessous pouvait
  recouvrir ceux du dessus. Ils sont dessines l'un apres l'autre, dans l'ordre
  du dessin.
  OUTIL : app.Storyboard.diagVignettes() dans la console liste, plan par plan,
  ce que la vignette a de quoi dessiner (calques visibles, calques stockes,
  blobs deja en cache, objets vectoriels, canvas present et dans le document).
  Il tranche entre les trois causes qui donnent le meme symptome : le dessin
  n'est pas la / il ne se telecharge pas / il n'arrive pas jusqu'au canvas.

  VIGNETTES DU STORYBOARD : LA VRAIE CAUSE. Signalement precis : dans la liste
  des plans, les images n'apparaissaient qu'apres avoir ouvert PUIS referme la
  fiche d'un plan — et alors toutes d'un coup. Trouve : les DESSINS ne passent
  pas par le cache d'images du navigateur. Ils sont telecharges en blob par le
  SDK (StoryboardExport._resolveBlobUrl), et _loadPrintImg REVOQUAIT l'URL blob
  juste apres l'avoir dessinee. Chaque rendu de la liste retelechargeait donc
  tout, d'ou des vignettes vides le temps des telechargements ; le second rendu,
  lui, retrouvait les reponses dans le cache HTTP et affichait tout d'un coup.
  Corrige : les URL blob sont gardees dans un cache borne (150 entrees, la plus
  ancienne liberee), les demandes simultanees sur le meme dessin sont mutualisees,
  et le cache est vide au changement de projet. La revocation apres dessin est
  supprimee.
  CONSEQUENCE SUR LE PRECHAUFFAGE : il visait le mauvais canal. Un calque de
  dessin ne se rechauffe pas avec une balise image mais en remplissant le cache
  de blobs (Utils._warmBlobs). Le collecteur du storyboard separe desormais les
  DESSINS (blobs) des images TELEVERSEES (balises) ; le mood board, dont les
  elements sont de vraies balises, reste sur le canal image.

  ANCIEN FORMULAIRE DE PROFIL : LA CAUSE, ET PLUS LES SYMPTOMES. Constat fait
  en ouvrant le chantier : ce formulaire est deja INATTEIGNABLE — openFicheCard
  intercepte les quatre casquettes, chacune ouvre sa propre fiche, et plus
  aucun onclick n'ouvre l'ancienne modale. Il restait pourtant LU a deux
  endroits vivants, saveCurrentProfile et switchToProfile, qui rejouaient
  par-dessus la fiche des valeurs d'un formulaire que personne ne voyait : la
  cause commune des deux bugs du 19 septembre, jusque-la seulement rustines.
  Ces deux lectures sont coupees. Le type du profil, seul element legitime
  qu'on en tirait, se deduit desormais des casquettes actives sans passer par
  le DOM. Au passage, firstEnabledFacet corrigee : elle testait
  facets.crew.enabled, or facets.crew est un TABLEAU depuis v597 — un compte
  purement technicien n'avait donc aucune casquette active a ses yeux.
  Reste la suppression du code mort, decrite au RESTE A FAIRE.

  PRECHAUFFAGE DES IMAGES revu. Un prechauffage existait deja et son principe
  etait bon ; il partait jusqu'a 4 s trop tard, lancait des centaines d'images
  d'un coup, et ne disait jamais s'il avait travaille. File commune servie 4 a
  la fois, depart a 1 s, abstention en connexion econome, et Utils.prefetchInfo()
  pour lire le bilan dans la console.

  CHARGEMENT DIFFERE DES GROS MODULES : non fait, et l'estimation « rendu
  simple par le decoupage », notee plus tot dans la journee, etait FAUSSE —
  corrigee au RESTE A FAIRE. Le decoupage porte sur la SOURCE ; le fichier
  publie reste un seul bloc de script.

  DECISIONS DE FIN DE CHANTIER (19 septembre) : garage personnel ECARTE, les
  vehicules en plus passent par le parc de regie ; retrait de l'ancien
  formulaire de profil, chargement des gros modules a la demande et
  prechargement des images storyboard / moodboard ouverts au RESTE A FAIRE.

  DECOUPAGE DU FICHIER UNIQUE. index.html (4,62 Mo, 83 800 lignes) devient un
  fichier GENERE, reconstruit par tools/build.mjs a partir de 106 morceaux
  ranges dans src/parts/ : 98 fichiers JavaScript (12 Ko en mediane, 65 sous
  les 20 Ko), 2 feuilles de style, 6 blocs de page. Le decoupage suit les
  declarations de module de premier niveau ; le code qui suit un module sans
  en ouvrir un autre reste attache au morceau precedent.
  CHOIX CENTRAL : les morceaux sont des TRANCHES BRUTES du fichier, remises
  bout a bout dans l'ordre de leur prefixe numerique. Aucune transformation,
  donc la reconstruction redonne le fichier a l'OCTET PRES — verifie par
  empreinte SHA-256 identique avant et apres le premier decoupage. C'est ce
  qui rend ce chantier verifiable au lieu d'etre un pari.
  ECARTE : le passage a de vrais modules JavaScript (import / export). Les 95
  modules partagent aujourd'hui une seule portee ; les separer demanderait de
  reecrire toutes leurs references entre eux, casserait l'ouverture du fichier
  en double-clic (les navigateurs bloquent les modules en protocole file:) et
  imposerait 95 requetes au demarrage sans etape de construction.
  REGLE : ne JAMAIS editer index.html a la main. L'action GitHub
  « verifier-build » relance la reconstruction a chaque push et echoue si le
  fichier publie ne correspond plus a src/parts/.
  LE CHAMP EFFACE QUI REVENAIT. L'ANCIEN formulaire de profil — le doublon
  signale plus haut comme « a retirer » — n'etait pas rafraichi a la fermeture
  de la fiche unifiee : il gardait a l'ecran les valeurs d'AVANT l'edition. Or
  « Sauvegarder » reconstruit le profil depuis ses 54 champs puis recopie le
  resultat dans la casquette (_commitFlatToFacet). Un champ vide dans la fiche
  se voyait donc repeupler par l'ancienne valeur, dans le profil ET dans la
  casquette. A la fermeture, le formulaire est desormais realigne sur la fiche
  qui vient d'etre editee (_loadFacetToFlat puis loadProfileToForm). LIMITE
  ASSUMEE : cet ancien formulaire ne sait representer que la casquette comedien
  et la PREMIERE fiche technicien ; pour les fiches technicien suivantes il est
  declare non charge (_loadedFor a null), ce qui suffit a neutraliser sa garde
  interne et empeche « Sauvegarder » d'y relire des valeurs qui ne sont pas
  celles de la fiche editee. C'est un pansement : le vrai remede reste le
  retrait de ce formulaire.
