  LES GALERIES PHOTO : DE 3 A 10, ET EN MEILLEURE QUALITE. Le nombre etait
  ecrit A QUATRE ENDROITS — deux controles et deux libelles — plus deux fois
  dans les textes d'aide. Six copies du meme chiffre, donc six occasions qu'il
  diverge. Il vit maintenant dans CONFIG.maxGaleriePhotos, et se change une
  fois.
  LA QUALITE SUIVAIT DEUX REGLES DIFFERENTES SELON LA PORTE : la galerie d'un
  projet enregistrait en 1920 px, celle du profil public en 800 px et 0,8 —
  un portrait y perd ses traits des qu'on l'agrandit, alors que c'est
  precisement ce qu'on fait quand on regarde un casting. Le profil passe a
  1600 px / 0,9. L'avatar, lui, reste petit : c'est une vignette, pas une
  photo qu'on juge.

  LE CASTING D'UNE FICHE OUVRE LE TRI. « Depuis une fiche personnage ou
  technicien non relie a quelqu'un, je veux que ca trie comme si j'etais dans
  l'Univers. »
  AVANT, ce bouton ouvrait la CARTE avec les filtres physiques du personnage
  pre-remplis. Un filtre est binaire : il EXCLUT. Le tri, lui, NOTE et classe —
  un comedien qui ne coche pas tout descend dans la pile au lieu de
  disparaitre. Pour un role a distribuer, c'est la bonne facon, et c'est celle
  qu'on a deja construite.
  MEME MOTEUR, MEME VUE, MEME TRI : seule la porte change, on entre par UNE
  fiche au lieu du projet entier. Le poste de la fiche passe en tete et s'ouvre
  en premier ; les autres postes du projet restent dans la liste deroulante —
  on ouvre sur le bon, on n'enferme pas dedans.
  LE BESOIN EST FABRIQUE DEPUIS LA FICHE quand le projet ne le declare pas :
  un technicien inscrit dans l'equipe sans que son poste soit coche dans
  Presentation doit quand meme pouvoir etre cherche, sinon le bouton de sa
  fiche ne repondrait rien. Et il ne fait pas doublon avec le meme poste
  declare ailleurs.
  ON NE QUITTE PAS LE PROJET : l'Univers est deplace dans une fenetre
  flottante puis remis a sa place. Le tri est EFFACE en partant — sinon les
  vues Carte et Liste de l'Univers resteraient filtrees par une recherche
  qu'on a quittee.
  LE BOUTON NE S'AFFICHE QUE QUAND IL SERT : un role deja caste et un poste
  deja tenu par quelqu'un de l'Univers ne le montrent plus. Un technicien
  n'apporte le sien que s'il a un poste ecrit — sans poste, il n'y a rien a
  chercher, et on le DIT au lieu d'ouvrir une pile vide.

  LES DOSSIERS SE RANGENT AUSSI ENTRE EUX. Un seul geste, trois intentions,
  et chacune se voit AVANT qu'on lache : les BORDS d'une tuile rangent a cote
  (avant ou apres, barre franche d'un cote), le MILIEU range dedans (contour
  complet). Un PROJET, lui, n'a pas de rang parmi les dossiers : quel que soit
  l'endroit ou on le lache sur une tuile, il va dedans.
  L'ORDRE EST ENREGISTRE, donc il survit a la fermeture. Les dossiers crees
  avant qu'il existe n'en ont pas : ils gardent leur rang d'origine et passent
  apres ceux qu'on a ranges — personne ne voit son classement se melanger.
  ON RENUMEROTE LA FRATRIE ENTIERE a chaque deplacement, plutot que de glisser
  une valeur entre deux : c'est la seule facon d'avoir des rangs qui restent
  justes apres dix deplacements. Et un dossier qui ARRIVE dans une autre
  fratrie se met au bout, pas au rang qu'il occupait dans l'ancienne.

  LE BANDEAU « VOTRE PROFIL EST COMPLET » A ETE RETIRE. Il s'affichait en vert
  juste a cote du triangle qui disait l'inverse. Ce n'etait pas un defaut
  d'affichage : il avait SA PROPRE liste d'exigences (nom, telephone, ville,
  sexe), plus ancienne, sans rapport avec ce qu'il faut vraiment pour etre
  trouve dans une recherche. Deux reponses a la meme question, dont une
  fausse. La fonction qui l'ecrivait part avec lui.
  UNE SEULE REGLE DESORMAIS (PublicProfile.MANQUES) ET UN SEUL SIGNE, le
  triangle, qui dit au survol ce qui manque. C'est la meme lecon que les
  besoins comediens lus a la source : quand deux ecrans repondent
  separement a la meme question, l'un des deux ment tot ou tard.

  DANS LE HUB, LES DOSSIERS SE GLISSENT AUSSI. Un projet se rangeait deja dans
  un dossier ; un DOSSIER, lui, ne bougeait pas — le seul moyen d'en ranger un
  dans un autre aurait ete de le supprimer et de le refaire. Le rangement
  existait pourtant deja dessous (un dossier a un parent, et le programme
  refusait deja depuis toujours de ranger un dossier dans l'un des siens) :
  c'est le GESTE qui manquait, pas la mecanique.
  DEUX CHARGEMENTS DIFFERENTS SUR LE MEME GESTE, donc deux etiquettes
  separees : un projet voyage comme avant, un dossier sous une etiquette a
  lui. Le navigateur laisse LIRE LES ETIQUETTES pendant le survol mais pas leur
  contenu — sans etiquette distincte, une carte de projet ne saurait pas, au
  survol, si ce qui arrive est un projet ou un dossier, et s'allumerait pour
  quelque chose qu'elle ne sait pas recevoir.
  LE FIL D'ARIANE EST LA SORTIE, et c'est le point qu'il ne fallait pas
  oublier : sans lui, un dossier range dans un autre n'en ressortirait jamais.
  Il accepte les deux, projet comme dossier, et « Tous » remet a la racine.
  DEUX REFUS QUI SE VOIENT AVANT DE LACHER : un dossier pose sur lui-meme
  n'allume rien, et un dossier pose sur une carte de projet non plus. Un refus
  qui n'arrive qu'apres le lacher se lit comme un bug.

  LES VISITES GUIDEES SE CROYAIENT DANS UN PROJET DEPUIS L'ACCUEIL.
  Signale : « visite de l'onglet en cours » lancee depuis le hub ouvrait la
  visite du SYNOPSIS.
  LA CAUSE TIENT EN UNE PHRASE : revenir au hub MASQUE l'ecran du projet, il
  ne l'oublie pas. Le projet reste charge, son onglet reste marque actif dans
  un ecran cache — et les visites lisaient « y a-t-il un projet charge ? »
  au lieu de « qu'est-ce que je regarde ? ».
  LE MEME DEFAUT AVAIT UN SECOND VISAGE, oppose et plus genant encore : les
  visites du HUB (orientation, profil, contacts, univers) posent la question
  inverse, et se declaraient donc indisponibles LA OU ELLES SERVENT, des qu'on
  avait ouvert un projet une fois dans la session.
  UNE SEULE QUESTION MAINTENANT (Tour.dansUnProjet), posee par les vingt-cinq
  chapitres et par la lecture de l'onglet courant : projet charge ET ecran du
  projet affiche. Deux defauts opposes, une seule reparation — c'est le signe
  qu'on avait trouve la bonne question.
  AU PASSAGE, DEUX CHOSES QUI MENTAIENT AUSSI : un bouton « Demarrer » qui
  refuse ensuite n'est pas un bouton — le chapitre reste visible mais montre
  LA RAISON a la place (c'est aussi ce qui range enfin le Forum, ferme depuis
  ce matin) ; et « le Forum sert aux echanges » disparait de la visite
  d'orientation, qui promettait une porte qui n'existe plus.
  LES 60 CIBLES D'ETAPES sont reverifiees une par une : toutes vivantes.

  « PERMISSION DENIED FOR TABLE PROJECTS » A LA CREATION D'UN PROJET.
  L'insertion etait autorisee ; c'est le « .select() » qui la suit, pour relire
  la ligne creee, qui etait refuse.
  UN DROIT SQL N'EST PAS UNE REGLE RLS, et les deux rendent le meme code
  d'erreur — d'ou la confusion. Le droit SQL dit « as-tu le droit de toucher
  cette table » ; la regle RLS dit « quelles LIGNES as-tu le droit de voir ».
  Sans le premier, les secondes ne sont meme pas consultees. Le role
  « authenticated » avait perdu sa LECTURE sur projects, sans migration pour
  l'expliquer : fait a la main quelque part.
  QUE C'EST UN ACCIDENT SE DEMONTRE : la table porte TROIS regles de lecture
  ecrites pour ce role exact (proprietaire, membre, administrateur) — on
  n'ecrit pas trois regles pour quelqu'un a qui on vient de retirer le droit de
  lire. Et le trou est UNIQUE dans tout le schema, verifie table par table et
  role par role. Le role « anon », lui, avait garde sa lecture.
  RIEN N'A ETE OUVERT EN LE RENDANT, et c'est verifie plutot qu'affirme :
  38 projets en base, 3 vus par leur proprietaire, 0 par une adresse inconnue.
  LA REQUETE QUI TROUVE CE GENRE DE TROU EST GARDEE (sql/lecture_projects.sql) :
  toute regle RLS ecrite pour un role qui n'a pas le droit correspondant est
  une regle qui ne peut jamais servir. Elle doit ne rien renvoyer.

  LES BESOINS D'UN PROJET SE LISENT A LA SOURCE, PAS A LA MAIN. « Si un
  personnage n'a pas de comedien lie, il va directement dans besoins comediens ;
  des qu'il est lie, il se marque caste. » La distribution est DEJA saisie dans
  l'onglet Personnages : la recopier a la main, c'est deux listes a tenir, et
  une qui ment des qu'on oublie. Les personnages apparaissent donc d'eux-memes
  dans « Besoins comediens », avec « caste — Untel » ou « a distribuer », et le
  compte de ce qui reste. Les besoins ecrits a la main restent (tout n'est pas
  un personnage) et celui qui porte le nom d'un personnage ne fait plus doublon.
  POUR UN TECHNICIEN, L'EQUIVALENT DE « CASTE » EST « POURVU » : chaque poste
  coche dit qui le tient, ou « a pourvoir », avec le compte partiel quand il en
  faut plusieurs. On reconnait le metier avec LA MEME REGLE que la recherche de
  l'Univers — une seule facon de comparer deux intitules dans l'application.
  La recherche par projet cherche desormais les personnages NON castes.
  Le cloisonnement est respecte : sans acces aux personnages ou a l'equipe,
  l'ecran le DIT au lieu d'afficher une liste vide.

  SE MONTRER SANS POUVOIR ETRE TROUVE, C'EST LE PIRE DES DEUX MONDES.
  « Si un profil technicien n'a pas de fiche de poste, il ne peut pas cliquer
  sur visible dans l'Univers. »
  LA RAISON EST MESUREE, PAS SUPPOSEE : sur 288 profils publics, CENT QUATRE
  casquettes techniciens n'ont aucun metier ecrit. Elles sont sur la carte, on
  peut cliquer dessus — et elles ne ressortent sur AUCUNE recherche de poste,
  parce qu'il n'y a rien a reconnaitre. La personne croit etre dans le reseau,
  et personne ne la voit passer.
  CE QUI EST EXIGE, ET RIEN DE PLUS : de quoi etre TROUVE (le nom, la ville, et
  le metier pour un technicien, le genre et l'age pour un comedien) et de quoi
  etre CONTACTE. La photo s'ajoute pour un comedien, ou elle est l'essentiel.
  ON N'INTERDIT RIEN DE CE QUI EST DEJA LA : une fiche deja visible le reste, et
  on peut toujours se retirer. C'est la BASCULE VERS « visible » qui se refuse,
  en DISANT ce qui manque — une case qui revient toute seule sans explication
  est pire que pas de case du tout.
  LE MEME AVERTISSEMENT PARTOUT, ET C'EST LE POINT : sur la carte de casquette,
  sur la carte de profil, et dans la barre du haut sur « Mon Espace » et « Mon
  Profil », avec au survol la liste de ce qui manque. Il s'allume au chargement
  des profils et se rallume apres chaque enregistrement : il s'eteint donc de
  lui-meme des que le profil est complet, sans avoir a recharger la page.
  UNE SEULE TABLE DE REGLES (PublicProfile.MANQUES) pour les trois endroits :
  ajouter une exigence demain, c'est une ligne, et les trois suivent.

  LE FAUX CANAL NE SAVAIT PAS SE DESABONNER. Signale en revenant au tableau
  de bord depuis un projet, en local : « e.unsubscribe is not a function ».
  EN MODE FICHIER, LE TEMPS REEL EST COUPE et remplace par un faux canal qui
  ne fait rien. Il repondait a « on », « subscribe », « track » et « send » —
  mais pas a UNSUBSCRIBE. Or rendre un canal a la bibliotheque
  (removeChannel) l'appelle. Quitter un projet plantait donc.
  LE DEFAUT DORMAIT DEPUIS QUE LE MODE FICHIER EXISTE : il ne pouvait pas se
  voir tant que la bibliotheque ne se chargeait meme pas en local. La seconde
  adresse ajoutee ce matin l'a reveille — une correction qui en decouvre une
  autre, ce qui est plutot bon signe.
  LE FAUX CANAL REPOND DESORMAIS A TOUT CE QUE LA BIBLIOTHEQUE PEUT LUI
  DEMANDER, sans rien faire : en mode fichier il n'y a pas de temps reel, donc
  rien a defaire. Et rendre un canal ne tente plus rien non plus — il n'y en a
  jamais eu de vrai.

  UN SEUL CDN, C'ETAIT UN SEUL POINT DE PANNE. Le message ajoute ci-dessous a
  fait son travail des le premier essai : « La bibliotheque Supabase n'a pas pu
  etre chargee (CDN injoignable ?) », depuis un poste de travail. Sans lui on
  cherchait encore.
  CE QUE CA REVELE DEPASSE L'USAGE LOCAL : sans cette bibliotheque il n'y a PAS
  d'application — ni connexion, ni donnees. Si jsdelivr tombe, ou si un reseau
  d'entreprise le bloque, TOUT LE SITE s'arrete, pas seulement un fichier
  ouvert depuis un disque. Une dependance unique sur un service exterieur, sans
  rien derriere.
  UNE DEUXIEME ADRESSE (unpkg) EST DONC POSEE, mais seulement si la premiere
  reste muette : quatre secondes d'attente, ou tout de suite si le navigateur a
  deja signale l'echec. Le cas normal ne telecharge rien en double.
  L'EMPREINTE EST CONSERVEE SUR LA SECONDE ADRESSE. C'est le meme fichier, du
  meme paquet npm, donc la meme empreinte — et une bibliotheque
  d'authentification ne se charge pas sans verification. Si elle ne
  correspondait pas, le navigateur refuserait : on ne serait pas plus mal
  qu'avant, jamais moins sur. Verifie a l'essai, d'ailleurs : servir un faux
  contenu a cette adresse le fait REFUSER, la verification marche.
  ET LE MESSAGE SERT DE DIAGNOSTIC : il donne l'adresse qui n'a pas repondu.
  Si elle ne s'ouvre pas davantage dans un onglet, c'est le reseau qui bloque,
  pas Moteur. Un message qui permet de trancher vaut mieux qu'un message qui
  se contente d'etre poli.

  UNE ATTENTE QUI NE FINIT JAMAIS EST UN ECRAN NOIR. Signale en ouvrant le
  fichier en local : « ca fait un ecran noir sur le html et pas de message
  d'erreur ». Trouve en lisant le demarrage plutot qu'en devinant.
  LA BIBLIOTHEQUE SUPABASE ARRIVE D'UN CDN. Si elle n'arrive pas — pas de
  reseau, CDN bloque, machine hors ligne — la fonction d'initialisation se
  RAPPELAIT TOUTES LES CENT MILLISECONDES POUR TOUJOURS. Le demarrage restait
  bloque sur son attente, plus rien n'etait affiche, et la page restait noire :
  pas de message, pas d'erreur en console, rien a quoi se raccrocher.
  C'EST LE MEME DEFAUT QUE LES TROIS DE SEPTEMBRE — un mecanisme qui attend
  sans jamais conclure — et il se corrige pareil : une echeance (vingt
  secondes, large meme sur une connexion lente) et un MESSAGE. Mieux vaut dire
  franchement « la bibliotheque n'a pas pu etre telechargee, verifiez votre
  connexion » qu'un ecran noir : sur le premier on peut agir, sur le second
  non.
  A RETENIR POUR L'USAGE LOCAL : ouvrir le fichier depuis son disque marche —
  le protocole file: est gere expressement (temps reel coupe, renouvellement
  de jeton desactive) — mais IL FAUT LE RESEAU. Les bibliotheques et la base
  sont en ligne ; « en local » ne veut pas dire « hors ligne ».
  Verifie des deux cotes : CDN coupe, le message apparait au bout de vingt
  secondes ; CDN present, aucun message meme apres vingt-trois secondes.

  L'UNIVERS : LE MATCH DANS L'AUTRE SENS, ET UNE TROISIEME VUE POUR TRIER.
  Il ne savait faire qu'un sens — « mon profil, quels projets me cherchent » —
  alors que celui qu'on utilise en montant un film est l'autre : « mon projet,
  qui peut tenir les postes qui me manquent ».
  CE QUI COMMANDE TOUT LE RESTE : on ne cherche pas UNE personne, on cherche
  POSTE PAR POSTE. « Pour le role de Pierre : ces trois comediens. Pour le
  poste de chef operateur : ces deux techniciens. » Les resultats sont donc
  ranges par BESOIN, jamais en liste plate — c'est aussi la seule facon
  d'ecrire ensuite un mail qui dise a quelqu'un POUR QUOI on le contacte.
  MES PROJETS ET MES PROFILS N'ONT PAS BESOIN D'ETRE PUBLIES pour chercher :
  ils sont a moi. Les besoins d'un projet vivent dans son onglet Presentation,
  pas dans sa fiche publique — ils existent des qu'on les a saisis. EN FACE,
  RIEN NE CHANGE : on ne trouve que des profils PUBLICS, le serveur ne rend
  pas les autres. Question posee au developpeur avant d'ecrire une ligne, et
  tranchee par lui : « on ne peut pas trouver les profils non publies, of
  course ». Montrer quelqu'un qui a choisi de ne pas apparaitre aurait ete un
  choix de produit deguise en detail technique.
  LE MENU LISTE UNE CASQUETTE PAR LIGNE, pas un profil : chercher « pour mon
  profil » ne veut rien dire quand on est a la fois comedien et chef
  operateur ; chercher « pour ma casquette de chef operateur », si.
  LA TROISIEME VUE — le tri au pouce. Une pile de cartes, trois gestes : la
  croix ecarte, le coeur garde, le drapeau ouvre le recapitulatif. LES CARTES
  SUIVENT L'ORDRE DES BESOINS, elles ne sont pas melangees : on distribue un
  role, puis le suivant. Melanger obligerait a se redemander a chaque carte
  « pour quoi je regarde cette personne ? ».
  LES ECARTES SONT RETENUS PAR PROJET, dans le navigateur — sinon la pile
  reproposerait trente fois les memes. Ce n'est pas une donnee du projet :
  c'est un tri personnel, il n'a rien a faire dans le fichier partage. Un
  bouton remet tout a zero, et l'on peut annuler le dernier geste : il part
  vite.
  LES TROIS MAILS, ET CE QU'ILS SONT VRAIMENT :
  - INVITER n'est PAS un mail. C'est la vraie invitation en attente, celle du
    bouton « Partager » : elle ne donne aucun acces tant qu'elle n'est pas
    acceptee, et elle porte deja le consentement et la moderation. Ecrire un
    deuxieme systeme d'invitation aurait ete le defaut du chantier.
  - PROPOSER LE PROJET met la fiche projet dans le corps du mail.
  - LE MESSAGE PERSONNALISE demande le NOM et le ROLE, pre-remplis et
    modifiables : c'est tout l'interet d'un message a soi.
  IL N'Y A PAS D'ENVOI COTE SERVEUR pour les deux derniers : ils partent de
  VOTRE adresse, par votre logiciel de courrier. Consequence concrete, dite
  au developpeur avant de commencer : un message personnalise est par
  definition un mail PAR PERSONNE. Pour les deux autres, un seul mail avec
  tout le monde en copie cachee est propose — personne n'a a decouvrir a qui
  d'autre on a ecrit.
  UNE PERSONNE, PAS UNE CARTE : quelqu'un garde pour deux postes n'apparait
  qu'une fois au recapitulatif, en nommant ses deux postes.
  DEUX PIEGES RENCONTRES EN VERIFIANT, dont aucun ne se voyait a la lecture :
  - MA FAUSSE SCENE D'ESSAI PORTAIT LE MEME IDENTIFIANT QUE LA VRAIE, restee
    cachee dans la page. getElementById rendait la vraie : mes mesures
    disaient « zero pixel » alors que le code etait juste. Les essais se font
    maintenant dans la vraie fenetre de l'Univers.
  - EN MODE SOMBRE, une regle generale repeint TOUS les boutons en gris clair
    avec « !important ». La croix et le coeur sortaient donc de la meme
    couleur que le bouton d'annulation — les trois gestes devenaient
    indistinguables, ce qui est exactement ce qu'il ne faut pas ici. Et le
    « !important » ne suffit pas seul : a importance egale c'est la
    SPECIFICITE qui tranche, et « body.dark-mode button » en a plus qu'une
    classe simple.

  LA PAGE QUI SE TOURNE, EN CHANGEANT D'ONGLET. La page ARRIVANTE pivote sur
  sa charniere, comme une feuille qu'on rabat.
  ET LE SENS SUIT LE DEPLACEMENT : la charniere est a GAUCHE quand on avance
  d'un onglet, a DROITE quand on revient en arriere. C'est le seul detail qui
  separe le geste d'un simple effet — une page qui se tourne toujours du meme
  cote quand on REMONTE sonne faux. Le rang des deux onglets se lit dans la
  barre AVANT de toucher aux classes, puisque ce sont elles qui disent d'ou
  l'on vient.
  LA PAGE QUI PART N'EST PAS ANIMEE, ET C'EST UN CHOIX. Pour la faire pivoter
  il faudrait la garder affichee en meme temps que la nouvelle, donc la sortir
  du flux — la hauteur de la page sauterait — et surtout dessiner DEUX onglets
  a la fois. L'oeil suit ce qui arrive ; le pivot suffit a donner le geste.
  J'AI CRU QUE CA COUTERAIT CHER, ET J'AI MESURE AVANT DE RENONCER. Un onglet
  de cinq cents scenes fait 96 866 pixels de haut : je m'attendais a des images
  sautees pendant la rotation. Resultat sur ce cas : 16,7 ms d'image mediane
  AVEC comme SANS l'animation, et zero image longue. Le navigateur ne dessine
  que les tuiles visibles, et la rotation se fait sur la carte graphique. La
  precaution que j'allais prendre — desactiver l'effet sur les onglets lourds —
  n'avait aucune raison d'etre, et elle aurait ajoute du code pour rien.
  VERIFIE AUSSI : aucune barre de defilement horizontale pendant le tour, dans
  les deux sens. Et le reglage « moins de mouvement » du systeme l'eteint,
  comme le reste.

  LA SOURIS PRES DU BORD FAIT DEFILER LA LIGNE D'ONGLETS. Demande du
  developpeur apres coup, et elle repare un trou que la refonte avait creee :
  au doigt on glisse, au clavier on tabule, mais A LA SOURIS il fallait
  attraper une barre de defilement — celle qu'on venait justement de masquer.
  Approcher le bord suffit maintenant. LA VITESSE SUIT LA PROXIMITE : a peine
  entre dans la zone on avance lentement, colle au bord on avance vite. Une
  vitesse fixe fait toujours depasser ce qu'on visait.
  ET LA BOUCLE S'ARRETE VRAIMENT : des que la souris quitte la barre, que la
  barre disparait de la page, ou qu'elle ne deborde plus. Une boucle
  d'animation qui tourne pour rien est une boucle qu'on a oubliee.

  LES FENETRES S'EN VONT EN DOUCEUR, PAS SEULEMENT A L'ARRIVEE. « Est-ce qu'on
  pourrait ajouter de legeres animations un peu partout, sans que ce soit too
  much ? Deja ouverture fermeture d'une fiche c'est pas mal ? »
  LE DESEQUILIBRE ETAIT REEL ET JE NE L'AVAIS PAS VU : les fenetres arrivaient
  deja en fondu depuis longtemps, mais elles DISPARAISSAIENT D'UN COUP —
  « display: none » ne s'anime pas. D'ou l'impression de sec, qui ne venait
  pas d'un manque d'animations mais d'une moitie manquante.
  LE PRINCIPE, ET C'EST LUI QUI EVITE UNE COORDINATION FRAGILE : la classe qui
  AFFICHE la fenetre est retiree tout de suite — tout ce qui demande « la
  fiche est-elle ouverte ? » repond juste a l'instant meme, et il y a trois
  endroits qui le demandent — tandis qu'une classe de SORTIE la garde a
  l'ecran, inerte, le temps du fondu. Le style ne l'applique QUE si la classe
  d'ouverture est absente : rouvrir dans la foulee reprend la main sans qu'on
  ait rien a annuler.
  LA REPONSE D'UNE FENETRE DE CONFIRMATION EST RENDUE AVANT SON FONDU. On ne
  fait pas attendre deux dixiemes de seconde celui qui vient de cliquer
  « Confirmer » pour une question d'esthetique.
  ET QUI DEMANDE MOINS DE MOUVEMENT N'EN A AUCUN : le reglage du systeme
  d'exploitation est respecte, pour ces animations comme pour celles d'avant.
  Les fenetres continuent de s'ouvrir et de se fermer, simplement sans fondu.
  AJOUT DISCRET AU PASSAGE : le cadenas d'une zone occupee apparait au lieu de
  surgir. Il arrive par le reseau, a un moment qu'on ne choisit pas, et un
  element qui surgit au milieu d'une liste se lit comme une erreur d'affichage.

  LES ONGLETS D'UNE FICHE : UNE SEULE LIGNE, UN SOULIGNE, ET LE GLISSE.
  Question du developpeur : « est-ce que toutes les fiches qui ont des onglets
  ne seraient pas plus jolies, plus modernes, si on devait slider de gauche a
  droite pour acceder a la partie suivante ? et on supprimerait les onglets. »
  REPONSE : oui pour le geste, non pour supprimer les onglets — et le
  developpeur a ajoute la piece qui manquait, « qu'il n'y ait qu'une ligne ».
  POURQUOI GARDER LES ONGLETS. Une fiche de comedien en compte six. La barre
  est la CARTE de la fiche : elle dit ce qui EXISTE sans avoir a y aller. En
  glisse seul, on ne sait pas qu'il y a une section « Cachet » avant d'avoir
  glisse quatre fois. Et l'on ne lit pas une fiche de gauche a droite : on
  saute de la photo aux notes, du planning au cachet. Le glisse convient au
  parcours lineaire — une galerie — pas a l'aller-retour. Sur ordinateur, ou
  il n'y a pas de glisse, il aurait fallu des fleches : des onglets avec moins
  d'information.
  CE QUI ETAIT VRAIMENT DATE, C'ETAIT LA BARRE. Les onglets se dessinaient en
  chemises de classeur — un cadre par onglet, la languette active collee au
  panneau — et surtout ILS REVENAIENT A LA LIGNE : six onglets sur un
  telephone faisaient deux rangees, et la fiche commencait quarante pixels
  plus bas selon celui qu'on avait choisi. Le contenu bougeait quand on
  changeait d'onglet. Maintenant : une ligne qui defile, un simple souligne
  sous l'onglet actif, et les deux bords qui s'estompent quand il y en a
  encore a cote.
  LE GLISSE S'AJOUTE, ET IL NE VOLE RIEN. Un seul ecouteur pose une fois pour
  toutes — les brancher a chaque rendu, c'est en oublier un et en empiler dix
  sur le meme element quand la fiche se redessine. Il refuse le geste qui part
  d'une zone DEJA defilante (une galerie de photos, la barre elle-meme) ou
  d'un champ de saisie : sans cette reserve, faire defiler ses photos aurait
  change d'onglet. Il exige soixante pixels et une direction franchement
  horizontale. Il ne boucle pas : revenir au premier apres le dernier fait
  perdre ou l'on est.
  DEUX DEFAUTS TROUVES EN MESURANT, ET AUCUN DES DEUX NE SE SERAIT VU A L'OEIL :
  - LE PANNEAU QUI ENTRE decale son contenu de dix pixels le temps de
    l'animation, ce qui faisait apparaitre une barre de defilement horizontale
    pendant deux dixiemes de seconde. Coupe avec « overflow-x: clip », qui
    coupe SANS creer de zone defilante — « hidden » aurait rendu le vertical
    defilant a son tour et coupe les menus deroulants des champs.
  - UNE BARRE ENCORE INVISIBLE MESURE ZERO. La fiche est construite avant que
    sa fenetre ne s'affiche : mesurer a cet instant repond toujours « ca ne
    deborde pas », et l'estompe ne serait jamais apparue. Plutot que de
    deviner le bon moment, on demande a etre prevenu quand la barre prend sa
    taille. Meme principe que la surveillance de la page pour les verrous :
    on regarde ce qui EST, on ne devine pas quand.

  CHANTIER CLOS le 22 septembre, sur « AH SUPER ca marche ». Recapitulatif du
  verrou fin tel qu'il finit : dix-neuf onglets, treize sans verrou d'onglet,
  aucun sans protection. Ce qui a change en deux jours tient en une phrase —
  le verrou est descendu de l'ONGLET au MORCEAU DE TRAVAIL REEL, et il se
  prend a l'OUVERTURE, pas a la frappe.
  CE QUE JE RETIENS, ET CE N'EST PAS LE CODE : les cinq defauts de ce chantier
  sont tous de la meme famille — J'AI VERIFIE UN ENDROIT ET CONCLU POUR TOUS.
  Une fonction sur deux qui dessine la meme liste, une entree sur deux vers la
  meme fiche, une espece sur dix dans une famille commune. A chaque fois le
  code que j'avais lu etait juste ; c'est le code que je n'avais pas lu qui
  manquait. Les deux batteries ajoutees (l'inventaire des zones, la liste des
  portes) ne testent pas un comportement : elles obligent a NOMMER les endroits
  un par un, ce qui est exactement l'etape que je sautais.
  Et le premier de ces tests passait alors que le defaut etait la, parce qu'il
  lisait aussi le fichier ou la liste est declaree : la liste se prouvait
  elle-meme. Un test ecrit dans la foulee de la correction merite qu'on le
  casse expres avant de le croire — c'est ce qui a ete fait pour les trois.

  LES PASTILLES D'ONGLET : DEUX DEFAUTS, DONT UN QUI SAUTAIT AUX YEUX.
  « Parfois on les voit, parfois non, et parfois les pastilles prennent
  plusieurs onglets sans qu'on comprenne. »
  1) L'ESPECE ETAIT IGNOREE. Les dix onglets de fiches partagent UNE famille
     de verrous, et l'on comptait tout ce qu'elle tenait. Verrouiller un
     personnage allumait donc Comediens, Decors, Equipe, Ressources,
     Structures, Storyboard, Mood board, Contrats et Rapports par-dessus le
     marche : dix pastilles pour une seule fiche. C'est le prix d'avoir
     regroupe dix especes sous un prefixe commun sans redescendre partout ou
     on le lisait.
  2) ELLES DISPARAISSAIENT AU MOINDRE REDESSIN. Les boutons d'onglet sont
     reconstruits a chaque navigation et emportaient la pastille avec eux ;
     elle ne revenait qu'a la relecture suivante, jusqu'a vingt secondes plus
     tard. On les repose au meme rythme que les cadenas de zone — des que la
     page bouge — et SANS RIEN TOUCHER quand rien n'a change, sinon la
     surveillance de la page aurait declenche sa propre surveillance.

  LES TROIS BOUTONS DE LA TOILE PASSENT AU-DESSUS DE LA FICHE. Ils sont poses
  sur le bord haut, or la pastille coupe ce qui depasse — c'est ce qui garde
  les longs noms dans leur cadre : ils arrivaient tranches en deux. On deplace
  la coupe d'un cran vers l'interieur, sur une enveloppe qui ne contient que
  le texte, et la pastille laisse sortir ses boutons. La fiche du CENTRE les
  recoit aussi : c'est une fiche comme les autres, elle n'avait aucune raison
  d'en etre privee.

  LA TOILE : LE CLIC DROIT RECULE, LES ACTIONS PASSENT AU SURVOL. Les deux
  actions d'une fiche (l'ouvrir, la voir dans le projet) etaient cachees dans
  un menu au CLIC DROIT. Personne n'y pense : sur une toile ou l'on navigue au
  clic gauche, le clic droit n'est pas un endroit ou l'on cherche. Elles
  apparaissent maintenant au SURVOL de la fiche, avec une troisieme :
  IMPRIMER. Et le clic droit sert enfin a ce qu'on attend de lui — RECULER,
  symetrique du clic gauche qui avance. Il marche aussi dans le vide : on ne
  vise pas une pastille quand on veut revenir en arriere.
  IMPRIMER UNE FICHE SEULE, SANS ECRIRE ONZE EXPORTS. Les exports PDF
  existants travaillent par FAMILLE ENTIERE — tous les personnages, tous les
  decors — aucun ne sait sortir une fiche, et plusieurs familles n'en ont
  aucun. On ouvre donc la fiche et on demande au navigateur d'imprimer CETTE
  fenetre, une regle d'impression masquant le reste. Une regle de style au lieu
  de onze fonctions, et ca marche pour les familles qui n'avaient rien.
  DETAIL QUI AURAIT ETE PENIBLE : les trois boutons arretent la propagation du
  clic. Sans cela, cliquer « Imprimer » aurait aussi recentre la toile sur la
  fiche — on aurait imprime en changeant de page.
  ET SUR TABLETTE, ou il n'y a pas de survol, les trois boutons restent
  visibles : caches, ils auraient ete inatteignables.

  LE NOM DES CHAMPS AU-DESSUS DES CHAMPS, DANS L'EDITION D'UN PLAN. Les sept
  champs n'etaient nommes que par leur texte d'invite — qui DISPARAIT des qu'on
  ecrit. Une fois le plan rempli, plus rien ne disait ce qu'on lisait.
  LES INTITULES NE S'AFFICHENT QUE DANS LA FENETRE : la meme fonction dessine
  la vignette de la grille et le contenu de la fenetre d'edition, et sur la
  grille les vignettes doivent rester compactes. La grille a quatre colonnes y
  passe en pile, sinon chaque intitule occuperait une case et decalerait tout
  d'un cran.

  LES RAPPORTS DE SCRIPT AUSSI. « Chaque rapport de script est une fiche ou
  pas ? Pourquoi ca ne serait pas possible ? » Troisieme fois que la question
  fait tomber une de mes categories. Reponse : c'est une fiche, et c'etait
  possible.
  J'AVAIS CLASSE RAPPORTS ET DEPENSES ENSEMBLE sous « cas mixte : chaque
  element est une fiche mais le total est un objet unique ». Vrai pour les
  Depenses — le budget est un seul objet, qu'on ne peut pas couper. FAUX pour
  les rapports : il n'y a pas de total, juste des rapports. Ranger deux choses
  ensemble parce qu'elles se ressemblent de loin, c'est ce qui m'a fait passer
  a cote trois fois de suite.
  LA SEULE VRAIE PARTICULARITE : les rapports sont ranges dans un DICTIONNAIRE
  et non dans une liste — une entree par plan, sous la clef « scene_plan ».
  Cela ne change rien au verrou (une clef stable suffit) et demande seulement
  une fusion a part a la sauvegarde. Elle suit les memes regles que celle des
  listes : je garde ce que j'ai touche, je prends le reste du serveur, je rends
  la sienne pour ce qu'il tient, mes suppressions tiennent, et une entree creee
  ailleurs n'est pas effacee.
  UN DETAIL QUI AURAIT FUITE EN BASE : la liste des refus est posee sur l'objet
  en propriete CACHEE. Sur une liste, une propriete ordinaire est ignoree par
  l'enregistrement ; sur un objet, elle serait partie avec.

  ET LES CONTRATS AUSSI — MEME ERREUR QUE POUR LES RESSOURCES, EN PLUS BETE.
  « Et pour les contrats ? Normalement chaque contrat est une fiche, non ? »
  Oui. Je l'avais range avec le Planning et les Depenses sous « un travail qui
  touche plusieurs elements a la fois », ce qu'il n'est pas du tout : un
  contrat a un identifiant, une ligne dans une liste, et un editeur a lui.
  C'etait la plus faible des huit raisons que j'avais donnees, et c'est
  exactement celle qu'il fallait interroger.
  L'EDITEUR PORTE L'IDENTIFIANT — c'est la que sont le titre, le statut et le
  document lui-meme — et la ligne de liste aussi, pour que le cadenas se voie
  sans ouvrir.
  LES MODELES NE SONT PAS DES FICHES : on les cree depuis un contrat et on les
  applique, on ne les ouvre jamais pour les modifier. Ils n'ont donc pas
  d'editeur a verrouiller. Leur protection vient d'ailleurs — voir ci-dessous.

  UNE SEULE REGLE POUR TOUTES LES LISTES, A LA SAUVEGARDE. En cherchant ou
  proteger les modeles, il est apparu que les deux blocs poses la veille — un
  pour les scenes, un pour les fiches — faisaient la MEME chose a deux
  endroits, avec DEUX lectures du serveur au lieu d'une. Ils n'en font plus
  qu'un, qui couvre les onze listes du projet : scenes, personnages,
  comediens, decors, equipe, ressources, structures, plans, planches, contrats
  et modeles.
  CE QUE CELA REGLE AU PASSAGE, SANS RIEN INVENTER : les modeles de contrat
  n'ont aucun verrou et n'en auront pas — mais deux personnes qui en creent un
  en meme temps ne peuvent plus s'annuler, puisque la fusion element par
  element garde les deux. Il n'y avait pas besoin d'un verrou, il fallait une
  bonne fusion. C'est vrai de TOUTE liste ou l'on ajoute et supprime sans
  editer.

  ET LE MOODBOARD SUIT, PLANCHE PAR PLANCHE. Derniere liste a descendre.
  SA FORME EST PARTICULIERE, et c'est elle qui m'avait fait le mettre de cote :
  une planche n'est pas une carte dans une liste, c'est une TOILE qu'on
  selectionne par un onglet, et une seule est ouverte a la fois. Or c'est
  justement ce qui rend le verrou NATUREL : on n'en tient qu'un a la fois, et
  choisir la planche suivante rend la precedente sans rien avoir a ecrire —
  c'est deja la regle du mecanisme commun.
  LE VERROU SE PREND A LA PORTE, comme pour l'editeur de dessin : on compose a
  la souris, le curseur de texte ne se pose nulle part, donc le declencheur
  habituel ne verrait rien. Choisir une planche, c'est venir y travailler.
  MAIS PAS EN LECTURE SEULE : consulter une planche sans droit d'ecriture ne
  prend rien. Bloquer quelqu'un parce qu'un autre REGARDE serait pire que
  l'ancien verrou d'onglet.
  DEUX ENDROITS PORTENT LA MARQUE : l'onglet de la planche, pour que le cadenas
  se voie dans la liste sans avoir a l'ouvrir, et la TOILE, pour qu'on comprenne
  pourquoi on ne peut pas y toucher. Le bouton « + Nouvelle » n'en porte pas :
  ce n'est pas une planche.
  BILAN FINAL DES DIX-NEUF ONGLETS : TREIZE sans verrou d'onglet, huit avec,
  aucun sans protection. Les huit qui restent entiers le sont pour une raison
  tenant en une phrase — un seul document (Titre, Presentation), la structure
  du recit (Saisons, Episodes), ou un travail qui touche plusieurs elements a
  la fois (Planning, Depenses, Rapports, Contrats).

  RESSOURCES, STRUCTURES ET STORYBOARD SUIVENT AUSSI — J'AVAIS TIRE LA
  MAUVAISE CONCLUSION. Remarque du developpeur : « ressource et asso, ce sont
  des fiches aussi, et il y a plein de champs modifiables A L'INTERIEUR ».
  Exact, et ma regle etait mal posee. J'avais compte les champs SUR LA CARTE et
  conclu « pas de champ, donc pas de verrou fin possible ». La bonne question
  n'est pas « la carte est-elle modifiable ? » mais « EXISTE-T-IL QUELQUE PART
  une zone ou le curseur se pose pour modifier cette fiche ? ». Pour une
  ressource, cette zone existe : c'est sa FENETRE, et elle est pleine de champs.
  Je l'avais meme deja fait pour la fiche de scene — sans en tirer la regle.
  LES TROIS FENETRES PORTENT DONC L'IDENTIFIANT, sur une enveloppe posee dans
  leur contenu : elle vit avec lui, donc elle disparait d'elle-meme quand on
  ouvre autre chose. Leurs cartes de liste le portent aussi, pour que le
  cadenas se VOIE depuis la liste — mais elles ne prennent pas le verrou :
  parcourir une liste, c'est lire.
  LE PLAN DE STORYBOARD A DEMANDE UNE TROISIEME FACON DE PRENDRE. On y dessine
  a la SOURIS sur une toile : le curseur de texte ne s'y pose jamais, le
  declencheur habituel ne verrait rien. Son verrou se prend donc A LA PORTE —
  ouvrir l'editeur de dessin sur un plan EST l'intention de le modifier, et la
  fermeture le rend. Le mecanisme commun le permettait deja sans rien changer :
  prendre et rendre sont des fonctions publiques, le curseur n'est qu'UN
  declencheur parmi d'autres. C'est aussi la reponse toute prete pour le mood
  board, le jour ou on le fera.
  BILAN DES DIX-NEUF ONGLETS : douze sans verrou d'onglet (dont Statistiques,
  en lecture seule), neuf avec. Aucun sans protection.

  DECORS ET EQUIPE SUIVENT — ET TROIS ONGLETS NE SUIVENT PAS, EXPRES.
  Demande : « fais le reste ». La bonne reponse n'etait pas « tous ».
  LA QUESTION A POSER AVANT DE RETIRER UN VERROU D'ONGLET : est-ce que le
  verrou fin s'accrochera vraiment ? Il se prend quand le CURSEUR entre dans la
  fiche. Si la fiche se modifie dans une FENETRE et non sur sa carte, le
  curseur ne se pose jamais sur la carte, le verrou n'est jamais pris — et
  retirer le verrou d'onglet ferait PERDRE de la securite au lieu d'en gagner.
  C'est exactement le piege des scenes, ou le refus avait ete pose sur un
  chemin que personne n'empruntait.
  COMPTE FAIT, CARTE PAR CARTE : personnages et decors portent VINGT champs
  modifiables sur la carte, l'equipe en porte DIX. Les ressources : ZERO. Les
  structures : zero (le seul champ est une recherche). Les plans de storyboard :
  zero. Les trois derniers se modifient en fenetre.
  DONC : Decors et Equipe passent au verrou par fiche. Ressources, Structures
  et Storyboard GARDENT leur verrou d'onglet, et c'est un choix, pas un oubli.
  CE QU'IL FAUDRAIT POUR LES FAIRE UN JOUR : marquer la FENETRE qui les
  modifie, comme on l'a fait pour la fiche de scene — une enveloppe portant
  l'identifiant a l'interieur du corps de la fenetre, qui disparait d'elle-meme
  quand on ouvre autre chose.
  LE MOODBOARD EST UN CAS A PART : une planche n'est pas une carte dans une
  liste, c'est une toile qu'on selectionne par un onglet, et une seule est
  ouverte a la fois. Le verrou fin y aurait une autre forme. C'est aussi
  l'onglet ou deux personnes travaillent ensemble le moins souvent.
  UNE CLASSE DE PLUS A NOMMER : la carte d'equipe ne porte pas la meme classe
  que les autres (elle est dessinee par une fonction a part). On l'a NOMMEE,
  plutot que de se fier a « tout element portant l'attribut » — c'est ce qui
  avait fait atterrir le badge des scenes sur des pastilles de commentaire et
  des cases d'export.

  CONTRATS AVAIT UN TROU, LE CASTING DESCEND A LA FICHE. Recensement des
  dix-neuf onglets, demande par le developpeur.
  CONTRATS N'AVAIT AUCUN VERROU, ni fin ni d'onglet, et aucune raison d'en
  manquer : ses trois cles s'ecrivent comme les autres. Deux personnes qui y
  travaillaient en meme temps s'ecrasaient, sans badge et sans message. Un
  verrou d'onglet suffit — un contrat se redige rarement a deux.
  LE CASTING PASSE AU VERROU PAR FICHE. Sur les sept onglets qui s'y pretaient
  — ce sont des LISTES DE FICHES, exactement le cas des scenes — c'est celui ou
  deux personnes travaillent VRAIMENT en meme temps : on remplit une
  distribution a plusieurs. Ailleurs, un verrou fin ajouterait du code sans
  rien regler ; c'est pour ca qu'on ne les a pas tous faits d'un coup.
  TROISIEME FAMILLE, ET LA PREMIERE QUI N'A RIEN COUTE : FicheLock tient en une
  declaration de zones plus dix lignes de traduction. Tout le reste — prendre,
  rendre, battre, suivre le curseur, marquer, annoncer aux autres — vient du
  mecanisme commun, y compris les cinq corrections gagnees a la dure par les
  scenes. C'est ce que le regroupement de la veille devait payer, et il paye.
  UNE SEULE PORTE DE RENDU, ET C'EST CE QUI REND LA CHOSE SURE :
  UIData.renderDataCards dessine la carte de la LISTE **et** le contenu de la
  FICHE ouverte en fenetre — CardModal.open reutilise ce rendu. Poser
  l'attribut a cet endroit couvre donc les deux ecrans d'un coup. Sur les
  scenes, il avait fallu nommer SEPT zones une par une, et en oublier d'abord
  presque toutes. Chercher la porte unique AVANT d'ecrire coute une lecture et
  evite une semaine.
  LE REFUS D'ECRITURE EST CELUI DES SCENES, tel quel : la mecanique qui
  recousait le tableau des scenes ne contenait rien de specifique aux scenes —
  c'est une liste d'objets a identifiant. Elle sert desormais les deux, sous un
  nom qui le dit. On relit le serveur avant d'envoyer, on reprend SA version
  des fiches qu'il tient, on garde notre ordre, et on le DIT a l'ecran.
  LA CLEF PORTE L'ESPECE — « fiche:character:12 », « fiche:actor:7 ». Ajouter
  les decors ou l'equipe demain, c'est poser l'attribut sur leur carte et
  retirer leur verrou d'onglet. Rien d'autre.

  UN VERROU RENDU DOIT SE VOIR TOUT DE SUITE, PAS DANS VINGT SECONDES.
  Signale sur le Synopsis : A passe du synopsis au resume court, et B voit les
  DEUX sections prises par A.
  MESURE D'ABORD, COMME IL SE DOIT : le serveur ne contenait AUCUN verrou de
  synopsis en attente, et la scene rejouee a l'identique — prise, changement de
  section, liberation, affichage — passe tous ses tests. Le mecanisme est donc
  juste ; c'est la NOUVELLE qui n'arrivait pas.
  POURQUOI. Chaque poste apprend les verrous des autres par l'evenement de base
  (project_locks). Cet evenement annonce fidelement les PRISES — une ligne
  apparait — mais les LIBERATIONS voyagent mal : une suppression n'emporte pas
  toujours de quoi reconnaitre le projet concerne, et l'evenement est alors
  ecarte sans un mot. Restait la relecture periodique, posee la veille : vingt
  secondes a regarder un cadenas qui ment. Assez court pour qu'on ne le voie
  pas en testant seul, assez long pour sauter aux yeux a deux.
  LA CORRECTION : on ne depend plus d'un evenement qu'on ne maitrise pas.
  Chaque poste ANNONCE lui-meme ce qu'il prend et ce qu'il rend, sur le canal
  deja ouvert pour les verrous. Quelques octets, et les autres relisent
  aussitot. La relecture periodique reste, en filet.
  PARTOUT A LA FOIS, ET C'EST L'INTERET D'AVOIR REGROUPE LE MECANISME LA
  VEILLE : l'annonce est posee dans VerrouFin — donc les scenes ET les sections
  de synopsis en profitent — et dans les verrous de DOMAINE, qui avaient
  exactement le meme trou depuis toujours.

  ET LE DERNIER PIEGE DE CE TABLEAU : LE RANG SERVAIT DE CLEF. Une fiche sans
  adresse prenait « crew_3 » — sa POSITION dans la liste. Reordonner l'equipe
  aurait decale les droits de tout le monde, en silence. Remarque juste du
  developpeur : une fiche sans adresse ne peut pas etre invitee, sa ligne ne
  sert donc a personne. C'est vrai — mais une clef qui se deplace est un piege
  qu'on ne laisse pas derriere soi quand il ne coute qu'une ligne. Elle prend
  l'identifiant de la fiche. Verifie en base avant de toucher a quoi que ce
  soit : aucune clef positionnelle n'existait, rien a reprendre.

  GERER LES ACCES, LA VRAIE CAUSE : DEUX LIGNES POUR UNE SEULE PERSONNE.
  Trouvee en allant lire les DONNEES du projet plutot qu'en relisant le code.
  ga.demauroy figure a la fois dans les COMEDIENS (« Comédien test 01 ») et
  dans l'EQUIPE : DEUX lignes dans le tableau des acces. Et l'adresse de
  figuration y revient SEPT fois.
  OR LES DROITS SE RANGENT PAR ADRESSE, pas par ligne : deux lignes, une seule
  entree. La sauvegarde ecrivait case par case en parcourant la page — la
  DERNIERE ligne lue gagnait. On reglait la case sur la ligne qu'on voyait, et
  la ligne jumelle, restee sur l'ancienne valeur, la reecrivait a l'identique.
  D'ou une ecriture qui part bel et bien mais ne change RIEN, au caractere pres.
  LE COMPTE LE CONFIRME : 16 comediens + 17 techniciens = 33 lignes affichees,
  pour 26 entrees de droits en base. L'ecart de 7, ce sont exactement les
  doublons (six lignes de figuration en trop, une ligne en double). Quand
  l'arithmetique tombe juste, on ne suppose plus.
  LA REGLE POSEE : un changement se pose sur TOUTES les lignes de la personne.
  Peu importe alors laquelle est lue en dernier, elles disent la meme chose.
  Plus un filet a l'enregistrement, pour le cas ou deux lignes divergeraient
  quand meme : on garde la valeur qui DIFFERE de l'enregistre, puisque c'est
  forcement celle qu'on vient de regler — l'autre n'est qu'une copie de ce qui
  est deja en base.
  DEUX DEFAUTS DE LA MEME FAMILLE, CORRIGES AVEC : les identifiants des cases
  etaient EN DOUBLE dans la page (meme personne, meme section, deux lignes),
  donc le preset et l'etiquette de role n'en servaient jamais qu'une ; ils
  passent par les donnees et servent maintenant toutes les lignes.
  CE QUE J'AURAIS DU FAIRE AU PREMIER SIGNALEMENT : regarder les DONNEES. J'ai
  relu le code quatre fois, corrige quatre defauts reels, et aucun n'etait la
  cause. Une seule requete — « quelle adresse apparait plus d'une fois ? » — a
  donne la reponse en dix secondes. Le code dit ce qu'il fait ; il ne dit pas
  ce qu'on lui donne a manger.

  GERER LES ACCES, QUATRIEME PASSAGE : L'ECRITURE PART, SANS LES CHANGEMENTS.
  Mesure faite en base apres un essai dirige — changer UNE case, enregistrer,
  puis relire : le projet a bien ete ecrit (updated_at a bouge), mais
  l'empreinte des droits est restee IDENTIQUE AU CARACTERE PRES. Le probleme
  n'est donc ni la sauvegarde ni le serveur : les cases LUES au moment du clic
  etaient deja les anciennes.
  TROIS TROUS COLMATES, TOUS DE LA MEME NATURE — la fonction faisait confiance
  a la page entiere :
    - ELLE LISAIT « TOUTES LES CASES DU DOCUMENT », pas celles de la fenetre
      ouverte. Rien n'enlevait l'ancienne fenetre avant d'en poser une nouvelle
      (document.body.appendChild sans retrait) : deux clics sur le menu en
      laissaient DEUX dans la page, l'une derriere l'autre. Les cases de la
      fenetre morte, restees sur les anciennes valeurs, etaient lues APRES —
      et comme on ecrit case par case, la derniere lue gagne. On ne lit plus
      que la fenetre ouverte, et rouvrir enleve l'ancienne.
    - ZERO CASE LUE PASSAIT POUR « RIEN A CHANGER ». Si le tableau n'etait pas
      rendu, la fonction ecrivait un tableau de droits VIDE sans un mot. Elle
      refuse maintenant, et le dit.
    - ET SURTOUT : « ENREGISTRE » SE DISAIT MEME QUAND RIEN N'AVAIT BOUGE.
      C'est ce qui a coute quatre allers-retours. L'ecran annoncait la reussite,
      la base ne changeait pas d'un caractere, et l'on cherchait du cote de la
      sauvegarde alors que le defaut etait AVANT elle. Quand les cases lues sont
      identiques a l'enregistre, on l'annonce : « aucun changement a
      enregistrer ». Ce n'est pas une panne, c'est une information — et elle
      aurait pointe le bon endroit des la premiere fois.
  Permissions.etat(), fenetre ouverte, dit combien de fenetres trainent, combien
  de cases sont lues dans la bonne, et combien dans toute la page.
  CE QUE J'AURAIS DU FAIRE PLUS TOT : mesurer AVANT de corriger. Les trois
  premieres corrections etaient de vrais defauts, mais aucune n'etait celle-la ;
  il a suffi d'un essai dirige et d'une empreinte relue en base pour couper le
  probleme en deux — avant ou apres l'ecriture — et tout s'est eclairci.

  LE VERROU DE SAUVEGARDE RESTAIT COINCE — ET C'ETAIT CA, DEPUIS LE DEBUT.
  Troisieme passage sur « les permissions ne s'enregistrent pas ». Les deux
  premieres corrections etaient de vrais defauts, mais pas celui-la. La
  precision decisive : « ca affiche enregistre, rien dans la console » ET
  « avant ca marchait pourtant ». Trois faits qui ne laissent qu'un mecanisme :
  quelque chose qui MARCHE, PUIS NE MARCHE PLUS, en silence, jusqu'au
  rechargement de la page.
  savingInProgress empeche deux sauvegardes de se chevaucher. Il etait leve a
  la main au debut de save() et rabaisse a la main a la fin — SANS FILET. La
  moindre exception entre les deux le laissait leve POUR TOUJOURS : une donnee
  circulaire que JSON.stringify refuse, une migration qui echoue, un module
  absent. Des lors, toute sauvegarde suivante ressortait a la premiere ligne,
  en silence. L'ecran annonce « enregistre », rien ne part, et ca ne se repare
  qu'en rechargeant la page.
  CE N'ETAIT DONC PAS UN DEFAUT DES DROITS — ni des presets, ni du mode fiche.
  TOUT etait bloque : le scenario, le depouillement, le planning. « Gerer les
  acces » n'a fait que le REVELER, comme les deux fois precedentes, parce que
  c'est le seul ecran qui annonce lui-meme sa reussite.
  LA REPARATION : save() devient une enveloppe qui tient le verrou et garantit
  sa descente par un « finally » — qui s'execute meme quand tout casse. Le
  corps de la sauvegarde ne touche plus au verrou : quatre endroits le
  bricolaient, ils n'en avaient plus besoin. Plus une limite de trente secondes
  au cas ou un chemin nous echapperait encore : passe ce delai on repart
  plutot que de se taire indefiniment. Et une exception ne disparait plus sans
  laisser de trace : console ET message a l'ecran.
  TROIS ETATS TENUS A LA MAIN, TROIS FOIS LE MEME DEFAUT, EN DEUX JOURS : le
  mode fiche moteur, le drapeau de veille, et celui-ci. LA REGLE QUI EN SORT :
  UN ETAT QU'ON LEVE A LA MAIN DOIT ETRE RABAISSE PAR UN CHEMIN QU'AUCUNE
  PANNE NE PEUT EVITER — un « finally », ou une preuve qu'on relit ailleurs.
  Sinon la question n'est plus de savoir S'IL restera coince, mais quand.
  StoreSave.etat(), a taper dans la console, dit en trois lignes si le verrou
  est pris et depuis combien de temps.

  LES IMAGES NE S'ACCUMULENT PLUS SANS COMPTER. Deux corrections, apres la
  question du developpeur sur le poids des projets.
  LE PRECHAUFFAGE SUIT LA PERSONNE. Il partait a l'OUVERTURE DU PROJET et
  lancait toutes les images du Storyboard ET du Mood Board — meme pour
  quelqu'un venu ecrire une scene et qui n'ouvrirait jamais ces deux onglets.
  Il part desormais quand on ENTRE dans l'onglet concerne, et une seule fois
  par onglet et par projet : y revenir dix fois ne relance rien.
  ET LE CACHE DES DESSINS SE MESURE EN OCTETS, PAS EN NOMBRE D'IMAGES. Il
  gardait « 150 images » — mesure qui ne veut rien dire : 150 vignettes de
  50 Ko pesent 7 Mo, 150 planches de 2 Mo en pesent 300. C'est le poids qui
  fait ramer, c'est donc le poids qu'on borne, a 50 Mo. Le nombre reste en
  second garde-fou, pour qu'un projet fait de minuscules images n'accumule pas
  des milliers d'entrees.
  ET IL JETTE ENFIN LA BONNE. « La plus ancienne » voulait dire la plus
  anciennement CHARGEE — qui pouvait etre celle qu'on regarde tout le temps,
  pendant qu'une image jamais revue restait en place. C'est maintenant la moins
  recemment SERVIE : resservir une image la remet en queue.
  CE QU'ON N'A PAS FAIT, ET POURQUOI : mesurer si « le navigateur rame ». Il
  n'existe aucun signal fiable et commun a tous les navigateurs ; le seul qui
  existe (performance.memory) ne vit que sur Chrome et ne compte QUE la memoire
  du code, pas celle des images — il mesurerait donc la mauvaise chose, sur un
  seul navigateur. Un plafond en octets mesure exactement ce qu'on veut
  limiter, sur tous les navigateurs, et se verifie par des tests.
  A NE PAS CONFONDRE, et c'est une precision utile : les 50 Mo dont on parlait
  pour le poids d'un PROJET (le document charge en entier a l'ouverture) n'ont
  rien a voir avec ces 50 Mo-ci, qui bornent les images gardees en memoire. Le
  plus gros projet pese 5,2 Mo.
  Utils.prefetchInfo() et StoryboardExport.blobInfo(), a taper dans la console,
  disent ce que fait le prechauffage et ce que pese le cache.

  LES DROITS DES MEMBRES SONT ENFIN PROTEGES COTE SERVEUR. Trouve en cherchant
  le defaut de « Gerer les acces » : la cle memberPermissions ne figurait PAS
  dans project_key_sections(), la table qui dit quelle section commande quelle
  cle. Le declencheur d'ecriture ne la regardait donc jamais, et n'importe quel
  membre EDITEUR pouvait la reecrire — donc s'attribuer des droits. Le
  navigateur ne propose ce tableau qu'au proprietaire, mais une protection qui
  ne tient qu'a l'interface n'en est pas une : il suffit d'envoyer la requete
  soi-meme.
  PAS UNE LIGNE DE PLUS DANS LA TABLE DES SECTIONS : une section y OUVRE un
  droit d'ecriture a qui la possede, et ici il faut l'inverse — seul le
  proprietaire ecrit cette cle, quels que soient ses autres droits. D'ou une
  regle a part (sql/droits_membres_proprietaire.sql).
  LA DECISION VIT DANS SA PROPRE FONCTION, pas enfouie dans le declencheur :
  peut_ecrire_droits_membres(projet, adresse) repond pour n'importe quelle
  adresse. On a donc pu VERIFIER qu'elle repond juste — proprietaire oui, meme
  ecrit en majuscules, co-proprietaire oui, membre editeur non, inconnu non,
  contexte serveur oui — sans avoir a se faire passer pour quelqu'un. Une regle
  de securite qu'on ne peut pas interroger est une regle qu'on croit sur parole.
  LES SAUVEGARDES ORDINAIRES NE VOIENT RIEN : le declencheur ne se reveille que
  si la cle a reellement bouge, et le navigateur n'envoie que les cles modifiees.
  ET LE REFUS SE DIT CORRECTEMENT : un refus de droit n'est pas une panne de
  reseau. La sauvegarde repondait « verifiez votre connexion » a tout echec, ce
  qui aurait envoye chercher du cote du wifi pendant des heures. Elle rend
  desormais la phrase du serveur quand c'est un refus.

  L'INACTIVITE MET EN VEILLE, ELLE N'EJECTE PLUS. Trois minutes sans rien
  toucher renvoyaient au tableau de bord. Le but etait bon — ne pas laisser
  quelqu'un bloquer une section pendant qu'il est parti boire un cafe — mais le
  remede etait brutal : on perdait sa page, son onglet, l'endroit ou l'on en
  etait. Demande du developpeur, mot pour mot : « je veux juste pas qu'on se
  deconnecte ; juste on perd le focus sur l'element ou on etait, et il faudra
  recliquer pour etre sur de pas bloquer quelque chose quelque part. »
  ON RESTE DONC DANS LE PROJET et l'on rend seulement ce qu'on tenait : la
  section fine (scene ou section de synopsis) ET le verrou d'onglet.
  IL FALLAIT SORTIR LE CURSEUR, PAS SEULEMENT LACHER LES VERROUS — sinon le
  verrou fin, qui SUIT le curseur, se serait repris dans la seconde et l'on
  n'aurait rien lache du tout. Le curseur quitte la zone, la selection est
  effacee, et c'est le clic suivant qui reprend la main.
  LE PIEGE, VU A TEMPS : depuis la veille, les verrous sont RELUS toutes les
  vingt secondes (filet pose apres le canal temps reel muet). Or cette relecture
  reprend automatiquement l'onglet courant quand il est libre — elle aurait donc
  repris la section vingt secondes apres la mise en veille, et la mise en veille
  n'aurait servi a rien. Trois endroits reprennent ainsi tout seuls ; les trois
  s'abstiennent desormais pendant la veille. Une correction en cache une autre :
  celle de la veille pouvait annuler celle du jour sans que rien ne le signale.
  CE QU'ON A GARDE DE L'EJECTION : elle SAUVEGARDAIT avant de partir. C'est la
  seule partie qu'il ne fallait surtout pas perdre — elle est faite avant de
  lacher quoi que ce soit. Et elle ne se declenche toujours qu'a PLUSIEURS
  reellement connectes et dans l'editeur : seul sur son projet, personne n'est
  mis en veille, il n'y a personne a qui rendre la place.

  « ENREGISTRE » ALORS QUE RIEN N'ETAIT PARTI — LE MODE FICHE RESTAIT COINCE.
  La vraie cause du signalement du 21 septembre, trouvee grace a une precision
  du developpeur : le message de REUSSITE s'affichait, et la console etait
  VIDE. Deux faits qui, ensemble, ne laissent qu'un endroit possible — une
  sortie silencieuse de la sauvegarde, avant toute ecriture.
  C'ETAIT LA PREMIERE LIGNE DE save(). Quand on edite une casquette depuis la
  page Profil, le moteur a besoin d'un projet : on lui en PRETE un vide, et le
  drapeau _engineMode empeche la sauvegarde de projet de partir — sans quoi on
  enregistrerait ce decor pret A LA PLACE du vrai projet. La garde est juste.
  LE DEFAUT EST QU'ELLE NE REDESCENDAIT QUE PAR LA PORTE PREVUE : tout ce qui
  faisait disparaitre le volet autrement — une navigation, un rendu qui refait
  la page — laissait le drapeau leve. Et alors TOUTE sauvegarde de projet
  repartait aussitot, sans erreur, sans message, sans rien dans la console.
  CE N'ETAIT DONC PAS UN DEFAUT DES DROITS : « Gerer les acces » n'a fait que
  le REVELER, parce que c'est le seul ecran qui annonce lui-meme la reussite.
  Tout le reste — scenario, depouillement, planning — se taisait pareil.
  DEUX REPARATIONS, ET UNE TROISIEME PAR PRINCIPE :
    - ON NE FAIT PLUS CONFIANCE AU DRAPEAU SEUL. Le volet est la preuve : s'il
      n'est plus a l'ecran, le mode est termine quoi qu'en dise le drapeau, et
      l'on remet en place le projet et le role qu'on avait pretes.
    - OUVRIR UN PROJET remet le mode a zero, deuxieme filet.
    - ET LA SAUVEGARDE NE SE TAIT PLUS quand elle refuse : elle renvoie false,
      et « Gerer les acces » dit alors que rien n'a ete enregistre au lieu
      d'annoncer une reussite. Un ecran qui ment sur une sauvegarde coute plus
      cher que la panne elle-meme : on cherche des heures du mauvais cote.
  LECON, la meme que pour les verrous de la veille : une garde POSEE SUR UN
  ETAT QU'ON MET A JOUR A LA MAIN finit toujours par rester coincee. Quand
  l'etat est deja visible quelque part — ici, un volet present ou absent — il
  faut le LIRE, pas le recopier.

  LE POIDS DU PROJET S'AFFICHE EN MEGAOCTETS SEULEMENT. « X Ko (Y Mo) »
  n'apprenait rien et encombrait la carte. Deux decimales sous 10 Mo, une seule
  au-dessus — a 24 Mo le centieme de mega ne veut plus rien dire — et jamais
  « 0 Mo » pour un projet qui existe : on montre « < 0,01 Mo ».

  UN PRESET DE DROITS NE DOIT PAS FERMER CE QU'IL NE CONNAIT PAS. Cherche apres
  un signalement du 21 septembre sur « Gerer les acces ». Le tableau des droits
  compte VINGT sections ; les presets de METIER (comedien, technicien, chef de
  poste, et les douze intitules) en definissent QUATORZE. Ils ont ete ecrits
  avant presentation, moodboard, ressources, rapports de script, depenses et
  contrats. La ligne remplissait donc ces six-la avec « aucun acces » : choisir
  « Comedien » RETIRAIT six acces sans le dire.
  LA REGLE EXISTAIT DEJA, A COTE : _normalize dit depuis longtemps qu'une
  section absente vaut LECTURE, jamais blocage — precisement pour qu'ajouter une
  section au tableau ne la referme pas pour tous les membres deja enregistres.
  Elle n'etait simplement pas appelee la. Elle l'est maintenant, dans applyPreset
  et dans les QUATRE sorties de getForMember, dont une seule sur quatre y passait.
  Ajouter une section demain ne refermera donc plus rien derriere nous.
  CE QUE CELA NE PROUVE PAS : que c'etait bien le defaut signale. Le reste a ete
  verifie et repond correctement — les 738 boutons de l'application pointent
  tous vers une fonction qui existe, et le tableau, les presets et la recolte
  des cases passent leurs tests dans un vrai DOM. La question reste ouverte au
  RESTE A FAIRE plutot que declaree reglee.

  « JE NE TROUVE PAS LA FICHE » ET « JE N'AI PAS LE DROIT DE LA VOIR » SONT DEUX
  CHOSES DIFFERENTES. Signale le 21 septembre sur un vrai projet a deux : B a
  acces au Depouillement mais pas aux onglets Personnages, Decors et Ressources.
  Chez A tout est rattache ; chez B, le depouillement declarait TOUS ses
  elements « sans fiche » et lui proposait d'en creer des centaines — en double
  de celles qui existent deja, et invisibles pour lui.
  CAUSE : le cloisonnement (v578) retire de la reponse serveur les cles
  auxquelles on n'a pas acces, et Store.getEmpty les recree VIDES pour que le
  reste de l'application ne plante pas. Un tableau vide et un tableau qu'on n'a
  pas le droit de lire se ressemblent trait pour trait — et tout ce qui conclut
  a une absence s'y trompait.
  LE GARDE-FOU EXISTAIT DEJA POUR L'ECRITURE, pas pour la LECTURE : la
  sauvegarde retire du paquet les cles cachees (sinon on effacerait le budget de
  tout le monde en enregistrant), et le declencheur SQL dit la meme chose cote
  serveur. Rien n'avait ete pose du cote des conclusions qu'on TIRE de ces
  tableaux vides. Aucune donnee n'a donc ete perdue — les fiches creees par B
  n'auraient meme pas ete enregistrees — mais l'ecran mentait, et la reparation
  proposee aurait fabrique le desordre qu'elle pretendait corriger.
  CORRECTION, UNE SEULE PORTE : Links.masquee(famille) repond a la question
  « cette famille m'est-elle cachee ? », a cote de la table qui relie deja les
  familles a leurs collections. Ce qui en decoule :
    - le controle des liens IGNORE les familles hors de portee — on ne conclut
      rien sur des donnees qu'on n'a pas — et le DIT, en toutes lettres, dans
      la fenetre de controle comme sur le compteur (« partiel ») ;
    - un element dont la fiche est cachee est montre RATTACHE, pas orphelin,
      avec pour explication « fiche rattachée, mais vous n'avez pas accès a
      cette section » ;
    - on ne rattache ni ne cree dans une famille cachee : on ne verrait pas les
      fiches existantes, donc on en fabriquerait forcement des doublons ;
    - meme regle dans l'autre sens, la ou elle manquait aussi : sans acces aux
      scenes, on ne propose plus de supprimer un decor ou un personnage « qui
      ne sert plus dans aucune scene ». Celui-la n'avait encore blesse
      personne, mais c'est exactement le meme raisonnement — et lui EFFACE.
  LA REGLE, pour tout ce qu'on ecrira ensuite : AVANT DE CONCLURE QU'UNE DONNEE
  MANQUE, DEMANDER SI ON AVAIT LE DROIT DE LA VOIR. Un tableau vide n'est pas
  une reponse, c'est parfois une porte fermee.

  LA LECON, ET ELLE EST DURE : les trois etapes precedentes etaient justes dans
  leur mecanique et fausses dans leur PREMISSE. On avait construit sur « les
  ecrans portent l'identifiant de leurs scenes » et sur « les ecritures passent
  par saveScene », deux choses qu'il suffisait de verifier et qu'on n'avait pas
  verifiees. Un mecanisme juste branche sur rien ne fait rien — et il en a
  l'air. Verifier ce a quoi on se branche vaut mieux que verifier ce qu'on
  branche.
