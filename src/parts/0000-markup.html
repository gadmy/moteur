MÉTHODE DE TRAVAIL
==================

Ce projet est développé en collaboration avec Claude (Anthropic).
À chaque nouvelle conversation :

0. DEPUIS v599, LE FICHIER EST DECOUPE. index.html est GENERE : on édite
   les morceaux de src/parts/ (un fichier par module, ~12 Ko en moyenne),
   puis « node tools/build.mjs » recolle le tout. La concaténation redonne
   le fichier à l'octet près — aucune transformation n'a lieu au passage.
   « node tools/build.mjs --check » vérifie sans rien écrire, et l'action
   GitHub le lance à chaque push. Ne JAMAIS éditer index.html directement.
1. Le dépôt est cloné dans la session ; Claude travaille UNIQUEMENT sur les
   fichiers du dépôt, jamais de mémoire. (Avant v599 : le fichier HTML
   unique était uploadé en début de conversation.)
2. L'utilisateur explique la fonctionnalité ou la correction souhaitée.
3. Claude applique lui-même les modifications sur le fichier avec ses
   outils (petits remplacements ciblés à ancre unique, jamais de réécriture
   complète, jamais de gros bloc d'un coup) ; grosses modifs découpées en
   plusieurs patchs successifs.
4. Après chaque lot : node --check sur les scripts, équilibre des balises,
   puis le fichier mis à jour est re-présenté pour téléchargement. Pas de
   code dans les réponses : un résumé bref de ce qui a changé, c'est tout.
5. Utilisateur non codeur : vocabulaire technique simplifié, réponses
   réduites au minimum vital pour comprendre.
6. Contraintes techniques : pas de bandeaux ═ (U+2550), pas d'emoji dans les
   doc.text() de jsPDF, pas d'IIFE async.
7. L'utilisateur teste dans le navigateur (recharger cache vide :
   Ctrl+Shift+R).
8. VERSION : un seul numéro, celui affiché dans l'appli sous la forme
   "vvXXX" (double v, grep-able) — PAS de numérotation séparée dans ce
   journal. Le développeur décide SEUL quand ce numéro change ; Claude ne le
   touche jamais de sa propre initiative, ni le numéro affiché ni le journal
   ci-dessous. Uniquement quand l'utilisateur dit explicitement "changement
   de conversation" : Claude résume proprement le journal de la version en
   cours (même style que les entrées précédentes), ouvre la nouvelle entrée
   "vvXXX+1" avec un journal vide, et met à jour le numéro affiché dans
   l'appli en conséquence. Ce journal vide se remplit au fil des échanges de
   la conversation qui suit, jusqu'au prochain "changement de conversation".

vv598 (19 septembre 2026) — PUBLIE.

  UNE PERSONNE, PLUSIEURS POSTES — LE CORPS EST UNIQUE. Même personne

  Nouveau socle PersonIdentity : reconnaissance d'une même personne par le
  COMPTE (publicProfileId, c'est-à-dire l'adresse mail de création du
  compte), avec repli sur l'email saisi pour les personnes entrées à la
  main, jamais rattachées à un compte. NE JAMAIS comparer l'email porté par
  une ligne d'équipe : la synchronisation y écrit l'email de CONTACT de la
  fiche, différent d'une fiche à l'autre. Le rapprochement traverse les
  familles : comédien et technicien d'un même compte sont le même corps.

  Feuille de service, champs de CORPS (PlanningTransport.model.BODY_PROPS :
  callTime, pickupTime, transport, vehicleId, plus withWho) recopiés sur
  toutes les lignes convoquées de la personne. La consigne, le PAT et le HMC
  restent PAR POSTE. Trois bugs réels fermés : une même personne occupait
  deux sièges dans une voiture de covoiturage ; elle se bloquait à elle-même
  son propre véhicule de régie (un véhicule n'a qu'un conducteur par jour) ;
  défaire le covoiturage depuis une ligne laissait l'autre accrochée. Un
  deuxième poste convoqué après coup hérite du trajet déjà posé (model.ensure)
  ; retirer un poste alors qu'un autre reste convoqué reporte les liens de
  covoiturage sur la ligne restante au lieu de les relâcher. Les trois
  convocations automatiques (comédiens de scène, comédien, technicien)
  passent désormais par model.ensure et non plus par un push direct.

  AGENDA ET TRANSPORTS : UNE SEULE FOIS PAR PERSONNE (etape 2). Outil commun
  PersonIdentity.dedupe, qui ne garde qu'une entree par corps dans une liste.
  Agenda du Planning : la liste des disponibilites ne propose la personne qu'une
  fois (son etiquette porte toutes ses fonctions, « Bob - Cadreur, Electro »),
  l'ecarte des que l'UN de ses postes est choisi, et le calendrier ne pose plus
  qu'une barre par personne et par jour au lieu de deux identiques. Tableaux
  TRANSPORTS, a l'ecran comme au PDF : une ligne par personne — c'est de la
  logistique, et deux lignes laissaient croire a deux vehicules ou deux pick-up
  a prevoir. Liste « part avec » : la personne ne se propose plus a elle-meme
  (elle ne monte pas dans sa propre voiture) et chaque autre n'y figure qu'une

  POSTE — le chef de chaque departement doit y retrouver sa personne ; seuls les
  tableaux de LOGISTIQUE sont regroupes. PIEGE TRAITE : une cle de covoiturage
  enregistree peut viser un AUTRE poste que celui retenu par le regroupement ;
  les comparaisons portent donc sur le corps, sinon un passager disparaissait de
  l'affichage.

  LE CORPS EST COMMUN A TOUTES LES CASQUETTES (etape 3). Telephone, vehicule,
  permis et agenda (dispos / indispos) vivaient dans CHAQUE casquette :
  dupliquer une fiche technicien dupliquait l'agenda, et corriger ses indispos
  sur une fiche laissait les autres perimees. Ces champs quittent

  champs sur le profil, sur un CLONE : les editeurs mutent les tableaux en place,

  sans enregistrer. MIGRATION DOUCE (_liftCommonToProfile, jouee au chargement de
  ses propres profils) : la premiere valeur trouvee dans les casquettes remonte
  au profil quand celui-ci n'a rien, puis la cle est EFFACEE de toutes les
  casquettes. Cet effacement est le coeur de la migration : partout la lecture
  est « casquette, sinon profil », et une copie oubliee continuerait de gagner —
  y compris un TABLEAU VIDE, vrai en JavaScript, qui aurait masque l'agenda

  proprietaire n'a pas sauvegarde, leurs casquettes font foi et le repli sur le

  AJOUT D'UNE FICHE TECHNICIEN — LA TUILE « + ». Le bouton « Dupliquer » quitte

  (departement, fonction, parcours, bande demo, tarif) et l'email de CONTACT ne
  sont jamais repris. Les valeurs copiees sont CLONEES : deux fiches ne partagent
  jamais le meme tableau de permis. Les emplacements vides n'ont plus de tuile
  grisee a eux (activateCrewCard supprimee, plus aucun appelant) : la tuile « + »
  reprend d'elle-meme le premier emplacement libre — donc le premier quand aucune
  fiche n'existe encore. GARDE : un emplacement REFERME mais non vide est rouvert

  les donnees. Le numero affiche sur les tuiles suit les fiches REMPLIES et non
  l'index du tableau, sans quoi un emplacement laisse vide donnait un « n°2 »

  PROFIL PUBLIC, deux correctifs decouverts en testant. 1) L'identite saisie

  duplication de fiche technicien s'abstient aussi quand le save a echoue.
  RESTE OUVERT : l'ancien formulaire de profil (deja liste plus haut comme

  Au passage, deux blocages du MODE LOCAL (file://), invisibles en ligne

vv599 (19 septembre 2026) — PUBLIE.

  DECOUPAGE DU FICHIER UNIQUE. index.html (4,62 Mo, 83 800 lignes) devient un
  fichier GENERE, reconstruit par tools/build.mjs a partir de 106 morceaux
  ranges dans src/parts/ : 98 fichiers JavaScript (12 Ko en mediane, 65 sous
  les 20 Ko), 2 feuilles de style, 6 blocs de page. Le decoupage suit les
  declarations de module de premier niveau ; le code qui suit un module sans
  en ouvrir un autre reste attache au morceau precedent.
  CHOIX CENTRAL : les morceaux sont des TRANCHES BRUTES du fichier, remises
  bout a bout dans l'ordre de leur prefixe numerique. Aucune transformation,
  donc la reconstruction redonne le fichier a l'OCTET PRES — verifie par
  empreinte SHA-256 identique avant et apres le premier decoupage. C'est ce
  qui rend ce chantier verifiable au lieu d'etre un pari.
  ECARTE : le passage a de vrais modules JavaScript (import / export). Les 95
  modules partagent aujourd'hui une seule portee ; les separer demanderait de
  reecrire toutes leurs references entre eux, casserait l'ouverture du fichier
  en double-clic (les navigateurs bloquent les modules en protocole file:) et
  imposerait 95 requetes au demarrage sans etape de construction.
  REGLE : ne JAMAIS editer index.html a la main. L'action GitHub
  « verifier-build » relance la reconstruction a chaque push et echoue si le
  fichier publie ne correspond plus a src/parts/.

  VIGNETTES DU STORYBOARD — CINQ PASSES, ET LA CAUSE ETAIT EN BASE. Symptome :
  dans la liste des plans, les images n'apparaissaient qu'apres avoir ouvert
  PUIS referme la fiche d'un plan, et alors toutes d'un coup. Quatre hypotheses
  successives sur le RENDU, toutes vraies mais toutes partielles, avant qu'une
  requete SQL ne donne la reponse. Dans l'ordre ou elles ont ete fermees :
    1) LES BLOBS REVOQUES. Les dessins ne passent pas par le cache d'images du
       navigateur : ils sont telecharges en blob par le SDK
       (StoryboardExport._resolveBlobUrl), et _loadPrintImg REVOQUAIT l'URL
       juste apres l'avoir dessinee — chaque rendu retelechargeait donc tout.
       Cache borne (150 entrees), demandes simultanees mutualisees, vide au
       changement de projet, plus de revocation apres dessin.
    2) LE CANVAS ORPHELIN. renderDrawingData capturait le CONTEXTE du canvas a
       l'appel, alors que les calques se dessinent APRES telechargement : un
       second rendu entre-temps et la peinture atterrissait dans un canvas
       retire du document. La fonction recoit desormais un IDENTIFIANT et
       retrouve le canvas au moment de peindre. Les calques sont aussi dessines
       l'un apres l'autre, dans l'ordre du dessin, et non plus dans leur ordre
       d'arrivee (un calque lourd du dessous recouvrait ceux du dessus).
    3) UNE GARDE QUI NE PASSAIT JAMAIS. La repeinte de fin de chargement etait
       gardee par « state.currentShotId === null ». Or state.currentShotId
       N'EXISTE PAS dans le code : la condition valait undefined === null, soit
       FAUX EN PERMANENCE. Defaut present DEUX FOIS (objets image et icones
       SVG). Remplacee par la bonne condition — ne pas redessiner la liste
       pendant qu'on EDITE un plan — avec repeinte coalescee
       (Storyboard.planifierRepeinteVignettes).
    4) L'UNIQUE TENTATIVE BRULEE. getOrCreateUploadedImage posait
       « img.src = Utils.signedUrlFor(...) » sans verifier le resultat ; cette
       fonction rend le CHEMIN BRUT tant que l'URL n'est pas signee, l'echec
       etait memorise DEFINITIVEMENT et l'image ne reessayait jamais. On
       s'abstient desormais sans rien mettre en cache. Puis, le diagnostic
       montrant « repeintes : 0 » et un cache vide, deuxieme chemin ajoute :
       URL directement utilisable (http, data:, blob:), sinon telechargement
       par le SDK comme les calques.
    5) LA VRAIE CAUSE, EN BASE. Le bucket 'projects' est PRIVE, et les 32
       objets image du projet teste stockaient une URL de forme
       /object/public/projects/... : une adresse publique sur un bucket prive
       est TOUJOURS refusee, ces images ne pouvaient jamais se charger.
       Utils.migrateProjPathsInData convertit justement ces URLs en chemins
       bruts, mais son appel dans Store etait garde par un drapeau BOOLEEN
       (_mediaPathsMigrated) : une fois pose, la migration ne repassait plus
       jamais, et les medias ajoutes APRES restaient en forme publique pour
       toujours (drapeau deja a true sur le projet, 7 projets sur 38 marques).
       Le drapeau devient VERSIONNE (valeur 2) : la migration, idempotente,
       rejoue une fois pour tout le monde.
  DEFENSE AJOUTEE, car la donnee peut redevenir sale : une URL de media projet
  n'est PLUS JAMAIS posee telle quelle — URL signee si le cache a repondu,
  sinon telechargement par le SDK ; data:, blob: et externes restent directes.
  Et les vignettes empruntent desormais le chemin de l'apercu plein ecran, seul
  a avoir toujours marche (Storyboard.dessinerObjetsImage, calquee sur
  StoryboardExport._loadPrintImg).
  TROIS REGLES A GARDER : pour une image qui ne s'affiche pas, REGARDER D'ABORD
  CE QUI EST STOCKE ; quand un ecran affiche un media et qu'un autre ne
  l'affiche pas sur la MEME donnee, faire emprunter au second le chemin du
  premier plutot que de le reparer ; et chercher, dans tout audit, les gardes
  qui comparent une propriete jamais ecrite — elles ne levent aucune erreur et
  desactivent silencieusement le code qu'elles protegent.
  OUTILS DE DIAGNOSTIC laisses en place : app.Storyboard.diagVignettes() liste
  plan par plan ce que la vignette a de quoi dessiner (calques visibles,
  calques stockes, blobs en cache, objets vectoriels, canvas present et dans le
  document, objets image prets / en cours / echoues / non signes, repeintes).

  ANCIEN FORMULAIRE DE PROFIL : LA CAUSE, ET PLUS LES SYMPTOMES. Constat fait
  en ouvrant le chantier : ce formulaire est deja INATTEIGNABLE — openFicheCard
  intercepte les quatre casquettes, chacune ouvre sa propre fiche, et plus
  aucun onclick n'ouvre l'ancienne modale. Il restait pourtant LU a deux
  endroits vivants, saveCurrentProfile et switchToProfile, qui rejouaient
  par-dessus la fiche les valeurs d'un formulaire que personne ne voyait : la
  CAUSE COMMUNE des deux bugs du 19 septembre, jusque-la seulement rustines
  (dont « le champ efface qui revenait », ou un champ vide dans la fiche se
  voyait repeupler par l'ancienne valeur au moment d'enregistrer). Ces deux
  lectures sont coupees ; le type du profil, seul element legitime qu'on en
  tirait, se deduit desormais des casquettes actives sans passer par le DOM.
  Au passage, firstEnabledFacet corrigee : elle testait facets.crew.enabled, or
  facets.crew est un TABLEAU depuis v597 — un compte purement technicien
  n'avait donc aucune casquette active a ses yeux. Reste la suppression du code
  mort, decrite au RESTE A FAIRE.

  PRECHAUFFAGE DES IMAGES revu deux fois. Un prechauffage existait deja
  (Utils.prefetchStoryboardImages / prefetchMoodboardImages) et son principe
  etait bon ; il partait jusqu'a 4 s trop tard, lancait des centaines d'images
  d'un coup, et ne disait jamais s'il avait travaille. Desormais : file commune
  servie 4 a la fois dans l'ordre, depart a 1 s, abstention totale en connexion
  econome (navigator.connection.saveData), et Utils.prefetchInfo() pour lire le
  bilan dans la console. Il visait aussi le mauvais canal : un calque de dessin
  ne se rechauffe pas avec une balise image mais en remplissant le cache de
  blobs (Utils._warmBlobs). Le collecteur du storyboard separe donc les DESSINS
  (blobs) des images TELEVERSEES (balises) ; le mood board, fait de vraies
  balises, reste sur le canal image.

  CHARGEMENT DIFFERE DES GROS MODULES : non fait, et l'estimation « rendu
  simple par le decoupage », notee plus tot dans la journee, etait FAUSSE —
  corrigee au RESTE A FAIRE. Le decoupage porte sur la SOURCE ; le fichier

  QUI N'EST PAS PARTI : un « c'est envoye » qui cache trois echecs est pire
  que pas d'envoi du tout.

  L'AGE SE CALCULE, IL NE SE TAPE PLUS. Un age ecrit a la main est juste le
  jour ou on l'ecrit et faux un an plus tard. La date de naissance entre dans
  les fiches comedien et technicien ; ON NE CREE PAS UN NOUVEAU CHAMP pour
  autant, la colonne « birthdate » existait deja. ELLE APPARTIENT A LA
  PERSONNE, PAS A LA CASQUETTE : elle rejoint les champs communs. Une seule
  porte pour la lire, PublicProfile.ageDe, et l'age devient un filtre pour
  TOUT LE MONDE, pas seulement les comediens. L'age tape reste accepte en
  repli.
  LES CHAMPS COMMUNS A TOUTES LES CASQUETTES LE DISENT maintenant — telephone,
  vehicule, disponibilites, date de naissance : les modifier modifie toutes
  les fiches du compte, et ce n'etait ecrit nulle part.

  PUBLIER UN PROJET NE SORT PLUS TOUT D'UN COUP. Le casting et l'equipe
  partent FERMES : ce sont les donnees des autres. Une fenetre demande section
  par section, rappelle ce qui sort de toute facon, et « Annuler » remet la
  case a sa place.

  BESOINS COMEDIENS : UNE SEULE LISTE, CELLE DES PERSONNAGES. Il en restait
  deux — les personnages du projet et les « roles a caster » ecrits a la main.
  Ce qui est publie suit desormais la meme source : un role distribue
  disparait des recherches sans qu'on ait rien a decocher. Les anciens roles
  ecrits a la main DEVIENNENT des personnages, une fois.
  ERREUR DE MA PART, CORRIGEE AUSSITOT : en branchant le tri sur les fiches,
  j'avais retire l'entree « casting » des personnages deja castes, en me
  disant qu'elle n'y servait plus. C'etait faux — on cherche aussi un
  remplacant, une doublure. LA REGLE : ajouter une porte ne donne pas le droit
  d'en fermer une autre.

  SE MONTRER SANS POUVOIR ETRE TROUVE, C'EST LE PIRE DES DEUX MONDES. Mesure :
  sur 288 profils publics, CENT QUATRE n'ont ni ville ni metier — ils sont
  dans l'Univers et n'apparaissent dans aucune recherche. Un triangle ⚠ le dit
  sur la carte de casquette, sur « Mon Espace » et sur « Mon Profil », et une
  fiche incomplete ne peut plus se cocher « visible ». ON N'INTERDIT RIEN DE
  CE QUI EST DEJA LA. Une seule table de regles pour les trois endroits.
  LE BANDEAU « VOTRE PROFIL EST COMPLET » A ETE RETIRE : il s'affichait en
  meme temps que le triangle, deux reponses opposees a la meme question.

  LES AIDES REPASSEES AU CRIBLE. Six affirmations du guide etaient devenues
  fausses, deux cibles de visite pointaient a cote, et il manquait UN TROU
  ENTIER : les series, ni dans le guide ni dans les visites. Les 166 notions
  des cours sont saines. LES VISITES GUIDEES SE CROYAIENT DANS UN PROJET
  DEPUIS L'ACCUEIL : revenir au hub MASQUE l'ecran du projet sans effacer
  l'identifiant courant. Une seule question maintenant, Tour.dansUnProjet,
  posee par les vingt-cinq etapes concernees — elle a ferme deux defauts
  opposes d'un coup.

  EXPORT PDF, QUATRE LOTS. Les bandeaux gris fonce pleine largeur partent (une
  page de dossier en portait trois) et les DOUZE copies du bandeau passent par
  une seule porte, PdfTheme.sectionBand. Les grands blancs du synopsis
  disparaissent. Les tableaux a deux colonnes cessent d'ecrire « (n scenes) »
  au milieu du nom. Et le nouveau titre gagne tous les niveaux.
  LE STORYBOARD MANQUAIT DANS UN EXPORT GLOBAL, et il a fallu trois pistes
  pour trouver : ce n'etait pas l'attente des images, c'etait qu'un plan peut
  porter son image A DEUX ENDROITS et que l'export ne lisait que la racine ;
  puis le canvas SOUILLE, qui s'affiche a l'ecran mais refuse d'etre lu. A
  RETENIR : « ca s'affiche » ne prouve RIEN sur ce qu'on pourra exporter.

  LE MATERIEL DES TECHNICIENS ETAIT UN CHAMP MORT-VIVANT : cameras, lenses,
  lights, sounds, grips, makeups s'affichaient partout et ne se remplissaient
  nulle part depuis le retrait du formulaire en v600. Rendu remplissable en
  DEUX listes, pas six.
  LE FORUM PERD SA PARTIE « RETOURS SITE » : dix-sept sous-categories pour un
  site qui a deja son ampoule de remarques. L'acces est retire, le code reste.

  LE TECHNICIEN NE DECLARE PAS UN METIER, IL DECLARE UN DEPARTEMENT, et
  j'avais tort sur le diagnostic precedent : mesure faite, leur champ « role »
  est vide partout mais leur departement est rempli. Les mots du departement
  rejoignent donc ceux du poste dans la recherche.
  QUATRE ROLES SUR CINQ NE PROPOSAIENT PERSONNE, ET LA CAUSE ETAIT DANS LES
  DONNEES, PAS DANS LE CODE. C'est la lecon de septembre, une troisieme fois :
  mesurer la donnee plutot que relire le code avec son propre vocabulaire.
  « CHEF OPERATRICE » NE RECONNAISSAIT PAS « CHEF OPERATEUR » — et le piege
  inverse, vu en ecrivant le test : « Realisateur·rice » et « Directeur·rice
  de casting » se reconnaissaient l'un l'autre par le mot « rice ».
  LA DISTANCE SE COMPTE EN KILOMETRES REELS, depuis la ville DU PROJET, pas
  celle tapee dans la recherche. Et si le projet n'a pas de ville, on le dit.
  J'AVAIS DETOURNE UN REGLAGE POSE POUR AUTRE CHOSE ET J'EN AVAIS FAIT UN
  COUPERET INVISIBLE : une liste vide qui ne s'explique pas donne l'impression
  d'un site vide. Le filtre se pose desormais a l'affichage, pas a la source.

  LE CASTING D'UNE FICHE OUVRE LE TRI. Depuis une fiche personnage ou
  technicien, « casting » ouvre la vue de tri comme depuis l'Univers : meme
  moteur, meme vue, une seule porte. Le besoin est fabrique depuis la fiche
  quand le projet ne le declare pas, et on ne quitte pas le projet.

  LES DOSSIERS DU HUB SE GLISSENT, ET SE RANGENT AUSSI ENTRE EUX. Un seul
  geste, trois intentions ; l'ordre est enregistre, et on renumerote la
  fratrie entiere a chaque deplacement plutot que de glisser des decimales.
  DEUX REFUS QUI SE VOIENT AVANT DE LACHER : un dossier pose sur lui-meme ou
  sur son propre descendant.

  LE PLANNING AVAIT DISPARU DES FICHES DE « MES PROFILS ». Regression de ma
  part : la question « de qui parle ce calendrier ? » etait posee A TROIS
  ENDROITS, chacun repondant « state.data.actors[index] » — avec un index de
  −1 en mode profil. Plus deux expressions qui refusaient le signe moins, et
  du code mort que j'avais ressuscite le matin meme. RESSUSCITER DU CODE MORT
  SANS SE DEMANDER POURQUOI IL ETAIT MORT EST UNE ERREUR EN SOI.

  « PERMISSION DENIED FOR TABLE PROJECTS » A LA CREATION D'UN PROJET. UN DROIT
  SQL N'EST PAS UNE REGLE RLS, et les deux rendent le meme code d'erreur : le
  GRANT dit si on a le droit de toucher la table, la regle dit quelles lignes
  on voit. Que ce soit un accident se demontre : la table portait TROIS regles
  de lecture pour ce role, et c'etait le seul trou du schema. La requete qui
  trouve ce genre de trou est gardee.

  LES GALERIES PHOTO : DE 3 A 10, ET EN MEILLEURE QUALITE. Le nombre etait
  ecrit A QUATRE ENDROITS plus deux fois dans les aides ; il vit maintenant
  dans CONFIG.maxGaleriePhotos. La qualite suivait deux regles selon la
  porte — 1920 px pour un projet, 800 px pour un profil public : un portrait y
  perdait ses traits au moment precis ou on l'agrandit pour juger un casting.

  LES ONGLETS ONT LEUR ANIMATION, ET ELLE A COUTE TROIS PASSAGES. « Il y a
  encore deux onglets par la-bas » : une pastille compte ce qui est sorti de
  l'ecran, et un onglet coupe en deux n'est pas « cache ». Puis un onglet qui
  part se voit partir. Puis « l'animation n'est pas tres visible » — et elle ne
  l'etait pas, parce que la largeur ne tombait a zero qu'a la DERNIERE image :
  l'onglet palissait sur place, puis TOUTE la barre sautait pour combler le
  trou. Elle se retracte maintenant sur toute la duree, les voisins se
  rabattent avec elle, et dans l'autre sens ils s'ecartent.
  LES CATEGORIES DU HAUT N'AVAIENT RIEN, et le bouton « Masqués » SURGISSAIT a
  l'instant precis ou l'onglet finissait de partir — un element qui part et un
  autre qui arrive dans la meme image. Tout passe desormais par la meme porte,
  meme duree, meme courbe.
  MEGA BUG DE MA PART, SIGNALE DANS L'HEURE : « quand je mets reafficher, les
  onglets disparaissent POUR DE BON » — toute la ligne des categories. DEUX
  DEFAUTS, MEME OUBLI DERRIERE LES DEUX : l'animation figeait une largeur en
  pixels et personne ne l'enlevait. Au retour on mesurait donc zero et on
  renoncait ; et le refus « impossible de masquer le dernier » arrivait APRES
  l'animation, laissant la derniere categorie invisible. Les onglets du bas y
  echappaient par hasard, leur barre etant reconstruite a chaque changement de
  categorie.
  LA LECON, GENERALE : UNE ANIMATION QUI ECRIT SUR L'ELEMENT DOIT EFFACER CE
  QU'ELLE A ECRIT. Tant qu'elle laisse une largeur en pixels derriere elle,
  l'element ment sur sa taille a tous ceux qui le mesureront ensuite — et le
  premier a le mesurer, c'est l'animation suivante.

  LES MENUS S'OUVRENT ET SE FERMENT EN DOUCEUR. L'ouverture ne coute pas une
  ligne de JavaScript : un element qui passe de « pas affiche » a « affiche »
  rejoue son animation tout seul, donc aucun menu n'est oublie. La fermeture,
  elle, doit etre retenue, d'ou une porte unique. TROIS PIEGES, TOUS DUS AU
  MEME FAIT — pendant la fermeture le menu est ENCORE LA : rouvrir doit
  annuler la fermeture ; deux demandes ne doivent fermer qu'une fois ; et un
  menu designe par son IDENTIFIANT doit le rendre TOUT DE SUITE, sinon un menu
  rouvert aussitot existe a deux exemplaires et c'est toujours le mauvais
  qu'on retrouve.

  INFOBULLES SUR TABLETTE. Sans survol, un champ rempli n'affichait plus rien
  qu'une valeur nue. La bulle s'ouvre au FOCUS quand l'appareil n'a pas de
  survol. TROIS PIEGES, tous dus au meme fait : sur un ecran tactile TOUT
  arrive APRES le focus — le clic, le defilement, le clavier virtuel. Le test
  « pas de survol » est refait a chaque focus, jamais memorise au demarrage :
  une tablette a laquelle on branche une souris redevient un poste normal.
  L'AMPOULE DES REMARQUES brille quelques instants entre 1 et 10 minutes, avec
  un delai tire au hasard : un battement regulier devient un decor.

  LES PHOTOS DE COMEDIENS, DE PERSONNAGES ET DE DECORS NE S'AFFICHAIENT PLUS.
  ON SIGNE AVANT DE VALIDER, et l'ordre est tout : la valeur est d'abord
  resolue, ensuite verifiee. Une seule ligne, et tous les appelants sont
  servis.
  SOURCE UNIQUE D'UNE VIGNETTE, ET FIN DE L'HISTOIRE. Rien n'est efface pour
  autant : l'ancienne image dort dans les donnees.
  LE FAUX CANAL NE SAVAIT PAS SE DESABONNER : en mode fichier le temps reel
  est coupe et remplace par un faux canal, qui n'avait pas la fonction que
  tout le monde appelait. Le defaut dormait depuis que le mode fichier existe.

  DEFAUT SILENCIEUX TROUVE EN MESURANT LA BASE, LE 23 : le lien personnage →
  comedien s'ecrit « actor_id », et ma fonction lisait « actorId ». 22
  personnages distribues en base, TOUS en actor_id ; 41 lectures en actor_id
  dans le code contre une seule, la mienne. Les colonnes de roles du plan de
  travail portaient donc le nom du COMEDIEN au lieu de celui du PERSONNAGE,
  sans rien casser puisqu'il y avait un repli. C'est la pire sorte de defaut :
  il ne se plaint pas.

  TROIS LECONS DE BANC D'ESSAI, PAYEES CHACUNE AU MOINS DEUX FOIS :
    - ON NE CONCLUT PAS SUR DES ELEMENTS DE TAILLE ZERO. Un panneau cache
      repond « rien » a toutes les questions et le banc passe en croyant avoir
      mesure. Les bancs refusent maintenant de conclure si rien n'est affiche.
    - ON NE MESURE PAS L'ETAT INTERNE QUAND LE DEFAUT EST VISUEL.
      hiddenCategories etait JUSTE pendant tout le bug des categories : elles
      n'etaient pas dans la liste des cachees, et pourtant on ne les voyait
      pas. On mesure la largeur et l'opacite reelles.
    - UN BANC QUI FIGE UNE DUREE PUNIT UNE DECISION D'ERGONOMIE. Celui des
      onglets figeait 260 ms et repassait rouge des qu'on ralentissait
      l'animation, sans qu'aucun defaut n'existe. Il lit la duree du module.

vv602 (23 septembre 2026) — EN COURS.

  LES SEPT FAMILLES DE COMEDIENS ET LEUR NUMERO OFFICIEL. Silhouettes
  parlantes et muettes, doublures, cascadeurs, pilotes : tous restent des
  COMEDIENS, classes par GROUPE. Une seule piece les connait desormais,
  CastFamilies : la feuille de service a l'ecran, son PDF et le plan de
  travail lisaient chacun les groupes a leur maniere, par leur nom.
  QUATRE GROUPES DE PLUS dans chaque projet : Silhouettes muettes,
  Cascadeurs, Pilotes, et « Silhouettes » devient « Silhouettes
  parlantes » — sauf s'il a ete renomme par l'utilisateur. Mesure en base
  avant de trancher : un seul projet avait des silhouettes (deux), elles
  deviennent donc parlantes ; on les glisse dans « muettes » si besoin.
  LE NUMERO SE CALCULE, IL NE SE SAISIT PAS : roles 1, 2, 3... ; parlantes
  21, 22... ; muettes S1 ; doublures D1 ; cascadeurs C1 ; pilotes P1. L'ordre
  est celui des groupes (Casting Principal avant Roles Secondaires), puis
  des comediens dans leur groupe. Changer quelqu'un de groupe change son
  numero. La figuration n'a pas de numero officiel.
  UNE PLAGE EST UN REPERE, PAS UN MUR : un seizieme role prend le 16. Seule
  garde : si les roles depassent 20, les parlantes commencent juste apres
  eux, sinon deux personnes porteraient le meme numero. Un groupe au nom
  inconnu (« Seconds roles creoles ») reste un role.
  OU LE NUMERO APPARAIT : colonne N° de la feuille de service (ecran et
  PDF), colonnes du plan de travail (un bandeau par famille), grille des
  presences, et un badge sur la fiche du comedien.
  UNE FAMILLE SANS PERSONNE N'A PAS DE TABLEAU sur la feuille a l'ecran : six
  tableaux vides auraient noye la feuille. Chaque famille garde son
  interrupteur pour le jour. Les cles deja enregistrees (sil, dbl) n'ont
  pas change, sinon des tableaux masques seraient revenus.
  Les previsions du lendemain gagnent une ligne « Cascadeurs / pilotes ».
  NON FAIT : la case « CASCADEURS / PILOTES » du depouillement AFAR reste
  alimentee par le depouillement des scenes, comme avant.
  PUIS LA LISTE SE FERME, a la demande du developpeur : « on met les
  categories utilisees dans l'industrie et on n'autorise pas d'autres
  groupes qui n'auraient pas de numero officiel ». HUIT GROUPES, dans
  l'ordre du metier : Casting principal, Roles secondaires, Silhouettes
  parlantes, Silhouettes muettes, Doublures, Cascadeurs, Pilotes,
  Figuration. Plus de bouton « Nouveau groupe » chez les comediens (les
  autres onglets gardent le leur). La famille se lit desormais par
  l'IDENTIFIANT du groupe, le nom ne sert plus que de repli.
  UN GROUPE MAISON DISPARAIT A L'OUVERTURE, ses comediens passent dans le
  groupe officiel de la meme famille — Roles secondaires pour un nom
  inconnu. Seul cas en base : « Seconds roles creoles » (2 comediens), dont
  les numeros ne bougent pas. Cette reprise se fait APRES la baseline, donc
  elle s'enregistre une fois ; et JAMAIS sans le droit de voir les
  comediens, sinon on effacerait un groupe sans pouvoir y reprendre
  personne.
  LES GROUPES VIDES RESTENT VISIBLES dans l'onglet Comedien.nes. Le
  developpeur ne voyait pas les nouveaux groupes : la regle commune cache
  un groupe vide hors glisser-deposer. Juste pour des groupes libres, fausse
  pour une liste fermee — on doit voir ou ranger les gens.
  PUIS LES TECHNICIENS, meme regle. Question du developpeur : « y a-t-il des
  groupes officiels comme ca ailleurs ? » Verifie dans le code : SEULS les
  departements techniques sont LUS par un document — bandeau d'equipe de la
  feuille par corps de metier, contacts de production (cherches dans
  « Production » seulement), responsable de chaque ligne du depouillement,
  liste des fonctions de la fiche. Un technicien dans un groupe maison
  tombait dans la case fourre-tout du bandeau. Les dix-huit departements
  deviennent donc une liste fermee (« Autre » existe pour le reste), plus de
  bouton « Nouveau departement ». Seul cas en base : « Equipe aquatique »
  (1 personne), rangee en IMAGE a la demande du developpeur ; un nom inconnu
  part dans « Autre ». Meme precautions que pour les comediens : apres la
  baseline, et jamais sans le droit de voir l'equipe (CrewDepartements).
  PERSONNAGES, DECORS, RESSOURCES, STRUCTURES GARDENT LEURS GROUPES LIBRES :
  rien d'officiel ne les lit, ils ne servent qu'a ranger. La strategie « on
  cree ses groupes partout » reste la bonne LA OU AUCUN DOCUMENT NE LES LIT.
  Les departements vides restent caches hors glisser-deposer : dix-huit
  sections vides noieraient l'onglet ; le menu de la fiche les propose tous.

  L'EQUIPE B EN PARALLELE : UNE DEUXIEME FEUILLE LE MEME JOUR. Le
  developpeur ne pouvait pas la tester : ajouter une scene a un jour deja
  prevu la mettait sur la feuille existante, et creer une deuxieme journee a
  la meme date faisait compter DEUX jours de tournage (J1 et J2) au plan de
  travail — mesure dans le code avant de le dire.
  CE QU'ON VOIT : un onglet « ➕ Équipe B » dans la fenetre du jour. Au
  premier clic il demande un nom (« Équipe sous-marine ») et ouvre une
  feuille de service complete — ses scenes, ses convocations, son decor, ses
  horaires, ses notes — avec « FEUILLE DE SERVICE EQUIPE SOUS-MARINE » dans
  son bandeau (la principale dit « PRINCIPALE »). La croix de l'onglet la
  supprime SANS RIEN PERDRE : ses scenes et convocations repassent sur la
  feuille principale. L'impression propose la principale, la B, ou tout.
  LE POINT D'ARCHITECTURE (EquipeB) : les scenes et convocations de l'equipe
  B restent DANS day.scenes et day.callSheet, MARQUEES « equipe: 'B' ». La
  quinzaine d'endroits qui demandent « cette scene est-elle planifiee ? » ou
  « qui est la ce jour-la ? » continuent donc de marcher sans une ligne de
  retouche. day.equipeB ne porte que l'en-tete de la feuille B ; la date, le
  type et le numero restent ceux de la journee.
  A L'ECRAN, LA FENETRE TRAVAILLE SUR UNE VUE : quand une equipe B existe,
  Planning.tempShootDay est la vue d'UNE equipe et le jour complet est garde
  a part (Planning._jourComplet) ; changer d'onglet ou enregistrer rentre la
  vue dans le jour. SANS EQUIPE B, RIEN DE TOUT CELA N'EXISTE : la fenetre
  marche exactement comme avant. PIEGE EVITE : saveShootDay recopiait les
  scenes champ par champ et aurait perdu la marque « B » en silence.
  AU PLAN DE TRAVAIL : colonne « Éq. B » (nom, decor, sequences), affichee
  seulement si un jour en a une. Decors, sequences, I/E et effet de la ligne
  sont ceux de la feuille principale ; la duree, les personnages, les
  ressources et les presences comptent LES DEUX equipes — c'est la journee
  qui les paie. Le jour compte UNE fois.
  La feuille figuration dediee reste un reglage de la feuille principale ;
  sur la feuille B, la figuration est toujours nommee.
  VERIFIE dans un navigateur de bout en bout : creer, remplir, changer
  d'onglet, enregistrer, rouvrir, supprimer. Le PDF lui-meme n'a pas pu etre
  genere ici (bibliotheque bloquee par le reseau).
  NON FAIT : la grille verticale des presences montre les decors des deux
  equipes melanges dans sa bande « DECORS ».

  LES HEURES SUPPLEMENTAIRES PREVUES, derniere colonne du modele AFAR. Deux
  colonnes au plan de travail (ecran et PDF) : « H. sup » du jour, et
  « +/- », l'ecart CUMULE a la journee de reference depuis le debut du
  tournage — les journees courtes compensent-elles les longues ? La case
  « H. supp eventuelles » de la feuille de service, vide depuis toujours
  (« aucun champ dans l'app »), se remplit a l'ecran et en PDF, et suit la
  saisie des horaires sans rejouer la feuille.
  LE CALCUL : fin prevue - convocation - repas. LE SEUIL EST CELUI DU BUDGET
  (Reglages du budget, « Seuil heures sup », 8 h par defaut) : il existait
  deja pour la paie, un second chiffre au plan de travail aurait fini par
  la contredire.
  DEUX PIEGES, les deux payes en test : UNE JOURNEE QUI PASSE MINUIT
  (15:00 -> 03:00) fait 12 h, pas -12 h. Et L'APPLI POSE UN REPAS 13:00-14:00
  PAR DEFAUT sur chaque journee : sur une nuit, il tombe hors des horaires et
  retirait une heure a tort. On ne deduit plus que la part du repas qui
  tombe DANS les horaires.
  Sans convocation ou sans fin prevue : case vide, pas un zero — on ne sait
  pas. La colonne « Horaires » montre desormais debut ET fin (07:00-19:00).

  DIAGNOSTIC COMPLET, demande par le developpeur (« code mort, erreur,
  imperfection, nommage, securite, tout »). Quatre analyses en parallele,
  plus les avertissements de la base. Rapport complet donne en conversation ;
  ce qui reste a faire est au RESTE A FAIRE.
  UNE ERREUR A MOI, TROUVEE PAR L'AUDIT : t.html, copie de test de 5 Mo avec
  une porte ouverte sur l'etat de l'appli, embarquee dans le commit de
  l'equipe B et donc SERVIE PAR LE SITE. Cause : la commande qui arretait le
  serveur de test (pkill -f « http.server ») s'est tuee elle-meme avant
  d'effacer la copie. Retiree. LECON : arreter un serveur de test par
  « timeout », jamais par pkill sur une ligne de commande qui contient le
  motif ; et relire git status avant tout git add -A.
  LES QUATRE FAILLES CRITIQUES, CORRIGEES LE JOUR MEME :
  1. LES PROFILS SE LISAIENT SANS COMPTE (e-mail, telephone, naissance,
     coordonnees), avec la seule cle publique de la page. La lecture est
     retiree au role anonyme. RESTE : un compte connecte lit encore toutes les
     colonnes de tous les profils — a traiter, c'est un chantier (dix lectures
     « tout » dans l'appli a remplacer).
  2. LE CLOISONNEMENT SE CONTOURNAIT : la colonne data des projets se lisait
     en direct. C'est une REGRESSION de v601 : le correctif « on ne peut plus
     creer de projet » avait rendu la lecture de TOUTE la table. Les connectes
     lisent la table SANS la colonne data ; les deux creations de projet, qui
     relisaient la ligne entiere, nomment leurs colonnes. Verifie en se
     faisant passer pour un connecte : liste, ouverture, creation marchent,
     data refusee.
  3. XSS SUR LA FICHE D'UN PROJET PUBLIC : dates, type, genre, region, roles
     recherches etaient inseres bruts — le code d'un proprietaire s'executait
     chez tout visiteur de l'Univers. Et Utils.escape NE PROTEGE PAS un texte
     place en argument d'un onclick : le navigateur redecode &#39; avant
     d'executer. Nouvel outil Utils.jsArg pour ce cas, pose sur les boutons
     entre utilisateurs (Contacter, Signaler, recherche d'equipe, revoquer).
     IL RESTE ENVIRON 45 onclick avec le vieux motif, presque tous sur des
     donnees internes au projet.
  4. LES CANAUX TEMPS REEL ETAIENT PUBLICS : quiconque connaissait
     l'identifiant d'un projet ecoutait le mini-chat, et pouvait envoyer un
     « patch » que l'appli FUSIONNAIT chez les membres — qui l'auraient
     ensuite enregistre. L'appli ne fusionne plus rien de ce canal (relecture
     filtree seulement), et les canaux project_ et minichat_ sont PRIVES :
     regle sur realtime.messages, seuls proprietaire et membres acceptes
