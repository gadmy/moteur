# Vérifie que index.html correspond bien aux morceaux de src/parts.
#
# index.html est un fichier GÉNÉRÉ. Cette action est le garde-fou : si
# quelqu'un le modifie à la main sans reporter la modification dans
# src/parts/, elle échoue et dit où se situe l'écart.
name: verifier-build

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: index.html correspond-il a src/parts ?
        run: node tools/build.mjs --check
